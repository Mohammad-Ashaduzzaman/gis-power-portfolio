 attribute rules and ModelBuilder","ArcGIS Enterprise / Online Web GIS","Field Maps / Survey123 for inspection and maintenance","QGIS + PostGIS / pgRouting alternatives","Single-file Leaflet Web GIS"],"assumptions":["All feeders, substations, transformers, customers, loads, outages and condition records are synthetic portfolio data.","Voltage drop, current and technical-loss calculations are simplified planning screens, not a certified load-flow or protection study.","Normal/emergency loading thresholds are demonstration assumptions and must be replaced by utility-approved ratings and operating standards.","Source-path visualization is connectivity context, not an outage switching or protection-operation instruction.","Transformer/feeder priorities are asset-management screening outputs requiring engineering and field validation."]},"data":[{"name":"Distribution Substations","type":"Point","role":"33/11 kV feeder sources and bus context.","fields":"substation_id, voltage, transformer_capacity_mva, condition, source_bus"},{"name":"11 kV Feeders","type":"Circuit Table","role":"Radial feeder identity, source, voltage and operating criteria.","fields":"feeder_id, substation_id, nominal_voltage, loading limits, protection scheme"},{"name":"MV Line Segments","type":"Polyline","role":"Feeder trunk/lateral geometry and conductor electrical attributes.","fields":"segment_id, feeder_id, endpoints, conductor, ampacity, R, X, length, condition"},{"name":"Distribution Transformers","type":"Point","role":"Asset rating, condition, customer demand and scenario loading.","fields":"transformer_id, feeder_id, rating_kva, base_peak_kw, phase loads, condition, customer_count"},{"name":"Customer / Load Clusters","type":"Point / Related Table","role":"Aggregated downstream customers and phase-specific diversified demand.","fields":"cluster_id, transformer_id, phase, category, customers, base_peak_kw, critical_service"},{"name":"Switches / Protection","type":"Point","role":"VCBs, reclosers, sectionalizers and lateral fuses.","fields":"device_id, feeder_id, node_id, type, status, remote_control, condition"},{"name":"Poles / Structures","type":"Point","role":"Distribution support structures and field condition.","fields":"pole_id, feeder_id, type, height, condition, leaning_flag"},{"name":"Outage History","type":"Related Table","role":"Reliability context for feeders/transformers.","fields":"outage_id, feeder_id, transformer_id, duration, affected_customers, cause"},{"name":"Inspections","type":"Related Table","role":"Transformer field-condition observations.","fields":"inspection_id, transformer_id, oil_leak, bushing, earthing, thermal_hotspot, vegetation"},{"name":"Work Orders","type":"Related Table","role":"Maintenance / reinforcement actions linked to transformers/feeders.","fields":"work_order_id, transformer_id, work_type, priority, status, target_date"},{"name":"Dynamic Scenario Results","type":"Derived","role":"Transformer loading, feeder current, voltage, loss, phase imbalance and planning priority.","fields":"utilization, voltage_pu, phase_imbalance, capacity_margin, risk_score, priority_class"}],"desktop":[{"step_no":1,"stage":"Define distribution GIS scope","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Asset-management / planning requirements","output":"distribution GIS scope output","why":"Define feeder, transformer, capacity, voltage, reliability and field-maintenance questions."},{"step_no":2,"stage":"Create enterprise distribution data model","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Geodatabase / Utility Network design","output":"enterprise distribution data model output","why":"Define substations, feeders, lines, devices, transformers, poles, customers and related tables."},{"step_no":3,"stage":"Assign persistent asset IDs","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Asset ID governance","output":"Assign persistent asset IDs output","why":"Ensure every network and equipment record has a stable unique identifier."},{"step_no":4,"stage":"Load / survey substations","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Feature class creation","output":"Load / survey substations output","why":"Create distribution source substations and bus references."},{"step_no":5,"stage":"Load feeder circuits","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Polyline editing / asset import","output":"Load feeder circuits output","why":"Build 11 kV feeder routes with feeder and conductor attribution."},{"step_no":6,"stage":"Build network connectivity","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Topology / Utility Network topology","output":"Build network connectivity output","why":"Connect source buses, line nodes, laterals, devices and transformers."},{"step_no":7,"stage":"Load switches and protection devices","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Device feature class","output":"Load switches and protection devices output","why":"Represent VCBs, reclosers, sectionalizers and lateral fuses."},{"step_no":8,"stage":"Load distribution transformers","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Device / structure association","output":"Load distribution transformers output","why":"Store rating, voltage, phase, installation, metering and condition."},{"step_no":9,"stage":"Load poles / support structures","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Structure feature class","output":"Load poles / support structures output","why":"Maintain pole location, type, height and condition."},{"step_no":10,"stage":"Load customer / load clusters","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Related point/table","output":"Load customer / load clusters output","why":"Aggregate customers and demand by transformer and phase."},{"step_no":11,"stage":"Create feeder-to-transformer relationships","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Relationship class / associations","output":"feeder-to-transformer relationships output","why":"Relate every transformer to feeder, source and downstream customer clusters."},{"step_no":12,"stage":"Validate radial topology","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Topology / network QA","output":"Validate radial topology output","why":"Check disconnected segments, loops, duplicate nodes and source assignment."},{"step_no":13,"stage":"Prepare load readings / demand assumptions","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Meter import / load profile table","output":"Prepare load readings / demand assumptions output","why":"Create transformer and feeder demand inputs by scenario."},{"step_no":14,"stage":"Calculate diversified transformer demand","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Summary Statistics / Calculate Field","output":"Calculate diversified transformer demand output","why":"Aggregate customer-cluster diversified peak demand."},{"step_no":15,"stage":"Calculate transformer kVA loading","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Field calculation","output":"Calculate transformer kVA loading output","why":"Convert scenario kW to kVA and transformer utilization."},{"step_no":16,"stage":"Calculate phase loading","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Grouped statistics","output":"Calculate phase loading output","why":"Aggregate A/B/C phase demand by transformer."},{"step_no":17,"stage":"Calculate phase imbalance","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Field calculation","output":"Calculate phase imbalance output","why":"Compute maximum phase deviation from three-phase average."},{"step_no":18,"stage":"Aggregate downstream feeder load","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Network order / graph accumulation","output":"Aggregate downstream feeder load output","why":"Sum transformer load downstream of each feeder segment."},{"step_no":19,"stage":"Calculate feeder segment current","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Electrical screening calculation","output":"Calculate feeder segment current output","why":"Convert downstream kVA to three-phase current."},{"step_no":20,"stage":"Calculate conductor utilization","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Join conductor capacity / Calculate Field","output":"Calculate conductor utilization output","why":"Compare current with segment ampacity."},{"step_no":21,"stage":"Estimate segment voltage drop","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Impedance screening","output":"Estimate segment voltage drop output","why":"Estimate voltage drop using R/X, current, power factor and segment length."},{"step_no":22,"stage":"Accumulate transformer voltage profile","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Path accumulation","output":"Accumulate transformer voltage profile output","why":"Sum upstream voltage drop from substation to each transformer."},{"step_no":23,"stage":"Screen technical losses","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"I²R screening","output":"Screen technical losses output","why":"Estimate three-phase conductor loss for planning comparison."},{"step_no":24,"stage":"Calculate transformer capacity margin","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Field calculation","output":"Calculate transformer capacity margin output","why":"Identify headroom or overload under each demand scenario."},{"step_no":25,"stage":"Create asset-condition score","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Inspection + condition model","output":"asset-condition score output","why":"Translate equipment/line observations into maintainable condition indicators."},{"step_no":26,"stage":"Summarize reliability history","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Outage table / Summary Statistics","output":"Summarize reliability history output","why":"Calculate feeder outage count, duration and affected-customer context."},{"step_no":27,"stage":"Calculate transformer planning priority","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Weighted screening model","output":"Calculate transformer planning priority output","why":"Combine loading, voltage, imbalance, condition and outage-history factors."},{"step_no":28,"stage":"Calculate feeder planning risk","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Feeder summary model","output":"Calculate feeder planning risk output","why":"Combine segment loading, voltage, transformer priorities, loss and reliability."},{"step_no":29,"stage":"Create transformer service clusters","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Spatial relationship / service-area context","output":"transformer service clusters output","why":"Visualize customer/load clusters served by each transformer."},{"step_no":30,"stage":"Create source-path context","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Network path / upstream association","output":"source-path context output","why":"Show the feeder path from a selected transformer back to its source substation."},{"step_no":31,"stage":"Run growth scenarios","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Scenario parameter / ModelBuilder","output":"Run growth scenarios output","why":"Test normal, peak, hot-day and planning demand with additional growth."},{"step_no":32,"stage":"Identify transformer-upgrade candidates","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Ranking / selection","output":"Identify transformer-upgrade candidates output","why":"Prioritize overloaded, low-voltage or poor-condition transformers."},{"step_no":33,"stage":"Identify feeder reinforcement candidates","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Segment / feeder ranking","output":"Identify feeder reinforcement candidates output","why":"Prioritize conductor or feeder sections with low capacity margin and voltage issues."},{"step_no":34,"stage":"Integrate field inspections and work orders","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Field Maps / Survey123 / maintenance table","output":"Integrate field inspections and work orders output","why":"Close the loop from map finding to field action."},{"step_no":35,"stage":"Publish and QA Web GIS","input":"Controlled distribution asset/load data or previous-stage output","gis_method":"Web map / app + export QA","output":"Publish and QA Web GIS output","why":"Publish synchronized operational views with documented planning limitations."}],"analysis":[{"title":"Transformer Loading","detail":"Scenario kW × additional growth is converted to kVA using the demonstration power factor, then divided by transformer nameplate kVA to calculate utilization and capacity margin."},{"title":"Phase Imbalance","detail":"A/B/C customer-cluster demand is aggregated at each transformer. Imbalance = maximum absolute deviation from average phase load ÷ average × 100."},{"title":"Downstream Feeder Load","detail":"For each radial trunk segment, all transformers located downstream of that segment are accumulated. Lateral segments carry their individual transformer demand."},{"title":"Current / Conductor Loading","detail":"Three-phase current is screened from downstream kVA using I = kVA / (√3 × kV). Segment utilization compares that current with conductor ampacity."},{"title":"Voltage-Drop Screening","detail":"Simplified three-phase voltage drop uses segment R/X, load current, power factor and length. Transformer voltage is the cumulative upstream drop from the 11 kV source."},{"title":"Technical-Loss Screening","detail":"Segment loss is estimated using 3 × I² × R × length. It is useful for comparative planning, not revenue-grade loss settlement."},{"title":"Transformer Planning Priority","detail":"30% overload stress + 20% voltage deficit + 15% phase imbalance + 20% condition + 15% outage-history factor. Classes: Low / Moderate / High / Critical."},{"title":"Feeder Planning Risk","detail":"Feeder risk combines transformer priorities, maximum segment loading, minimum voltage, technical-loss intensity and outage history."},{"title":"Growth Scenario","detail":"Normal, Evening Peak, Hot Day and Planning Peak multipliers are combined with an additional 0–40% demand-growth slider to test headroom and reinforcement needs."}],"outputs":["Distribution asset inventory map","Feeder circuit map","Transformer loading map","Feeder segment loading map","Voltage-profile map","Phase-imbalance map","Transformer condition map","Capacity-margin map","Technical-loss screening map","Transformer upgrade-priority register","Feeder reinforcement ranking","Customer/service-cluster view","Selected transformer source-path view","Reliability / outage summary","Inspection and work-order register","Single-file distribution Web GIS"],"qa":["Every transformer references a valid feeder, node and lateral segment.","Every customer/load cluster references a valid t function calculate(){
 const key=[activeScenario,growthPct].join('|');if(calcCache?.key===key)return calcCache.value;
 const mult=scenario().multiplier*(1+growthPct/100),pf=.92,sinphi=Math.sqrt(1-pf*pf);
 const outageFeeder={};APP.feeders.forEach(f=>outageFeeder[f.feeder_id]={count:0,duration:0,affected:0});
 const outageTrans={};APP.outages.forEach(o=>{const x=outageFeeder[o.feeder_id];if(x){x.count++;x.duration+=num(o.duration_min);x.affected+=num(o.affected_customers)}if(o.transformer_id)outageTrans[o.transformer_id]=(outageTrans[o.transformer_id]||0)+1});
 const trows=APP.transformers.map(t=>{
   const kw=num(t.base_peak_kw)*mult,kva=kw/pf,util=kva/num(t.rating_kva)*100;
   const a=num(t.phase_a_kw)*mult,b=num(t.phase_b_kw)*mult,c=num(t.phase_c_kw)*mult,avg=(a+b+c)/3;
   const imbalance=avg>0?Math.max(Math.abs(a-avg),Math.abs(b-avg),Math.abs(c-avg))/avg*100:0;
   return {...t,scenario_kw:kw,scenario_kva:kva,utilization_pct:util,capacity_margin_kva:num(t.rating_kva)-kva,capacity_margin_pct:(num(t.rating_kva)-kva)/Math.max(1,num(t.rating_kva))*100,phase_a_scenario_kw:a,phase_b_scenario_kw:b,phase_c_scenario_kw:c,phase_imbalance_pct:imbalance,
     transformer_outage_count:outageTrans[t.transformer_id]||0,feeder_outage_count:outageFeeder[t.feeder_id]?.count||0}
 });
 const tmap=Object.fromEntries(trows.map(t=>[t.transformer_id,t]));
 const segRows=APP.segments.map(s=>{
   let kva=0;
   if(s.segment_type==='Trunk')kva=trows.filter(t=>t.feeder_id===s.feeder_id&&num(t.trunk_index)>=num(s.sequence_index)).reduce((z,t)=>z+t.scenario_kva,0);
   else kva=tmap[s.transformer_id]?.scenario_kva||0;
   const current=kva/(Math.sqrt(3)*11),util=current/num(s.ampacity_a)*100;
   const drop=Math.sqrt(3)*current*(num(s.r_ohm_km)*pf+num(s.x_ohm_km)*sinphi)*num(s.length_km)/11000*100;
   const loss=3*current*current*num(s.r_ohm_km)*num(s.length_km)/1000;
   return {...s,downstream_kva:kva,current_a:current,utilization_pct:util,voltage_drop_pct:drop,loss_kw:loss}
 });
 const smap=Object.fromEntries(segRows.map(s=>[s.segment_id,s]));
 trows.forEach(t=>{
   const path=APP.sourcePaths[t.transformer_id]||[];const drop=path.reduce((z,id)=>z+(smap[id]?.voltage_drop_pct||0),0);
   t.cumulative_voltage_drop_pct=drop;t.voltage_pu=Math.max(.82,1-drop/100);t.lv_voltage_v=415*t.voltage_pu;
   const overload=clip((t.utilization_pct-70)*2.2),volt=clip((.98-t.voltage_pu)/.06*100),phase=clip(t.phase_imbalance_pct*3),cond=condFactor(t.condition);
   const outage=clip((t.feeder_outage_count*8+t.transformer_outage_count*18));
   t.priority_score=.30*overload+.20*volt+.15*phase+.20*cond+.15*outage;t.priority_class=priorityClass(t.priority_score);
   t.loading_class=loadingClass(t.utilization_pct);t.voltage_class=voltageClass(t.voltage_pu)
 });
 const frows=APP.feeders.map(f=>{
   const tt=trows.filter(t=>t.feeder_id===f.feeder_id),ss=segRows.filter(s=>s.feeder_id===f.feeder_id),trunk=ss.filter(s=>s.segment_type==='Trunk');
   const totalKva=tt.reduce((z,t)=>z+t.scenario_kva,0),customers=tt.reduce((z,t)=>z+num(t.customer_count),0),maxUtil=Math.max(0,...ss.map(s=>s.utilization_pct)),minV=Math.min(1,...tt.map(t=>t.voltage_pu)),loss=ss.reduce((z,s)=>z+s.loss_kw,0),high=tt.filter(t=>t.priority_score>=60).length;
   const maxP=Math.max(0,...tt.map(t=>t.priority_score)),avgP=tt.length?tt.reduce((z,t)=>z+t.priority_score,0)/tt.length:0;
   const outage=outageFeeder[f.feeder_id]||{count:0,duration:0,affected:0},segmentStress=clip((maxUtil-65)*2.1),vStress=clip((.98-minV)/.06*100),outStress=clip(outage.count*11+outage.duration/45);
   const risk=.30*maxP+.20*avgP+.20*segmentStress+.15*vStress+.15*outStress;
   return {...f,total_kva:totalKva,total_customers:customers,max_segment_utilization_pct:maxUtil,min_voltage_pu:minV,total_loss_kw:loss,high_priority_transformers:high,
     transformer_count:tt.length,outage_count:outage.count,outage_duration_min:outage.duration,affected_customer_events:outage.affected,risk_score:risk,risk_class:priorityClass(risk)}
 });
 const value={transformers:trows,segments:segRows,feeders:frows,tmap:Object.fromEntries(trows.map(x=>[x.transformer_id,x])),smap,fmap:Object.fromEntries(frows.map(x=>[x.feeder_id,x]))};

function visibleTransformers(){return calculate().transformers.filter(t=>{if(filters.feeder!=='All'&&t.feeder_id!==filters.feeder)return false;if(filters.priority!=='All'&&t.priority_class!==filters.priority)return false;if(filters.condition!=='All'&&t.condition!==filters.condition)return false;if(filters.loading!=='All'&&t.loading_class!==filters.loading)return false;if(filters.lowVoltageOnly&&t.voltage_pu>=.95)return false;if(filters.highPriorityOnly&&t.priority_score<60)return false;if(!matchesSearch(t)&&!matchesSearch(feederById[t.feeder_id]))return false;return true})}

function csvText(rows){if(!rows.length)return'';const keys=Object.keys(rows[0]).filter(k=>k!=='geometry'),q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};return[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function exportRowsCsv(rows,name){downloadBlob(name,csvText(rows),'text/csv;charset=utf-8')}
function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}
function downloadBlob(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),600)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__p15);window.__p15=setTimeout(()=>t.classList.remove('show'),1800)}
function renderLegend(){const sets={feeder:Object.entries(feederColors).map(([id,c])=>[c,id]),transformerLoad:[['#8f1f32','≥110%'],['#c8454b','100–109%'],['#e4773a','80–99%'],['#e6b94c','60–79%'],['#4f9d69','<60%']],segmentLoad:[['#8f1f32','≥110%'],['#c8454b','100–109%'],['#e4773a','80–99%'],['#e6b94c','60–79%'],['#4f9d69','<60%']],voltage:[['#8f1f32','<0.92 pu'],['#c8454b','0.92–0.949'],['#e6a23c','0.95–0.969'],['#4f9d69','≥0.97 pu']],phase:[['#8f1f32','≥35%'],['#c8454b','25–34%'],['#e6a23c','15–24%'],['#4f9d69','<15%']],condition:[['#4f9d69','Good'],['#e6b94c','Fair'],['#d55a42','Poor'],['#8f1f32','Critical']],capacity:[['#8f1f32','Negative margin'],['#c8454b','<15% headroom'],['#e6a23c','15–30% headroom'],['#4f9d69','>30% headroom']],loss:[['#8f1f32','≥10 kW'],['#c8454b','5–9.9 kW'],['#e4773a','2–4.9 kW'],['#e6b94c','0.7–1.9 kW'],['#4f9d69','<0.7 kW']],priority:[['#8f1f32','Critical'],['#c8454b','High'],['#e6a23c','Moderate'],['#4f9d69','Low']],reliability:[['#8f1f32','High feeder/asset risk'],['#c8454b','Elevated'],['#e6a23c','Moderate'],['#4f9d69','Lower']]};const labels={feeder:'Feeder Circuit',transformerLoad:'Transformer Loading',segmentLoad:'Feeder Segment Loading',voltage:'Voltage Profile',phase:'Phase Imbalance',condition:'Asset Condition',capacity:'Transformer Capacity Margin',loss:'Technical Loss Screening',priority:'Planning Priority',reliability:'Reliability / Risk'};$('legend').innerHTML=`<b>${esc(labels[activeTheme])}</b>`+(sets[activeTheme]||sets.transformerLoad).map(x=>`<div class="legend-row"><span class="swatch" style="background:${x[0]}"></span>${esc(x[1])}</div>`).join('');$('legend').classList.toggle('show',legendOpen)}
function resetAll(){activeScenario='evening';growthPct=0;Object.assign(filters,{feeder:'All',priority:'All',condition:'All',loading:'All',lowVoltageOnly:false,highPriorityOnly:false});Object.keys(layerState).forEach(k=>layerState[k]=true);layerState.poles=false;layerState.customerClusters=false;selected.clear();sourcePathIds=[];activeEntity=null;activeTheme='transformerLoad';resultMode='transformers';invalidate();$('mapTheme').value=activeTheme;$('globalSearch').value='';$('detailDrawer').classList.remove('open');if(map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm.local;$('basemap').value='local';activeBm.addTo(map);drawMap();renderPanel();renderDrawer();fitMap()}
function coordinateQA(){const bad=[];function walk(c){if(Array.isArray(c)&&typeof c[0]==='number'){if(c[0]<-180||c[0]>180||c[1]<-90||c[1]>90)bad.push(c)}else if(Array.isArray(c))c.forEach(walk)}Object.values(APP.geo).forEach(fc=>fc.features?.forEach(f=>walk(f.geometry.coordinates)));return bad}
function runSelfTest(){const C=calculate(),r={bad_coordinates:coordinateQA().length,feeders:APP.feeders.length,transformers:APP.transformers.length,segments:APP.segments.length};r.source_paths=APP.transformers.every(t=>(APP.sourcePaths[t.transformer_id]||[]).length>1);r.calc_complete=C.transformers.every(t=>Number.isFinite(t.utilization_pct)&&Number.isFinite(t.voltage_pu)&&Number.isFinite(t.priority_score))&&C.segments.every(s=>Number.isFinite(s.current_a)&&Number.isFinite(s.loss_kw));r.has_priority_mix=new Set(C.transformers.map(t=>t.priority_class)).size>1;const old={...layerState};Object.keys(layerState).forEach(k=>layerState[k]=false);drawMap();r.all_off=!map.hasLayer(activeBm)&&Object.keys(mapLayers).length===0;Object.assign(layerState,old);resetAll();document.body.dataset.p15Selftest=JSON.stringify(r);return r}
function init(){$('appPid').textContent='P15';$('appTitle').textContent=APP.title;$('appSubtitle').textContent=APP.subtitle;$('globalSearch').placeholder='Search feeder, transformer, segment, conductor…';$('mapTheme').innerHTML=[['feeder','Feeder Circuit'],['transformerLoad','Transformer Loading'],['segmentLoad','Feeder Segment Loading'],['voltage','Voltage Profile'],['phase','Phase Imbalance'],['condition','Asset Condition'],['capacity','Capacity Margin'],['loss','Technical Loss Screening'],['priority','Planning Priority'],['reliability','Reliability / Risk']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('mapTheme').value=activeTheme;document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setNav(b.dataset.nav));$('mapTheme').onchange=e=>{activeTheme=e.target.value;drawMap()};$('basemap').onchange=e=>{if(activeBm&&map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm[e.target.value]||bm.local;if(layerState.basemap)activeBm.addTo(map)};$('globalSearch').oninput=()=>{drawMap();renderDrawer();if(activeNav==='results')renderPanel()};$('detailClose').onclick=()=>$('detailDrawer').classList.remove('open');$('drawerHandle').onclick=()=>toggleDrawer();$('expandData').onclick=e=>{e.stopPropagation();drawerFull=!drawerFull;$('dataDrawer').classList.toggle('full',drawerFull)};$('csvMini').onclick=e=>{e.stopPropagation();const d=tableDefs[activeTableTab];exportRowsCsv(d.rows(),`P15_${activeTableTab}.csv`)};$('legendBtn').onclick=()=>{legendOpen=!legendOpen;renderLegend()};$('fitBtn').onclick=fitMap;$('printBtn').onclick=()=>window.print();$('resetBtn').onclick=resetAll;drawMap();renderPanel();renderDrawer();renderLegend();setTimeout(fitMap,300);window.P15_APP={APP,filters,layerState,selected,calculate,runSelfTest,coordinateQA};if(new URLSearchParams(location.search).get('selftest')==='1')setTimeout(runSelfTest,120)}
init();
