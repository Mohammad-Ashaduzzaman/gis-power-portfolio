ools and police/emergency clusters are separately summarized so restoration benefit is not judged only by total customer count."},{"title":"Restoration Benefit","detail":"Restoration benefit compares initial affected customers with post-isolation and post-tie affected customers, including restored kVA and critical-customer counts."},{"title":"Protection / Source Path","detail":"The selected incident can show the upstream feeder path from fault zone to source and the protection device defining the simulated initial outage zone."},{"title":"Decision Boundary","detail":"This app demonstrates GIS/OMS-style tracing concepts. It is not a live switching engine, protection study, SCADA control interface or operator procedure."}],"outputs":["Outage incident map","Initial affected-customer trace","Affected transformer register","Critical-customer impact summary","Protection-zone map","Source/protection path map","Fault-isolation zone map","Post-isolation customer summary","Tie-restoration feasibility ranking","Post-restoration affected-customer map","Restored-customer benefit summary","Incident stage/timeline view","Field fault-verification register","Trace CSV/JSON exports","Single-file outage trace Web GIS"],"qa":["Every feeder references a valid source substation.","Every segment has valid endpoint nodes and ordered feeder sequence.","Every transformer references a valid feeder, node and lateral segment.","Every customer cluster references a valid transformer and feeder.","Every tie references valid feeder nodes.","Incident fault assets reference valid synthetic network assets.","Initial trace, isolation and restoration stages are calculated from connectivity and sequence attributes.","Critical customers are summarized separately from general customer counts.","All coordinates are valid WGS84.","The interface labels restoration as simulation/screening and never as real switching instruction."]},"geo":{"substations":{"type":"FeatureCollection","features":[{"type":"Feature", function renderDrawer(){$('drawerTabs').innerHTML=Object.entries(tableDefs).map(([id,d])=>`<button class="${id===activeTableTab?'active':''}" data-ttab="${id}">${esc(d.label)}</button>`).join('');document.querySelectorAll('[data-ttab]').forEach(b=>b.onclick=()=>{activeTableTab=b.dataset.ttab;renderDrawer()});const d=tableDefs[activeTableTab],rows=d.rows();$('dataHead').innerHTML='<tr>'+d.cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';$('dataBody').innerHTML=rows.slice(0,900).map(r=>'<tr>'+d.cols.map(c=>`<td>${esc(fmt(r[c]))}</td>`).join('')+'</tr>').join('');$('drawerCount').textContent=`${rows.length} records`}
function toggleDrawer(force){drawerOpen=force===undefined?!drawerOpen:force;$('dataDrawer').classList.toggle('open',drawerOpen);renderDrawer()}
function csvText(rows){if(!rows.length)return'';const keys=Object.keys(rows[0]).filter(k=>k!=='geometry'&&!Array.isArray(rows[0][k])&&typeof rows[0][k]!=='object'),q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};return[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function exportRowsCsv(rows,name){downloadBlob(name,csvText(rows),'text/csv;charset=utf-8')}
function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}
function downloadBlob(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),600)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__p16);window.__p16=setTimeout(()=>t.classList.remove('show'),1800)}
function renderLegend(){const sets={outageStage:[['#c8454b','Affected'],['#2f966b','Restored'],['#9ba5ac','Normal / unaffected']],feeder:Object.entries(feederColors).map(([id,c])=>[c,id]),protectionZone:[['#d9534f','Initial protection zone'],['#9ba5ac','Outside zone']],customerImpact:[['#8f1f32','≥220 customers/TX'],['#c8454b','160–219'],['#e4773a','100–159'],['#e6b94c','<100']],criticalCustomers:[['#8f1f32','20+ critical customers/TX'],['#e4773a','1–19 critical'],['#4f9d69','No critical customers']],restoration:[['#c8454b','Still affected'],['#2f966b','Restored'],['#9ba5ac','Normal']],deviceStatus:[['#6f5da8','Protection-capable'],['#77848c','Section / switching device']],assetCondition:[['#4f9d69','Good'],['#e6b94c','Fair'],['#c8454b','Poor']]};const labels={outageStage:`Outage Stage · ${stageLabel()}`,feeder:'Feeder Circuit',protectionZone:'Initial Protection Zone',customerImpact:'Transformer Customer Impact',criticalCustomers:'Critical-Service Customer Impact',restoration:'Restoration Status',deviceStatus:'Protection / Device Context',assetCondition:'Asset Condition'};$('legend').innerHTML=`<b>${esc(labels[activeTheme])}</b>`+(sets[activeTheme]||sets.outageStage).map(x=>`<div class="legend-row"><span class="swatch" style="background:${x[0]}"></span>${esc(x[1])}</div>`).join('');$('legend').classList.toggle('show',legendOpen)}
function resetAll(){const i=APP.incidents[0];activeIncidentId=i.incident_id;activeFaultType=i.fault_type;activeFaultAssetId=i.fault_asset_id;activeStage='initial';activeTieId='';Object.assign(filters,{criticalOnly:false,customerCategory:'All',feeder:'All'});Object.keys(layerState).forEach(k=>layerState[k]=true);layerState.customers=false;layerState.sourcePath=false;selected.clear();activeEntity=null;activeTheme='outageStage';resultMode='transformers';invalidate();$('mapTheme').value=activeTheme;$('globalSearch').value='';$('detailDrawer').classList.remove('open');if(map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm.local;$('basemap').value='local';activeBm.addTo(map);trace();drawMap();renderPanel();renderDrawer();fitMap()}
function coordinateQA(){const bad=[];function walk(c){if(Array.isArray(c)&&typeof c[0]==='number'){if(c[0]<-180||c[0]>180||c[1]<-90||c[1]>90)bad.push(c)}else if(Array.isArray(c))c.forEach(walk)}Object.values(APP.geo).forEach(fc=>fc.features?.forEach(f=>walk(f.geometry.coordinates)));return bad}
function runSelfTest(){const old={type:activeFaultType,id:activeFaultAssetId,stage:activeStage,tie:activeTieId},r={bad_coordinates:coordinateQA().length};const line=APP.incidents.find(i=>i.fault_type==='Line Segment');activeFaultType=line.fault_type;activeFaultAssetId=line.fault_asset_id;activeStage='initial';activeTieId='';invalidate();const a=trace();r.initial_nonzero=a.initial.customers>0;r.isolation_not_worse=a.isolated.customers<=a.initial.customers;r.tie_options=Array.isArray(a.options);activeStage='restored';invalidate();const b=trace();r.restoration_not_worse=b.current.customers<=b.isolated.customers;const tx=APP.incidents.find(i=>i.fault_type==='Transformer');activeFaultType=tx.fault_type;activeFaultAssetId=tx.fault_asset_id;activeStage='initial';activeTieId='';invalidate();const c=trace();r.transformer_fault_single=c.initial.transformers.length===1;const oldLayers={...layerState};Object.keys(layerState).forEach(k=>layerState[k]=false);drawMap();r.all_off=!map.hasLayer(activeBm)&&Object.keys(mapLayers).length===0;Object.assign(layerState,oldLayers);activeFaultType=old.type;activeFaultAssetId=old.id;activeStage=old.stage;activeTieId=old.tie;invalidate();resetAll();document.body.dataset.p16Selftest=JSON.stringify(r);return r}
function init(){$('appPid').textContent='P16';$('appTitle').textContent=APP.title;$('appSubtitle').textContent=APP.subtitle;$('globalSearch').placeholder='Search incident, feeder, transformer, customer…';$('mapTheme').innerHTML=[['outageStage','Outage Stage'],['feeder','Feeder Circuit'],['protectionZone','Protection Zone'],['customerImpact','Customer Impact'],['criticalCustomers','Critical Customers'],['restoration','Restoration Status'],['deviceStatus','Device Status'],['assetCondition','Asset Condition']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('mapTheme').value=activeTheme;document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setNav(b.dataset.nav));$('mapTheme').onchange=e=>{activeTheme=e.target.value;drawMap()};$('basemap').onchange=e=>{if(activeBm&&map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm[e.target.value]||bm.local;if(layerState.basemap)activeBm.addTo(map)};$('globalSearch').oninput=()=>{if(activeNav==='results')renderPanel()};$('detailClose').onclick=()=>$('detailDrawer').classList.remove('open');$('drawerHandle').onclick=()=>toggleDrawer();$('expandData').onclick=e=>{e.stopPropagation();drawerFull=!drawerFull;$('dataDrawer').classList.toggle('full',drawerFull)};$('csvMini').onclick=e=>{e.stopPropagation();const d=tableDefs[activeTableTab];exportRowsCsv(d.rows(),`P16_${activeTableTab}.csv`)};$('legendBtn').onclick=()=>{legendOpen=!legendOpen;renderLegend()};$('fitBtn').onclick=fitMap;$('printBtn').onclick=()=>window.print();$('resetBtn').onclick=resetAll;trace();drawMap();renderPanel();renderDrawer();renderLegend();setTimeout(fitMap,300);window.P16_APP={APP,layerState,filters,trace,runSelfTest,coordinateQA,setFault,setStage,mapEngine:'leaflet-local',map};document.body.dataset.p16MapEngine='leaflet-local';if(new URLSearchParams(location.search).get('selftest')==='1')setTimeout(runSelfTest,120)}
init();
