230 kV network","default":true},{"id":"roadGeo","label":"Roads","default":false},{"id":"loadGeo","label":"Load centers","default":false},{"id":"settGeo","label":"Settlements","default":false},{"id":"exclGeo","label":"Hard exclusions","default":false}],"process":[{"step_no":1,"stage":"Define substation requirement","input":"Grid need, voltage level, target load, technology concept","gis_method":"Planning brief / requirements matrix","output":"230/132 kV site-selection objective + planning area requirement","qa":"Confirm whether AIS/GIS/hybrid, future bays and expansion needs","why":"A site cannot be optimized until spatial/engineering requirements are defined."},{"step_no":2,"stage":"Define study area","input":"Existing 230 kV network + load-growth context","gis_method":"Buffer / planning boundary","output":"Site-search study area","qa":"Area must be wide enough to offer genuine alternatives","why":"A narrow search area can force a poor site."},{"step_no":3,"stage":"Prepare common GIS environment","input":"All raster/vector criteria","gis_method":"Project / Resample / Snap Raster / Environments","output":"Aligned EPSG:9680 analysis stack","qa":"Same CRS, extent, cell size and snap alignment","why":"Avoids false suitability patterns caused by raster misalignment."},{"step_no":4,"stage":"Apply hard exclusions","input":"Dense settlement, wetland core, protected area, water/drainage corridor, sensitive receptor buffers","gis_method":"Buffer / Rasterize / Set Null / Restricted","output":"No-build mask","qa":"Verify all exclusion rules and map sources","why":"Non-negotiable constraints should not be compensated by good scores elsewhere."},{"step_no":5,"stage":"Derive grid-connection criterion","input":"Existing 230 kV line","gis_method":"Distance Accumulation / Euclidean Distance","output":"Distance-to-grid raster","qa":"Confirm line geometry and practical line-entry assumptions","why":"Closer feasible sites usually reduce interconnection length and complexity."},{"step_no":6,"stage":"Derive load-center criterion","input":"Load-growth / demand centers","gis_method":"Distance / demand influence surface","output":"Load-access criterion","qa":"Use forecast demand, not only current load","why":"A grid substation should support the intended network/load objective."},{"step_no":7,"stage":"Derive road-access criterion","input":"Road network","gis_method":"Euclidean Distance / preference function","output":"Road-access suitability","qa":"Check road class, bridge capacity and construction access","why":"Heavy transformer delivery and long-term maintenance require viable access."},{"step_no":8,"stage":"Derive terrain/flood/drainage criteria","input":"DEM, slope, flood/wetland/elevation","gis_method":"Slope / hydrology / reclassification","output":"Slope + flood safety + drainage/elevation suitability","qa":"Use project hydrology and field flood marks for real design","why":"Land development, platform elevation, drainage and foundations can dominate site cost."},{"step_no":9,"stage":"Derive social/environmental criteria","input":"Settlements, receptors, wetlands, protected/sensitive land","gis_method":"Distance / buffers / reclassification","output":"Settlement setback + environmental suitability","qa":"Avoid double counting and verify sensitive receptors","why":"Reduces displacement, community conflict and environmental impacts."},{"step_no":10,"stage":"Derive land/expansion criteria","input":"Open land, development pressure, surrounding land availability","gis_method":"Land-use reclass + focal neighborhood analysis","output":"Land suitability + expansion potential","qa":"Desktop proxy must later be replaced with cadastral/legal verification","why":"A workable site needs sufficient contiguous land and future expansion room."},{"step_no":11,"stage":"Derive line-entry flexibility","input":"230 kV line proximity + open approach corridors","gis_method":"Composite proximity/open-space model","output":"Line-entry flexibility score","qa":"Check bay orientation, approach angles, crossing conflicts and future circuits","why":"A good parcel can still be poor if transmission line approaches are constrained."},{"step_no":12,"stage":"Transform criteria","input":"All raw criteria","gis_method":"Suitability Modeler Transformation / Reclassify","output":"Common 1–10 suitability scale","qa":"10 must always mean more suitable; document transformation function","why":"Meters, percent slope and categorical land use cannot be weighted directly until standardized."},{"step_no":13,"stage":"Weight and combine","input":"11 transformed criteria + weights","gis_method":"Suitability Modeler / Weighted Overlay / Weighted Sum","output":"Final suitability raster","qa":"Weights total 100%; review criterion influence","why":"Creates a traceable composite preference map."},{"step_no":14,"stage":"Locate candidate regions","input":"Final suitability raster + site spatial requirements","gis_method":"Suitability Modeler Locate / Locate Regions","output":"Contiguous high-suitability candidate regions","qa":"Set area, region count, separation and compactness appropriate to substation concept","why":"The best cell is not enough; a substation needs a contiguous usable land parcel."},{"step_no":15,"stage":"Create candidate site polygons","input":"Locate output / high suitability regions","gis_method":"Raster to Polygon / candidate geometry refinement","output":"8 candidate site polygons","qa":"Check minimum area and no hard-exclusion overlap","why":"Converts raster preference into actual site alternatives."},{"step_no":16,"stage":"Zonal candidate assessment","input":"Candidate polygons + criteria rasters","gis_method":"Zonal Statistics / Summarize Within","output":"Mean criterion values for each candidate","qa":"Review mean plus worst-case/local hotspots, not only averages","why":"Explains why each site performs well or poorly."},{"step_no":17,"stage":"Grid/access engineering screening","input":"Candidate sites + 230 kV line + roads + load center function recomputeDerived(){
  if(APP.type==='route_optimization'){
    const total=Object.values(routeWeights).reduce((a,b)=>a+Math.max(0,Number(b)||0),0)||1;
    APP.data.routes.forEach(r=>{
      let score=0;
      for(const [metric,w0] of Object.entries(routeWeights)){
        const w=Math.max(0,Number(w0)||0)/total;
        const normField='norm_'+metric;
        let penalty=n(r[normField]);
        if(penalty===null){
          if(metric==='river_crossings')penalty=n(r.norm_river_crossings);
          else if(metric==='rail_crossings')penalty=n(r.norm_rail_crossings);
          else if(metric==='existing_power_crossings')penalty=n(r.norm_existing_power_crossings);
          else penalty=0;
        }
        score+=penalty*w;
      }
      r.__score=score;
    });
    [...APP.data.routes].sort((a,b)=>a.__score-b.__score).forEach((r,i)=>r.__rank=i+1);
  }
  if(APP.type==='site_selection'){
    const totalSuit=Object.values(siteSuitWeights).reduce((a,b)=>a+Math.max(0,Number(b)||0),0)||1;
    APP.data.sites.forEach(s=>{
      let suit=0;
      for(const [criterion,w0] of Object.entries(siteSuitWeights)){
        const field=siteCriterionField[criterion];if(!field)continue;
        suit+=(n(s[field])||0)*(Math.max(0,Number(w0)||0)/totalSuit);
      }
      s.__suit=suit;
    });
    const suits=APP.data.sites.map(s=>s.__suit),minS=Math.min(...suits),maxS=Math.max(...suits);
    const totalRank=Object.values(siteRankWeights).reduce((a,b)=>a+Math.max(0,Number(b)||0),0)||1;
    APP.data.sites.forEach(s=>{
      let score=0;
      for(const [metric,w0] of Object.entries(siteRankWeights)){
        const w=Math.max(0,Number(w0)||0)/totalRank;
        let penalty;
        if(metric==='mean_suitability')penalty=maxS===minS?0:(maxS-s.__suit)/(maxS-minS)*100;
        else penalty=n(s['norm_'+metric])||0;
        score+=penalty*w;
      }
      s.__score=score;
    });
    [...APP.data.sites].sort((a,b)=>a.__score-b.__score).forEach((s,i)=>s.__rank=i+1);
  }
}

function fitAll(){const bounds=[];Object.values(mapLayers).forEach(l=>{try{const b=l.getBounds();if(b?.isValid())bounds.push(b)}catch{}});if(bounds.length){let b=bounds[0];for(let i=1;i<bounds.length;i++)b=b.extend(bounds[i]);map.fitBounds(b.pad(.06))}}
function kpis(){
  const a=rawEntities();
  if(APP.type==='asset_network')return[a.length,a.filter(x=>/attention/i.test(x.condition)).length,a.filter(x=>/high/i.test(x.risk_class)).length,new Set(a.map(x=>x.voltage_kv)).size];
  if(APP.type==='tower_health')return[a.length,a.filter(x=>/poor|critical/i.test(x.health_class)).length,a.filter(x=>/high/i.test(x.maintenance_priority)).length,a.filter(x=>/overdue/i.test(x.inspection_status)).length];
  if(APP.type==='row_monitoring')return[a.length,a.filter(x=>/high|critical/i.test(x.risk_class)).length,a.filter(x=>/new|expand/i.test(x.change_status)).length,APP.data.cases.filter(x=>!/closed/i.test(x.case_status)).length];
  if(APP.type==='route_optimization'){const p=[...a].sort((x,y)=>value(x,'balanced_rank')-value(y,'balanced_rank'))[0];return[a.length,p?.route_id||'—',fmt(value(p,'balanced_decision_score')),fmt(p?.length_km,' km')]}
  if(APP.type==='site_selection'){const p=[...a].sort((x,y)=>value(x,'rank')-value(y,'rank'))[0];return[a.length,p?.site_id||'—',APP.data.criteria.length,new Set(APP.data.sens.map(x=>x.scenario)).size]}
  return[0,0,0,0];
}
function recommendation(){
  const a=rawEntities();let p=a[0],label='Current focus',note='';
  if(APP.type==='asset_network'){p=a.find(x=>/attention/i.test(x.condition))||a[0];label='Attention asset';note='Review condition, risk and linked maintenance records.'}
  if(APP.type==='tower_health'){p=[...a].sort((x,y)=>Number(y.maintenance_priority_score)-Number(x.maintenance_priority_score))[0];label='Highest maintenance priority';note='Prioritize inspection evidence, defects and work order follow-up.'}
  if(APP.type==='row_monitoring'){p=[...a].sort((x,y)=>Number(y.risk_score)-Number(x.risk_score))[0];label='Highest ROW risk';note='Verify current condition and manage the linked encroachment case.'}
  if(APP.type==='route_optimization'){p=[...a].sort((x,y)=>value(x,'balanced_rank')-value(y,'balanced_rank'))[0];label='Preferred preliminary route';note='Preferred under the current decision weights; engineering validation remains required.'}
  if(APP.type==='site_selection'){p=[...a].sort((x,y)=>value(x,'rank')-value(y,'rank'))[0];label='Preferred for field investigation';note='Desktop suitability winner only; geotechnical, land, E&S and engineering validation remain required.'}

}

  $('suitMode')?.addEventListener('click',()=>{siteWeightMode='suitability';renderPanel()});$('rankMode')?.addEventListener('click',()=>{siteWeightMode='ranking';renderPanel()});
  document.querySelectorAll('.site-suit-weight').forEach(i=>i.addEventListener('input',()=>{siteSuitWeights[i.dataset.metric]=Number(i.value);recomputeDerived();drawMap();renderDrawer();renderPanel()}));
  document.querySelectorAll('.site-rank-weight').forEach(i=>i.addEventListener('input',()=>{siteRankWeights[i.dataset.metric]=Number(i.value);recomputeDerived();drawMap();renderDrawer();renderPanel()}));
  $('fieldForm')?.addEventListener('submit',e=>{e.preventDefault();toast('Field draft captured in this session')});$('fieldExport')?.addEventListener('click',()=>downloadJson('field_record.json',Object.fromEntries(new FormData($('fieldForm')).entries())));
  $('exportCsv')?.addEventListener('click',exportCsv);$('exportJson')?.addEventListener('click',()=>downloadJson(`${APP.id}_selection.json`,selectionRecords()));$('printMap2')?.addEventListener('click',()=>window.print());
}
function syncAfterAnalysis(){drawMap();renderDrawer();renderPanel()}
function setNav(nv){activeNav=nv;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===nv));renderPanel();if(innerWidth<=820)$('contextPanel').classList.add('mobile-open')}
function selectEntity(x,open){activeEntity=x;selected.add(idOf(x));drawMap();renderPanel();if(open)openDetails(x);focusEntity(x)}
function focusEntity(x){if(APP.type==='route_optimization'){const f=APP.data.routeGeo.features.find(z=>String(z.properties.route_id)===idOf(x));if(f){const b=L.geoJSON(f).getBounds();if(b.isValid())map.fitBounds(b.pad(.16))}}else if(APP.type==='site_selection'){const f=APP.data.candidateGeo.features.find(z=>String(z.properties.site_id)===idOf(x));if(f){const b=L.geoJSON(f).getBounds();if(b.isValid())map.fitBounds(b.pad(.45),{maxZoom:15})}}else{const lat=Number(x[APP.fields.lat]),lon=Number(x[APP.fields.lon]);if(Number.isFinite(lat)&&Number.isFinite(lon))map.setView([lat,lon],14)}}
function openDetails(x){compareMode=false;activeEntity=x;activeDetailTab=Object.keys(APP.fields.rightTabs)[0];$('detailDrawer').classList.add('open');renderDetails()}
function renderDetails(){
  if(!activeEntity)return;$('detailEyebrow').textContent=APP.entityKind;$('detailTitle').textContent=titleOf(activeEntity);$('detailSubtitle').textContent=subtitleOf(activeEntity)||APP.entityKind;
  const tabs=Object.keys(APP.fields.rightTabs);$('detailTabs').innerHTML=tabs.map(t=>`<button class="${t===activeDetailTab?'active':''}" data-detail-tab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-detail-tab]').forEach(b=>b.addEventListener('click',()=>{activeDetailTab=b.dataset.detailTab;renderDetails()}));
  const fields=APP.fields.rightTabs[activeDetailTab]||[];
  if(activeDetailTab==='Suitability'&&APP.type==='site_selection')$('detailBody').innerHTML=fields.map(f=>{const v=Math.max(0,Math.min(10,n(value(activeEntity,f))||0));return `<div class="bar-row"><header><span>${esc(f.replaceAll('_',' '))}</span><b>${v.toFixed(2)}</b></header><div class="track"><div class="fill" style="width:${v*10}%"></div></div></div>`}).join('');
  else $('detailBody').innerHTML=`<div class="detail-metrics">${APP.fields.metrics.slice(0,4).map(([f,l,s])=>`<div class="detail-metric"><b>${esc(fmt(value(activeEntity,f),s))}</b><span>${esc(l)}</span></div>`).join('')}</div><div class="section-title">${esc(activeDetailTab)}</div>${fields.map(f=>`<div class="kv"><span>${esc(f.replaceAll('_',' '))}</span><b>${esc(fmt(value(activeEntity,f)))}</b></div>`).join('')}`;
}
function compareSelected(){
  const rows=rawEntities().filter(x=>selected.has(idOf(x))).slice(0,4);if(rows.length<2)return;
  compareMode=true;$('detailDrawer').classList.add('open');$('detailEyebrow').textContent='Comparison';$('detailTitle').textContent=`${rows.length} selected ${APP.entityKind}s`;$('detailSubtitle').textContent='Side-by-side decision support';$('detailTabs').innerHTML='';
  const metrics=APP.fields.metrics.slice(0,6);$('detailBody').innerHTML=`<div style="overflow:auto"><table class="data-table"><thead><tr><th>Metric</th>${rows.map(x=>`<th>${esc(titleOf(x))}</th>`).join('')}</tr></thead><tbody>${metrics.map(([f,l,s])=>`<tr><td><b>${esc(l)}</b></td>${rows.map(x=>`<td>${esc(fmt(value(x,f),s))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  zoomSelected();
}
function zoomSelected(){const ids=[...selected];if(!ids.length)return;if(APP.type==='route_optimization'||APP.type==='site_selection'){const key=APP.type==='route_optimization'?'route_id':'site_id',geo=APP.type==='route_optimization'?APP.data.routeGeo:APP.data.candidateGeo,fs=geo.features.filter(f=>ids.includes(String(f.properties[key])));if(fs.length){const b=L.geoJSON({type:'FeatureCollection',features:fs}).getBounds();if(b.isValid())map.fitBounds(b.pad(.12))}}else{const pts=rawEntities().filter(x=>selected.has(idOf(x))).map(x=>[Number(x[APP.fields.lat]),Number(x[APP.fields.lon])]).filter(p=>p.every(Number.isFinite));if(pts.length)map.fitBounds(pts,{padding:[55,55],maxZoom:14})}}
function tableRows(tab){if(tab==='entities')return visibleEntities();const d=APP.data[tab];return Array.isArray(d)?d:[]}
function renderDrawer(){const tabs=APP.tableTabs;$('drawerTabs').innerHTML=tabs.map(t=>`<button class="${t.id===activeTableTab?'active':''}" data-table-tab="${t.id}">${esc(t.label)}</button>`).join('');document.querySelectorAll('[data-table-tab]').forEach(b=>b.addEventListener('click',()=>{activeTableTab=b.dataset.tableTab;renderDrawer()}));const rows=tableRows(activeTableTab),keys=rows.length?Object.keys(rows[0]).filter(k=>!k.startsWith('__')).slice(0,10):[];$('dataHead').innerHTML='<tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr>';$('dataBody').innerHTML=rows.slice(0,500).map(r=>'<tr>'+keys.map(k=>`<td>${esc(fmt(value(r,k)))}</td>`).join('')+'</tr>').join('');$('drawerCount').textContent=`${rows.length} records`}
function toggleDrawer(force){drawerOpen=force===undefined?!drawerOpen:force;$('dataDrawer').classList.toggle('open',drawerOpen);renderDrawer()}
function selectionRecords(){const a=rawEntities();return selected.size?a.filter(x=>selected.has(idOf(x))):visibleEntities()}
function exportCsv(){const rows=selectionRecords();if(!rows.length)return;const keys=Object.keys(rows[0]).filter(k=>!k.startsWith('__'));const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};downloadBlob(`${APP.id}_selection.csv`,[keys.join(','),...rows.map(r=>keys.map(k=>q(value(r,k))).join(','))].join('\n'),'text/csv')}
function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}function downloadBlob(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
function renderLegend(){const box=$('legend');let rows='';if(APP.type==='site_selection'&&activeTheme!=='candidates'&&activeTheme!=='hard')rows=[['#2f855a','Very good'],['#76a96b','Good'],['#d4b857','Moderate'],['#d98a48','Low'],['#c65a56','Very low']].map(x=>`<div class="legend-row"><span class="swatch" style="background:${x[0]}"></span>${x[1]}</div>`).join('');else rows=`<div class="legend-row"><span class="swatch" style="background:#147d64"></span>Primary / selected</div><div class="legend-row"><span class="swatch" style="background:#e6a23c"></span>Moderate / warning</div><div class="legend-row"><span class="swatch" style="background:#d9534f"></span>High / critical</div>`;box.innerHTML=`<b>${esc(APP.themes.find(x=>x.id===activeTheme)?.label||'Legend')}</b>${rows}`;box.classList.toggle('show',legendOpen)}
function init(){
  recomputeDerived();$('mapTheme').innerHTML=APP.themes.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('');$('mapTheme').value=activeTheme;$('appPid').textContent=APP.id;$('appTitle').textContent=APP.title;$('appSubtitle').textContent=APP.subtitle;
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setNav(b.dataset.nav)));$('mapTheme').addEventListener('change',e=>{activeTheme=e.target.value;drawMap();renderPanel()});$('basemap').addEventListener('change',e=>{map.removeLayer(activeBm);activeBm=bm[e.target.value]||bm.local;activeBm.addTo(map);drawMap()});$('globalSearch').addEventListener('input',()=>{drawMap();renderDrawer();if(activeNav==='results')renderPanel()});
  $('detailClose').addEventListener('click',()=>$('detailDrawer').classList.remove('open'));$('drawerHandle').addEventListener('click',()=>toggleDrawer());$('legendBtn').addEventListener('click',()=>{legendOpen=!legendOpen;renderLegend()});$('fitBtn').addEventListener('click',fitAll);$('printBtn').addEventListener('click',()=>window.print());$('csvMini').addEventListener('click',exportCsv);$('expandData').addEventListener('click',()=>$('dataDrawer').classList.toggle('full'));
  $('resetBtn').addEventListener('click',()=>{selected.clear();activeEntity=null;filterState.condition=filterState.risk=filterState.priority=filterState.change='All';filterState.healthMax=100;$('detailDrawer').classList.remove('open');activeTheme=APP.themes[0]?.id||'';$('mapTheme').value=activeTheme;drawMap();renderPanel();renderDrawer();fitAll()});
  drawMap();renderPanel();renderDrawer();setTimeout(fitAll,250);
}
init();

</script><script src="../assets/project-ui.js"></script>
</body></html>
