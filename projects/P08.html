","input":"Project WBS and engineering IDs","gis_method":"Enterprise GDB / GeoPackage schema, domains, relationships","output":"Controlled construction data model","why":"One stable ID model prevents tower, package, schedule and field records from drifting apart."},{"step_no":3,"stage":"Load approved transmission design","input":"IFC route, tower schedule, substation GA, access design","gis_method":"CAD/GIS import, Project, feature QA","output":"Approved design geometry","why":"Progress must be measured against current approved design/version."},{"step_no":4,"stage":"Build linear referencing / chainage","input":"Transmission centerline + tower sequence","gis_method":"Route / measure / chainage fields","output":"Chainage-controlled towers and sections","why":"Chainage supports work-front planning, logistics, access and reporting."},{"step_no":5,"stage":"Create tower, span & stringing sections","input":"Tower points and line geometry","gis_method":"Points To Line / Split Line / route events","output":"Tower, span and stringing-section feature classes","why":"Foundations/erection are tower-based while conductor/OPGW progress is section/length based."},{"step_no":6,"stage":"Create substation construction zones","input":"GA drawing and discipline areas","gis_method":"Digitize civil/electrical work zones","output":"Substation work polygons","why":"Substation progress is multi-discipline and spatially different from line construction."},{"step_no":7,"stage":"Map access, camps, yards & depots","input":"Logistics plan, temporary works, roads","gis_method":"Digitize / GPS / network context","output":"Construction logistics layers","why":"Access and material logistics frequently control field productivity."},{"step_no":8,"stage":"Import baseline schedule","input":"Primavera P6 / MS Project export","gis_method":"CSV/XLSX staging + keyed join","output":"Baseline start/finish and milestones","why":"Planned progress requires a frozen schedule baseline and data date."},{"step_no":9,"stage":"Map schedule activities to GIS IDs","input":"Activity IDs, WBS, tower/section/package IDs","gis_method":"Relationship table / crosswalk","output":"Schedule–GIS activity crosswalk","why":"A schedule activity should resolve to the exact tower, section, substation zone or package it represents."},{"step_no":10,"stage":"Load contract / work-package structure","input":"Contract packages, contractor, BOQ/weight basis","gis_method":"Related tables + domains","output":"Package and contractor register","why":"Portfolio reporting needs progress by contractor, package and discipline."},{"step_no":11,"stage":"Track land / ROW readiness","input":"Access permissions, ROW handover, land cases","gis_method":"Join readiness status to construction locations","output":"Land/access readiness map","why":"Construction cannot proceed merely because the design is complete."},{"step_no":12,"stage":"Track tower survey & setout","input":"Survey reports, coordinates, benchmarks","gis_method":"Field Maps / Survey123 / GNSS update","output":"Survey-ready tower status","why":"Foundation work begins with verified setting-out and control."},{"step_no":13,"stage":"Track excavation & foundations","input":"Daily reports, concrete pours, inspections","gis_method":"Stage status + quantities + dates","output":"Foundation progress map","why":"Concrete, rebar, curing and backfill are measurable physical progress components."},{"step_no":14,"stage":"Track tower erection","input":"Steel issue, erection reports, bolt/verticality inspections","gis_method":"Tower stage update","output":"Erection progress map","why":"Tower erection readiness controls later stringing work fronts."},{"step_no":15,"stage":"Track stringing & OPGW","input":"Stringing plan, drum schedule, sagging/clipping reports","gis_method":"Section progress + installed length","output":"Conductor/OPGW progress by section","why":"Stringing is best measured by section and installed length, not only by tower count."},{"step_no":16,"stage":"Track substation civil works","input":"Earthwork, drainage, foundations, building progress","gis_method":"Discipline progress by polygon/work zone","output":"Civil progress dashboard","why":"Substation civil readiness gates equipment installation."},{"step_no":17,"stage":"Track primary/secondary installation","input":"Equipment installation, busbar, cabling, panels","gis_method":"Equipment/discipline status","output":"Electrical installation progress","why":"Physical installation and protection/control completion need separate visibility."},{"step_no":18,"stage":"Track materials & logistics","input":"POs, delivery notes, depot issue, installed quantities","gis_method":"Material register + depot mapping","output":"Material readiness / shortage map","why":"A schedule can look healthy until conductor, steel or critical equipment is unavailable."},{"step_no":19,"stage":"Capture QA/QC inspections","input":"ITP, test sheets, NCRs, hold/witness points","gis_method":"Related inspection table + evidence","output":"QA acceptance / NCR layer","why":"Installed work is not fully earned when quality acceptance is outstanding."},{"step_no":20,"stage":"Capture HSE observations","input":"Site inspections, near misses, corrective actions","gis_method":"Spatial observation register","output":"HSE action map","why":"Safety constraints can stop work fronts and require management visibility."},{"step_no":21,"stage":"Capture daily / weekly field progress","input":"Crew, equipment, quantities, photos, weather","gis_method":"Mobile forms + attachments","output":"Dated field evidence","why":"Every progress claim should be traceable to a data date and field evidence."},{"step_no":22,"stage":"Drone / photo progress verification","input":"Drone imagery, geotagged photos, 360 captures","gis_method":"Imagery catalog / orthomosaic comparison","output":"Visual verification layer","why":"Remote evidence strengthens progress QA across dispersed construction fronts."},{"step_no":23,"stage":"Calculate physical progress","input":"Stage weights + installed quantities","gis_method":"Calculate Field / model","output":"Actual physical progress %","why":"Progress should be earned from measurable completed work, not subjective status labels."},{"step_no":24,"stage":"Calculate planned progress","input":"Baseline start/finish + time-phased weights","gis_method":"Schedule curve calculation","output":"Planned progress % at data date","why":"A data-date comparison needs an explicit baseline reference."},{"step_no":25,"stage":"Calculate schedule variance / SPI-like index","input":"Actual and planned progress","gis_method":"Actual – Planned; Actual / Planned","output":"Variance map and schedule-health index","why":"Spatial variance highlights delayed fronts that are hidden in project averages."},{"step_no":26,"stage":"Calculate lookahead readiness","input":"ROW, access, material, design, plant, permit readiness","gis_method":"Weighted readiness score","output":"2–4 week lookahead readiness map","why":"Construction management needs to know where planned work is genuinely ready to start."},{"step_no":27,"stage":"Calculate action priority","input":"Schedule deficit, blocker severity, critical-path factor, readiness","gis_method":"Weighted action-priority score","output":"Priority intervention map","why":"Not every delayed item requires the same management attention."},{"step_no":28,"stage":"Track milestones / critical path","input":"Baseline and forecast milestone dates","gis_method":"Variance calculation + milestone dashboard","output":"Milestone slippage view","why":"Milestones provide executive-level schedule control beyond individual tower progress."},{"step_no":29,"stage":"Track progress payments","input":"Measured progress, IPC claimed/certified/paid values","gis_method":"Package financial table joined to progress","output":"Physical vs certified/paid comparison","why":"Financial progress should be compared with, not substituted for, physical progress."},{"step_no":30,"stage":"Publish Web GIS & freeze data date","input":"Validated progress register + evidence","gis_method":"Hosted/enterprise web layers + dashboard / single-file portfolio demo","output":"Construction Progress Web GIS","why":"A controlled data-date snapshot makes weekly/monthly reporting auditable."},{"step_no":31,"stage":"QA, change control & handover","input":"As-built, punch list, commissioning, final records","gis_method":"Version reconciliation + archival QA","output":"As-built / closeout GIS","why":"Construction GIS should transition cleanly into the operational asset register."}],"projectDetails":{"overview":{"purpose":"Spatially control transmission construction from approved design and baseline schedule through field progress, quantities, contractor work fronts, stringing, substations, access, materials, QA/QC, HSE, constraints, evidence, payments and closeout.","question":"Where is work complete, on track, at risk or delayed; what is causing the variance; what is ready for the next 30 days; and which construction locations require immediate management action?","study":"Synthetic portfolio demonstration: two transmission corridors (400 kV + 230 kV), three substations, tower/stringing/access work fronts and related project-control tables. No location, contractor, cost or progress value is an official Power Grid record.","crs":"Desktop construction analysis: EPSG:32645 — WGS 84 / UTM zone 45N. Web display: EPSG:4326 — WGS 84 / Leaflet. All embedded GeoJSON is explicitly reprojected to WGS84 before web rendering.","software":["ArcGIS Pro — desktop construction GIS","ArcGIS Enterprise / Online — operational Web GIS","Field Maps / Survey123 — field progress and inspections","Primavera P6 / MS Project — schedule source","Power BI / dashboards — optional executive reporting","QGIS / PostGIS — open-source equivalent path"],"assumptions":["The approved P06/P05 master UI shell is retained.","Progress is physical, quantity/stage based; financial payment is kept separate.","Baseline dates are frozen for variance comparison; any approved rebaseline must be versioned.","Tower, stringing-section, substation and access progress use different measurement logic.","Lookahead readiness combines land/ROW, access, material, design, equipment and permit readiness.","All data is synthetic and must not be interpreted as contractor performance or official utility reporting."]},"data":[{"name":"Transmission Alignments","type":"Polyline","role":"Approved construction centerlines and voltage/circuit context.","fields":"line_id, line_name, voltage_kv, circuits"},{"name":"Tower Register","type":"Point","role":"Tower-by-tower foundation/erection/earthing/insulator progress.","fields":"entity_id, chainage_km, tower_type, stage_progress, planned/actual, package, contractor"},{"name":"Tower Footprints","type":"Polygon","role":"Foundation locations and construction work area reference.","fields":"tower_id, line_id, foundation_status"},{"name":"Stringing Sections","type":"Polyline","role":"Conductor, sagging/clipping and OPGW progress measured by section/length.","fields":"from_tower, to_tower, length_km, conductor_strung_km, opgw_strung_km"},{"name":"Substation Construction Areas","type":"Polygon","role":"Civil, primary, secondary and testing progress for substations.","fields":"substation_id, voltage_kv, discipline progress"},{"name":"Access Roads","type":"Polyline","role":"Temporary/permanent construction access progress and readiness.","fields":"length_km, completed_length_km, land/access readiness"},{"name":"Work Fronts","type":"Polygon","role":"Construction management zones around active stringing/line fronts.","fields":"front_id, contractor"},{"name":"Camps / Yards / Depots","type":"Point","role":"Crew, logistics and material distribution context.","fields":"camp/depot ID, contractor/material group"},{"name":"Work Packages","type":"Related Table","role":"Contractor, contract value, package planned/actual progress and forecast slip.","fields":"package_id, contractor, planned, actual, variance, IPC certified/paid"},{"name":"Material Register","type":"Related Table","role":"Ordered, delivered, issued and installed material quantities.","fields":"material, ordered, delivered, issued, installed, readiness"},{"name":"Milestones","type":"Related Table","role":"Baseline vs forecast milestone dates and variance.","fields":"milestone, baseline_date, forecast_date, variance_days"},{"name":"Issues / Constraints","type":"Point + Table","role":"ROW, material, RFI, QA, permit, weather, community and HSE constraints.","fields":"entity_id, category, severity, status, days_open, owner"},{"name":"QA/QC Records","type":"Related Table","role":"ITP hold/witness points, inspections, NCRs and evidence.","fields":"inspection_type, itp_point, result, ncr_id"},{"name":"HSE Records","type":"Related Table","role":"Spatial safety observations, near misses and corrective actions.","fields":"observation_type, severity, status, action_owner"},{"name":"Evidence Register","type":"Related Table","role":"Geotagged field photos, drone references and inspection evidence.","fields":"evidence_type, capture_date, photo_count, location_verified"},{"name":"Payment Certificates","type":"Related Table","role":"Claimed/certified/paid values by work package.","fields":"ipc_id, package_id, claimed, certified, paid, retention"}],"analysis":[{"title":"Tower physical progress","detail":"5% survey + 5% access + 10% excavation + 25% foundation + 5% curing/backfill + 30% erection + 5% earthing + 5% insulators + 10% punch list. Stage weights are demonstration values and should be replaced by the project progress-measurement procedure."},{"title":"Stringing-section progress","detail":"15% tower readiness + 10% pilot/earth wire + 40% conductor stringing + 20% sagging/clipping + 10% OPGW + 5% punch list. Installed km is tracked separately from percentage."},{"title":"Substation discipline progress","detail":"Weighted civil, building, structures, primary equipment, busbar, cabling/protection and testing/commissioning stages. Discipline weights should match the approved project progress-measurement system."},{"title":"Planned progress at data date","detail":"Linear baseline interpolation is used in this portfolio model. A production implementation should import time-phased activity/resource weights from the approved Primavera P6/MS Project baseline."},{"title":"Schedule variance","detail":"Schedule Variance (percentage points) = Actual Physical Progress − Planned Physical Progress. Negative values indicate lag against baseline."},{"title":"Physical Progress Index","detail":"Actual ÷ Planned is shown as an SPI-like physical index for construction screening. It is not formal Earned Value SPI unless EV/PV are calculated from an approved cost/resource baseline."},{"title":"Lookahead readiness","detail":"30% land/ROW + 20% access + 20% materials + 15% design + 10% plant/equipment + 5% permits/outages. This supports 2–4 week work-front readiness checks."},{"title":"Action priority","detail":"45% schedule deficit + 25% blocker severity + 15% critical-path/workfront factor + 15% readiness deficit. The score prioritizes management action; it does not replace the contractual schedule or engineer determination."},{"title":"Project progress","detail":"Overall progress is the weighted average of spatial construction entities using synthetic budget/physical weights. Financial claimed/certified/paid values are reported separately."}],"outputs":["Construction progress map","Tower foundation/erection status map","Stringing & OPGW progress map","Substation discipline progress map","Access/readiness map","Contractor/work-package map","Schedule-variance heat map","30-day lookahead readiness map","Constraint/action-priority map","Material readiness dashboard","QA/NCR and HSE action map","Milestone forecast report","Progress S-curve","Physical vs payment progress table","Field/photo evidence register","As-built / closeout handover GIS"],"qa":["Freeze and display the reporting data date.","Maintain approved baseline/rebaseline versions and do not silently overwrite dates.","Use stable engineering IDs across schedule, GIS, QA, field and payment records.","Do not count a construction stage as complete if mandatory QA hold/witness acceptance remains open.","Measure stringing by section/installed length, not only tower count.","Separate physical progress from financial payment progress.","Validate quantities against approved drawings/BOQ and field records.","Record source, timestamp and inspector/user for every field update.","Resolve duplicate/conflicting updates before monthly reporting freeze.","Flag stale records and missing evidence.","Keep synthetic portfolio contractors, costs and performance clearly labelled as demonstration data.","Final as-built geometry and commissioned asset attributes must be reconciled before transfer to the operational asset register."]},"snapshots":[{"id":"2025-12-31","label":"31 Dec 2025"},{"id":"2026-02-28","label":"28 Feb 2026"},{"id":"2026-04-30","label":"30 Apr 2026"},{"id":"2026-06-30","label":"30 Jun 2026"},{"id":"2026-08-24","label":"24 Aug 2026 · Current Data Date"}],"dataDate":"2026-08-24","projectStart":"2025-10-01","projectFinish":"2027-04-30","webCrs":"EPSG:4326","desktopCrs":"EPSG:32645 — WGS 84 / UTM zone 45N"};

let activeNav='overview',activeTheme='status',activeSnapshot=APP.dataDate,activeEntity=null,activeDetailTab='Overview',activeTableTab='register',activeProjectDetailTab='overview';
let legendOpen=false,drawerOpen=false,drawerFull=false,activeBm=null;
const filters={entityType:'All',status:'All',package:'All',contractor:'All',voltage:'All',blocker:'All',minDelay:0,lookahead:false,openConstraints:false};
const layerState={boundary:false,roads:false,river:false,lines:true,workfronts:false,towerFootprints:false,stringing:true,towers:true,substations:true,access:true,camps:true,depots:true,issues:true,lookahead:false};
const layerLabels={boundary:'Project boundary',roads:'Road context',river:'Major water crossing',lines:'Approved transmission alignments',workfronts:'Construction work-front zones',towerFootprints:'Tower foundation footprints',stringing:'Stringing sections',towers:'Tower locations',substations:'Substation construction areas',access:'Access-road works',camps:'Construction camps',depots:'Material depots',issues:'Open constraints / issues',lookahead:'Next 30-day lookahead highlights'};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function fmt(v,s=''){if(v===null||v===undefined||v==='')return'—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2})+s:String(v)}
function parseD(s){return s?new Date(s+'T00:00:00'):null}
function pctBetween(start,finish,asof){const s=parseD(start),f=parseD(finish),d=parseD(asof);if(!s||!f||!d)return 0;if(d<=s)return 0;if(d>=f)return 100;return Math.max(0,Math.min(100,100*(d-s)/(f-s)))}
function plannedAt(e){return Math.round(pctBetween(e.baseline_start,e.baseline_finish,activeSnapshot)*10)/10}
function actualAt(e){const d=parseD(activeSnapshot),ds=parseD(e.actual_start),dd=parseD(APP.dataDate),df=parseD(e.actual_finish);if(!d||!ds||d<ds)return 0;if(df&&d>=df)return 100;if(d>=dd)return num(e.current_actual_pct);const elapsed=Math.max(0,d-ds),span=Math.max(1,dd-ds);return Math.round(Math.min(num(e.current_actual_pct),num(e.current_actual_pct)*elapsed/span)*10)/10}
function varianceAt(e){return Math.round((actualAt(e)-plannedAt(e))*10)/10}
function physIndex(e){const p=plannedAt(e);return p<=0?(actualAt(e)>0?1:0):Math.round(actualAt(e)/p*100)/100}
function statusAt(e){const a=actualAt(e),v=varianceAt(e);if(a>=99.9)return'Complete';if(activeSnapshot<e.actual_start)return'Not Started';if(['QA hold','HSE corrective action'].includes(e.blocker)&&v<-10)return'Hold';if(v<-15)return'Delayed';if(v<-5)return'At Risk';return'On Track'}
function scheduleColor(s){return({Complete:'#2e9d68','On Track':'#3f7fba','At Risk':'#e1ad43',Delayed:'#d9534f',Hold:'#8b5cf6','Not Started':'#a5adb7'})[s]||'#7b8790'}
function progressColor(p){return p>=90?'#2e9d68':p>=70?'#5f92c8':p>=45?'#e1ad43':p>=20?'#e4773a':'#d9534f'}
function varianceColor(v){return v>=0?'#2e9d68':v>=-5?'#6bad7d':v>=-12?'#e1ad43':v>=-20?'#e4773a':'#d9534f'}
function priorityColor(c){return({Critical:'#7b2f4d',High:'#d9534f',Moderate:'#e1ad43',Low:'#6bad7d'})[c]||'#7b8790'}
function readinessColor(v){return v>=90?'#2e9d68':v>=75?'#6bad7d':v>=60?'#e1ad43':v>=40?'#e4773a':'#d9534f'}
function qaColor(s){return /NCR|Hold|Reinspection/.test(s)?'#d9534f':/Pending/.test(s)?'#e1ad43':'#2e9d68'}
function typeColor(t){return({'Tower':'#147d64','Stringing Section':'#7a6ca8','Substation':'#315fd5','Access Road':'#9a6b32'})[t]||'#667085'}
function isLookahead(e){const snap=parseD(activeSnapshot),next=new Date(snap);next.setDate(next.getDate()+30);const bs=parseD(e.baseline_start),bf=parseD(e.baseline_finish);return actualAt(e)<100 && ((bs>=snap&&bs<=next)||(bf>=snap&&bf<=next)||(bs<=snap&&bf>=snap))}
function searchText(e){return Object.entries(e).filter(([k])=>k!=='stage_progress').map(([,v])=>typeof v==='object'?JSON.stringify(v):String(v??'')).join(' ').toLowerCase()}
function visibleEntities(){const q=($('globalSearch')?.value||'').trim().toLowerCase();return APP.entities.filter(e=>{const st=statusAt(e),v=varianceAt(e);if(q&&!searchText(e).includes(q))return false;if(filters.entityType!=='All'&&e.entity_type!==filters.entityType)return false;if(filters.status!=='All'&&st!==filters.status)return false;if(filters.package!=='All'&&e.package_id!==filters.package)return false;if(filters.contractor!=='All'&&e.contractor!==filters.contractor)return false;if(filters.voltage!=='All'&&String(e.voltage_kv)!==filters.voltage)return false;if(filters.blocker!=='All'&&e.blocker!==filters.blocker)return false;if(filters.minDelay>0&&v>-filters.minDelay)return false;if(filters.lookahead&&!isLookahead(e))return false;if(filters.openConstraints&&(!e.blocker||e.blocker==='None'))return false;return true})}
function dynamicPriority(e){const v=varianceAt(e),delay=Math.min(100,Math.max(0,-v)/30*100),sev=({None:0,'Weather':30,'ROW / access':75,'Material shortage':70,'Design / RFI':60,'QA hold':80,'Community access':65,'Equipment delivery':75,'Permit / outage':55,'HSE corrective action':70,'Tower readiness':65,'Crossing approval':60})[e.blocker]||0;return Math.round((.45*delay+.25*sev+.15*num(e.critical_path_factor)+.15*(100-num(e.lookahead_readiness_pct)))*10)/10}
function priorityClass(e){const p=dynamicPriority(e);return p>=75?'Critical':p>=55?'High':p>=35?'Moderate':'Low'}
function themeColor(e){if(activeTheme==='status')return scheduleColor(statusAt(e));if(activeTheme==='progress')return progressColor(actualAt(e));if(activeTheme==='variance')return varianceColor(varianceAt(e));if(activeTheme==='type')return typeColor(e.entity_type);if(activeTheme==='contractor'){const names=[...new Set(APP.entities.map(x=>x.contractor))];const colors=['#147d64','#315fd5','#8b5cf6','#d28a32','#168c91','#d9534f'];return colors[names.indexOf(e.contractor)%colors.length]}if(activeTheme==='priority')return priorityColor(priorityClass(e));if(activeTheme==='qa')return qaColor(e.qa_status);if(activeTheme==='material')return readinessColor(num(e.material_readiness_pct));if(activeTheme==='lookahead')return readinessColor(num(e.lookahead_readiness_pct));return scheduleColor(statusAt(e))}
function label(e){if(e.entity_type==='Tower')return`${e.entity_id} · ${e.workfront}`;if(e.entity_type==='Stringing Section')return`${e.line_id} · ${e.from_tower}–${e.to_tower}`;return e.name}
function unique(f){return[...new Set(APP.entities.map(e=>String(e[f]??'')).filter(Boolean))].sort()}
function weightedProgress(which='actual',snap=activeSnapshot){let n=0,d=0;APP.entities.forEach(e=>{const w=num(e.budget_weight)||1;const old=activeSnapshot;activeSnapshot=snap;const p=which==='planned'?plannedAt(e):actualAt(e);activeSnapshot=old;n+=w*p;d+=w});return d?Math.round(n/d*10)/10:0}
function projectKpis(){const v=visibleEntities(),plan=weightedProgress('planned'),actual=weightedProgress('actual'),variance=Math.round((actual-plan)*10)/10;return{plan,actual,variance,delayed:v.filter(e=>['Delayed','Hold'].includes(statusAt(e))).length,lookahead:v.filter(isLookahead).length,open:v.filter(e=>e.blocker&&e.blocker!=='None').length}}

// ---------- map ----------
let map,bm={},mapLayers={};

function validateWebCoordinates(){
  let bad=[];
  function walk(x,layer){
    if(Array.isArray(x)&&x.length>=2&&typeof x[0]==='number'&&typeof x[1]==='number'){
      if(x[0] < -180 || x[0] > 180 || x[1] < -90 || x[1] > 90)bad.push([layer,x[0],x[1]]);
    }else if(Array.isArray(x))x.forEach(v=>walk(v,layer));
  }
  Object.entries(APP.geo).forEach(([name,fc])=>fc.features.forEach(f=>walk(f.geometry.coordinates,name)));
  if(bad.length){console.error('P08 invalid web coordinates — expected EPSG:4326',bad.slice(0,10));toast('Map coordinate QA failed');}
  return bad.length===0;
}

function initMap(){map=L.map('map',{zoomControl:true,preferCanvas:true,worldCopyJump:false,minZoom:4}).setView([24.53,89.36],9);bm=PortfolioMaps.create();activeBm=bm.local.addTo(map);validateWebCoordinates();drawMap();fitMap()}
function clearProjectLayers(){Object.values(mapLayers).forEach(l=>{try{map.removeLayer(l)}catch{}});mapLayers={}}
function entityFromProps(p){return byId[String(p.entity_id||p.tower_id||p.substation_id)]}
function popupHtml(e){return`<b>${esc(label(e))}</b><br>${esc(e.entity_type)} · ${esc(e.package_id)}<br>Actual ${fmt(actualAt(e),'%')} · Planned ${fmt(plannedAt(e),'%')}<br>Variance ${fmt(varianceAt(e),' pp')} · ${esc(statusAt(e))}`}
function onEntityFeature(feature,layer){const e=entityFromProps(feature.properties);if(!e)return;layer.bindTooltip(popupHtml(e),{sticky:true});layer.on('click',()=>selectEntity(e,true))}
function drawMap(){clearProjectLayers();const vis=new Set(visibleEntities().map(e=>e.entity_id));const add=(k,l)=>{mapLayers[k]=l.addTo(map)};
 if(layerState.boundary)add('boundary',L.geoJSON(APP.geo.boundary,{style:{color:'#7b8790',weight:1.5,dashArray:'7 5',fill:false}}));
 if(layerState.roads)add('roads',L.geoJSON(APP.geo.roads,{style:{color:'#b9aa8f',weight:3,opacity:.72}}));
 if(layerState.river)add('river',L.geoJSON(APP.geo.river,{style:{color:'#72aeca',weight:1,fillColor:'#8bc4dc',fillOpacity:.28}}));
 if(layerState.lines)add('lines',L.geoJSON(APP.geo.lines,{style:f=>({color:f.properties.voltage_kv==400?'#364f9d':'#5c74ba',weight:f.properties.voltage_kv==400?3.2:2.5,opacity:.55})}));
 if(layerState.workfronts)add('workfronts',L.geoJSON(APP.geo.workfronts,{style:{color:'#5e8c79',weight:1,dashArray:'4 4',fillColor:'#7fb59f',fillOpacity:.08}}));
 if(layerState.towerFootprints)add('towerFootprints',L.geoJSON(APP.geo.towerFootprints,{filter:f=>vis.has(f.properties.tower_id),style:f=>{const e=byId[f.properties.tower_id];return{color:themeColor(e),weight:1,fillColor:themeColor(e),fillOpacity:.28}}}));
 if(layerState.stringing)add('stringing',L.geoJSON(APP.geo.stringing,{filter:f=>vis.has(f.properties.entity_id),style:f=>{const e=byId[f.properties.entity_id];return{color:themeColor(e),weight:selected.has(e.entity_id)?7:4,opacity:selected.has(e.entity_id)?1:.88}},onEachFeature:onEntityFeature}));
 if(layerState.access)add('access',L.geoJSON(APP.geo.access,{filter:f=>vis.has(f.properties.entity_id),style:f=>{const e=byId[f.properties.entity_id];return{color:themeColor(e),weight:selected.has(e.entity_id)?6:3,dashArray:'5 3',opacity:.9}},onEachFeature:onEntityFeature}));
 if(layerState.substations)add('substations',L.geoJSON(APP.geo.substations,{filter:f=>vis.has(f.properties.substation_id),style:f=>{const e=byId[f.properties.substation_id];return{color:selected.has(e.entity_id)?'#0b5441':themeColor(e),weight:selected.has(e.entity_id)?3:2,fillColor:themeColor(e),fillOpacity:.42}},onEachFeature:onEntityFeature}));
 if(layerState.towers)add('towers',L.geoJSON(APP.geo.towers,{filter:f=>vis.has(f.properties.entity_id),pointToLayer:(f,ll)=>{const e=byId[f.properties.entity_id];return L.circleMarker(ll,{radius:e.voltage_kv==400?5:4,color:selected.has(e.entity_id)?'#0b5441':'#fff',weight:selected.has(e.entity_id)?3:1.2,fillColor:themeColor(e),fillOpacity:.95})},onEachFeature:onEntityFeature}));
 if(layerState.camps)add('camps',L.geoJSON(APP.geo.camps,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,color:'#344054',weight:1.5,fillColor:'#d0d5dd',fillOpacity:1}).bindTooltip(`${esc(f.properties.name)}<br>${esc(f.properties.contractor)}`)}));
 if(layerState.depots)add('depots',L.geoJSON(APP.geo.depots,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,color:'#7a5b2e',weight:1.5,fillColor:'#e5c65c',fillOpacity:1}).bindTooltip(`${esc(f.properties.name)}<br>${esc(f.properties.material_group)}`)}));
 if(layerState.issues)add('issues',L.geoJSON(APP.geo.issues,{filter:f=>f.properties.status!=='Closed',pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:f.properties.severity==='Critical'?7:5,color:'#fff',weight:1.5,fillColor:f.properties.severity==='Critical'?'#7b2f4d':f.properties.severity==='High'?'#d9534f':'#e1ad43',fillOpacity:.95}).bindTooltip(`<b>${esc(f.properties.issue_id)}</b><br>${esc(f.properties.category)} · ${esc(f.properties.severity)}`)}));
 if(layerState.lookahead){const ids=new Set(visibleEntities().filter(isLookahead).map(e=>e.entity_id));add('lookahead',L.geoJSON(APP.geo.towers,{filter:f=>ids.has(f.properties.entity_id),pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:9,color:'#0f6e56',weight:2,fill:false,dashArray:'3 2'})}))}
 renderLegend();}
function fitMap(){const l=L.geoJSON(APP.geo.boundary);try{map.fitBounds(l.getBounds(),{padding:[28,28],maxZoom:10})}catch{}}

// ---------- S curve ----------
function monthDates(){const arr=[];let d=new Date(APP.projectStart+'T00:00:00'),end=new Date(APP.projectFinish+'T00:00:00');d=new Date(d.getFullYear(),d.getMonth()+1,0);while(d<=end){arr.push(d.toISOString().slice(0,10));d=new Date(d.getFullYear(),d.getMonth()+2,0)}return arr}
function sCurveSvg(){const dates=monthDates(),W=292,H=146,pad={l:24,r:8,t:10,b:22};const old=activeSnapshot;const planned=[],actual=[];dates.forEach(d=>{activeSnapshot=d;planned.push(weightedProgress('planned',d));actual.push(parseD(d)<=parseD(APP.dataDate)?weightedProgress('actual',d):null)});activeSnapshot=old;const x=i=>pad.l+i*(W-pad.l-pad.r)/Math.max(1,dates.length-1),y=v=>pad.t+(100-v)*(H-pad.t-pad.b)/100;const path=a=>a.map((v,i)=>v===null?null:`${i===0||a[i-1]===null?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');return`<div class="p08-scurve"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}"/><line class="axis" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}"/>${[0,25,50,75,100].map(v=>`<line class="grid" x1="${pad.l}" y1="${y(v)}" x2="${W-pad.r}" y2="${y(v)}"/><text x="2" y="${y(v)+3}">${v}</text>`).join('')}<path class="plan" d="${path(planned)}"/><path class="actual" d="${path(actual)}"/>${dates.filter((_,i)=>i%3===0).map((d,i0)=>{const i=dates.indexOf(d);return`<text x="${x(i)-10}" y="${H-6}">${d.slice(2,7)}</text>`}).join('')}</svg><div><span class="legend-line"><i></i>Planned</span><span class="legend-line actual"><i></i>Actual</span></div></div>`}
function bars(field,fn=null){const c={};visibleEntities().forEach(e=>{const k=fn?fn(e):String(e[field]||'—');c[k]=(c[k]||0)+1});const ar=Object.entries(c).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...ar.map(x=>x[1]));return`<div class="p08-chart">${ar.map(([k,v])=>`<div class="p08-bar"><header><span>${esc(k)}</span><b>${v}</b></header><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div></div>`).join('')}</div>`}

function overviewHtml(){const k=projectKpis();const delayed=visibleEntities().filter(e=>['Delayed','Hold'].includes(statusAt(e))).sort((a,b)=>dynamicPriority(b)-dynamicPriority(a))[0];return`<div class="metric-grid"><div class="metric-card"><b>${fmt(k.plan,'%')}</b><span>Planned progress</span></div><div class="metric-card"><b>${fmt(k.actual,'%')}</b><span>Actual progress</span></div><div class="metric-card"><b>${fmt(k.variance,' pp')}</b><span>Schedule variance</span></div><div class="metric-card"><b>${k.delayed}</b><span>Delayed / Hold items</span></div></div><div class="progress-band"><i class="pb0"></i><i class="pb1"></i><i class="pb2"></i><i class="pb3"></i><i class="pb4"></i></div><div class="p08-snapshot"><b>Reporting snapshot: ${esc(APP.snapshots.find(s=>s.id===activeSnapshot)?.label||activeSnapshot)}</b><p>Map, S-curve, planned/actual values and schedule status are recalculated for the selected reporting date.</p></div>${sCurveSvg()}${delayed?`<div class="reco"><div class="eyebrow">Highest management priority</div><h3>${esc(label(delayed))}</h3><p>${esc(delayed.blocker)} · variance ${fmt(varianceAt(delayed),' pp')} · lookahead readiness ${fmt(delayed.lookahead_readiness_pct,'%')}. Priority ${fmt(dynamicPriority(delayed))}.</p><div style="margin-top:9px"><button class="secondary-btn" data-open="${esc(delayed.entity_id)}">Open item</button></div></div>`:''}<div class="section-title">Construction snapshot</div><div class="analysis-card"><b>${APP.summary.towers} towers · ${APP.summary.stringing_sections} stringing sections · ${APP.summary.substations} substations</b><p>${k.lookahead} items in the next 30-day lookahead · ${k.open} visible items with constraints · ${APP.summary.issues_open} open issue records.</p></div>`}
function layersHtml(){return`<div style="display:flex;gap:7px;margin-bottom:8px"><button class="secondary-btn" id="allOn">All On</button><button class="secondary-btn" id="allOff">All Off</button></div>`+Object.keys(layerState).map(k=>`<div class="layer-group"><div class="layer-row"><input id="lay_${k}" type="checkbox" ${layerState[k]?'checked':''}><label for="lay_${k}">${esc(layerLabels[k])}</label><span class="pill">${layerState[k]?'On':'Off'}</span></div></div>`).join('')}
function analysisHtml(){const k=projectKpis();return`<div class="control-row"><label>Progress snapshot</label><select id="fSnapshot">${APP.snapshots.map(s=>`<option value="${s.id}">${esc(s.label)}</option>`).join('')}</select></div><div class="control-row"><label>Entity type</label><select id="fType"><option>All</option>${unique('entity_type').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="control-row"><label>Construction status</label><select id="fStatus"><option>All</option><option>Complete</option><option>On Track</option><option>At Risk</option><option>Delayed</option><option>Hold</option><option>Not Started</option></select></div><div class="control-row"><label>Work package</label><select id="fPackage"><option>All</option>${unique('package_id').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="control-row"><label>Contractor</label><select id="fContractor"><option>All</option>${unique('contractor').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="control-row"><label>Voltage</label><select id="fVoltage"><option>All</option><option>400</option><option>230</option></select></div><div class="control-row"><label>Primary blocker</label><select id="fBlocker"><option>All</option>${unique('blocker').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="control-row"><label>Minimum delay <span id="delayVal">${filters.minDelay} pp</span></label><input id="fDelay" type="range" min="0" max="30" step="1" value="${filters.minDelay}"></div><div class="layer-row"><input id="fLookahead" type="checkbox" ${filters.lookahead?'checked':''}><label for="fLookahead">Next 30-day lookahead only</label></div><div class="layer-row"><input id="fConstraints" type="checkbox" ${filters.openConstraints?'checked':''}><label for="fConstraints">Items with constraints only</label></div><div class="reco"><div class="eyebrow">Live project controls</div><h3>${fmt(k.actual,'%')} actual vs ${fmt(k.plan,'%')} planned</h3><p>${fmt(k.variance,' pp')} schedule variance · ${k.delayed} delayed/hold · ${k.lookahead} lookahead items.</p></div><div class="section-title">S-curve</div>${sCurveSvg()}<div class="section-title">Construction status</div>${bars('',statusAt)}<div class="section-title">Work type</div>${bars('entity_type')}<div class="section-title">Contractor</div>${bars('contractor')}<div class="section-title">Primary blocker</div>${bars('blocker')}`}
function resultsHtml(){const a=visibleEntities().sort((x,y)=>dynamicPriority(y)-dynamicPriority(x));return`<div class="selection-bar ${selected.size?'show':''}"><b>${selected.size} selected</b>${selected.size>=2&&selected.size<=4?'<button class="text-btn" id="compareSelected">Compare</button>':''}<button class="text-btn" id="zoomSelected">Zoom</button><button class="text-btn" id="clearSelected">Clear</button></div><div class="entity-list">${a.map((e,i)=>`<div class="entity-row ${selected.has(e.entity_id)?'selected':''}" data-row="${esc(e.entity_id)}"><input class="row-check" data-check="${esc(e.entity_id)}" type="checkbox" ${selected.has(e.entity_id)?'checked':''}><span class="rank ${i<3?'top':''}">${i+1}</span><span><b>${esc(label(e))}</b><small>${esc(e.entity_type)} · ${fmt(actualAt(e),'%')} actual / ${fmt(plannedAt(e),'%')} plan · ${esc(statusAt(e))}</small></span><button class="info-btn" data-info="${esc(e.entity_id)}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r="1"/></svg></button></div>`).join('')}</div>`}
function processHtml(){return APP.process.map((x,i)=>`<div class="process-step ${i===0?'active':''}"><button><span class="step-num">${x.step_no}</span><span><b>${esc(x.stage)}</b><small>${esc(x.gis_method)}</small></span></button><div class="process-detail">${esc(x.why)}<br><b>Output:</b> ${esc(x.output)}</div></div>`).join('')}
function dataHtml(){return`<div class="reco"><div class="eyebrow">Embedded construction controls</div><h3>${APP.entities.length} spatial construction entities</h3><p>Towers, stringing sections, substations and access works are linked to work packages, materials, milestones, issues, QA/HSE, evidence and payment tables.</p></div><div style="margin-top:10px"><button class="primary-btn" id="openDrawer">Open data drawer</button></div>`}
function fieldHtml(){const e=selected.size===1?byId[[...selected][0]]:activeEntity;return`<div class="project-note">Field update is a local portfolio draft. Production use should save through Field Maps/Survey123 or another controlled mobile workflow with user, timestamp and attachments.</div>${e?`<div class="p08-snapshot"><b>Selected: ${esc(label(e))}</b><p>${esc(e.package_id)} · ${esc(e.contractor)}</p></div>`:''}<form id="fieldForm">${[['Entity ID',e?.entity_id||''],['Update date',APP.dataDate],['Physical progress %',e?actualAt(e):''],['Installed quantity / unit',''],['Crew / manpower',''],['Plant / equipment',''],['QA status',e?.qa_status||''],['HSE observation',''],['Constraint / blocker',e?.blocker||''],['Photo / drone evidence ref',''],['GPS / chainage',''],['Recommended action','']].map(([l,v],i)=>`<div class="control-row"><label>${esc(l)}</label><input type="text" name="f${i}" value="${esc(v)}" placeholder="${esc(l)}"></div>`).join('')}<div class="control-row"><label>Notes</label><textarea name="notes" style="width:100%;min-height:82px;border:1px solid var(--border);border-radius:8px;padding:8px"></textarea></div><div style="display:flex;gap:7px"><button class="primary-btn" type="submit">Save draft</button><button class="secondary-btn" type="button" id="fieldJson">Export JSON</button></div></form>`}
function exportHtml(){return`<div class="reco"><div class="eyebrow">Current working set</div><h3>${selected.size?selected.size+' selected items':visibleEntities().length+' filtered items'}</h3><p>Exports include current snapshot planned/actual progress, variance, status, readiness and action priority.</p></div><div style="display:grid;gap:8px;margin-top:10px"><button class="secondary-btn" id="exportRegister">Construction Register CSV</button><button class="secondary-btn" id="exportJson">Selection JSON</button><button class="secondary-btn" id="exportIssues">Open Issues CSV</button><button class="secondary-btn" id="exportPackages">Work Packages CSV</button><button class="secondary-btn" id="print2">Print / Save PDF</button></div>`}
function projectDetailsHtml(){const d=APP.projectDetails,tabs=[['overview','Overview'],['data','Data'],['desktop','Desktop Build'],['analysis','Analysis / Model'],['outputs','Outputs'],['qa','QA / Limits']];let h=`<div class="project-tabs">${tabs.map(([id,l])=>`<button class="${activeProjectDetailTab===id?'active':''}" data-ptab="${id}">${l}</button>`).join('')}</div>`;if(activeProjectDetailTab==='overview')h+=`<div class="project-meta"><div class="meta-row"><b>Purpose</b><span>${esc(d.overview.purpose)}</span></div><div class="meta-row"><b>Core GIS question</b><span>${esc(d.overview.question)}</span></div><div class="meta-row"><b>Study / data status</b><span>${esc(d.overview.study)}</span></div><div class="meta-row"><b>Coordinate system</b><span>${esc(d.overview.crs)}</span></div></div><div class="section-title">Platform path</div><div class="platform-chips">${d.overview.software.map(x=>`<span class="platform-chip">${esc(x)}</span>`).join('')}</div><div class="section-title">Assumptions</div><ul class="check-list">${d.overview.assumptions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if(activeProjectDetailTab==='data')h+=`<div class="project-note">A real construction GIS should also store source system, revision, approval status, data date, updater, evidence link and confidentiality for every dataset.</div>`+d.data.map(x=>`<div class="data-card"><header><b>${esc(x.name)}</b><span class="data-type">${esc(x.type)}</span></header><p>${esc(x.role)}</p><div class="field-line"><b>Key fields:</b> ${esc(x.fields)}</div></div>`).join('');if(activeProjectDetailTab==='desktop')h+=`<div class="project-note"><b>ArcGIS Pro + schedule crosswalk is the preferred reproducible path.</b> Field capture and Web GIS should not bypass schedule/WBS governance.</div>`+APP.process.map(x=>`<div class="desktop-step"><span class="no">${x.step_no}</span><div><h4>${esc(x.stage)}</h4><div class="tool">${esc(x.gis_method)}</div><p>${esc(x.why)}</p><div class="output"><b>Output:</b> ${esc(x.output)}</div></div></div>`).join('');if(activeProjectDetailTab==='analysis')h+=d.analysis.map(x=>`<div class="analysis-card"><b>${esc(x.title)}</b><p>${esc(x.detail)}</p></div>`).join('');if(activeProjectDetailTab==='outputs')h+=`<div class="section-title">Expected deliverables</div><div class="output-list">${d.outputs.map(x=>`<span class="output-pill">${esc(x)}</span>`).join('')}</div>`;if(activeProjectDetailTab==='qa')h+=`<div class="section-title">Quality assurance and limitations</div><ul class="check-list">${d.qa.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="project-note">This is synthetic portfolio data. Contractual progress, extension-of-time, payment certification, quality acceptance and HSE determinations require the approved project procedures and authorized records.</div>`;return h}

function renderPanel(){const head=$('panelHead'),body=$('panelBody');const title=activeNav==='projectDetails'?'Project Details':activeNav[0].toUpperCase()+activeNav.slice(1);const desc={overview:'Project progress, S-curve and current construction priority.',layers:'Control construction, logistics, issue and lookahead layers.',analysis:'Snapshot, schedule, contractor and readiness analysis.',results:'Rank, select and compare construction items.',process:'Desktop GIS / schedule / field progress workflow.',data:'Open construction-control tables.',field:'Field progress update draft.',export:'Export current construction working sets.',projectDetails:'Data, desktop build, progress model, outputs and QA.'}[activeNav]||'';head.innerHTML=`<h2>${title}</h2><p>${desc}</p>`;body.innerHTML=activeNav==='overview'?overviewHtml():activeNav==='layers'?layersHtml():activeNav==='analysis'?analysisHtml():activeNav==='results'?resultsHtml():activeNav==='process'?processHtml():activeNav==='data'?dataHtml():activeNav==='field'?fieldHtml():activeNav==='export'?exportHtml():projectDetailsHtml();bindPanel()}
function setNav(n){activeNav=n;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===n));renderPanel();if(innerWidth<=820)$('contextPanel').classList.add('mobile-open')}
function bindPanel(){document.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{activeProjectDetailTab=b.dataset.ptab;renderPanel()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>selectEntity(byId[b.dataset.open],true));$('allOn')?.addEventListener('click',()=>{Object.keys(layerState).forEach(k=>layerState[k]=true);drawMap();renderPanel()});$('allOff')?.addEventListener('click',()=>{Object.keys(layerState).forEach(k=>layerState[k]=false);drawMap();renderPanel()});Object.keys(layerState).forEach(k=>$(`lay_${k}`)?.addEventListener('change',e=>{layerState[k]=e.target.checked;drawMap();renderPanel()}));document.querySelectorAll('.entity-row').forEach(r=>r.onclick=e=>{if(e.target.closest('input')||e.target.closest('button'))return;selectEntity(byId[r.dataset.row],true)});document.querySelectorAll('.row-check').forEach(c=>c.onchange=e=>{e.stopPropagation();c.checked?selected.add(c.dataset.check):selected.delete(c.dataset.check);drawMap();renderPanel()});document.querySelectorAll('[data-info]').forEach(b=>b.onclick=e=>{e.stopPropagation();selectEntity(byId[b.dataset.info],true)});$('compareSelected')?.addEventListener('click',compareSelected);$('zoomSelected')?.addEventListener('click',zoomSelected);$('clearSelected')?.addEventListener('click',()=>{selected.clear();drawMap();renderPanel()});document.querySelectorAll('.process-step button').forEach(b=>b.onclick=()=>{const p=b.closest('.process-step'),was=p.classList.contains('active');document.querySelectorAll('.process-step').forEach(x=>x.classList.remove('active'));if(!was)p.classList.add('active')});const map=[['fType','entityType'],['fStatus','status'],['fPackage','package'],['fContractor','contractor'],['fVoltage','voltage'],['fBlocker','blocker']];map.forEach(([id,key])=>{const x=$(id);if(x){x.value=filters[key];x.onchange=()=>{filters[key]=x.value;refreshAnalysis()}}});if($('fSnapshot')){$('fSnapshot').value=activeSnapshot;$('fSnapshot').onchange=()=>{activeSnapshot=$('fSnapshot').value;refreshAnalysis()}}$('fDelay')?.addEventListener('input',e=>{$('delayVal').textContent=e.target.value+' pp'});$('fDelay')?.addEventListener('change',e=>{filters.minDelay=Number(e.target.value);refreshAnalysis()});$('fLookahead')?.addEventListener('change',e=>{filters.lookahead=e.target.checked;refreshAnalysis()});$('fConstraints')?.addEventListener('change',e=>{filters.openConstraints=e.target.checked;refreshAnalysis()});$('openDrawer')?.addEventListener('click',()=>toggleDrawer(true));$('fieldForm')?.addEventListener('submit',e=>{e.preventDefault();toast('Field progress draft captured in this session')});$('fieldJson')?.addEventListener('click',()=>downloadJson('P08_field_progress_draft.json',Object.fromEntries(new FormData($('fieldForm')).entries())));$('exportRegister')?.addEventListener('click',exportRegister);$('exportJson')?.addEventListener('click',()=>downloadJson('P08_selection.json',selectionRows()));$('exportIssues')?.addEventListener('click',()=>exportRowsCsv(APP.issues.filter(x=>x.status!=='Closed'),'P08_open_issues.csv'));$('exportPackages')?.addEventListener('click',()=>exportRowsCsv(APP.workPackages,'P08_work_packages.csv'));$('print2')?.addEventListener('click',()=>window.print())}
function refreshAnalysis(){drawMap();renderDrawer();renderPanel()}

function selectEntity(e,open){if(!e)return;activeEntity=e;selected.add(e.entity_id);drawMap();if(activeNav==='results')renderPanel();if(open)openDetails(e)}
function openDetails(e){activeEntity=e;activeDetailTab='Overview';$('detailDrawer').classList.add('open');renderDetails();zoomEntity(e)}
function related(e){return{issues:APP.issues.filter(x=>x.entity_id===e.entity_id),qa:APP.qaRecords.filter(x=>x.entity_id===e.entity_id),hse:APP.hseRecords.filter(x=>x.entity_id===e.entity_id),evidence:APP.evidence.filter(x=>x.entity_id===e.entity_id)}}
function kvRows(a){return a.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
function readinessHtml(e){const a=[['ROW / land',num(e.land_row_readiness_pct??100)],['Access',num(e.access_readiness_pct??100)],['Materials',num(e.material_readiness_pct??100)],['Design',num(e.design_readiness_pct??100)],['Permit / outage',num(e.permit_readiness_pct??100)],['Lookahead',num(e.lookahead_readiness_pct)]];return`<div class="readiness-grid">${a.map(([l,v])=>`<div class="readiness-card"><b style="color:${readinessColor(v)}">${fmt(v,'%')}</b><span>${esc(l)}</span></div>`).join('')}</div>`}
function stageRows(e){return Object.entries(e.stage_progress||{}).map(([k,v])=>`<div class="timeline-row"><span>${esc(k)}</span><div class="track"><div class="plan" style="width:${Math.min(100,plannedAt(e))}%"></div><div class="actual" style="width:${Math.min(100,num(v))}%"></div></div><b>${fmt(v,'%')}</b></div>`).join('')}
function renderDetails(){const e=activeEntity;if(!e)return;$('detailEyebrow').textContent=e.entity_type;$('detailTitle').textContent=label(e);$('detailSubtitle').textContent=`${e.package_id} · ${e.contractor}`;const tabs=['Overview','Progress','Schedule','QA / HSE','Materials','Evidence'];$('detailTabs').innerHTML=tabs.map(t=>`<button class="${t===activeDetailTab?'active':''}" data-dtab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-dtab]').forEach(b=>b.onclick=()=>{activeDetailTab=b.dataset.dtab;renderDetails()});const rel=related(e);const metrics=`<div class="detail-metrics"><div class="detail-metric"><b>${fmt(actualAt(e),'%')}</b><span>Actual</span></div><div class="detail-metric"><b>${fmt(plannedAt(e),'%')}</b><span>Planned</span></div><div class="detail-metric"><b style="color:${varianceColor(varianceAt(e))}">${fmt(varianceAt(e),' pp')}</b><span>Variance</span></div><div class="detail-metric"><b>${fmt(dynamicPriority(e))}</b><span>Action priority</span></div></div>`;let body=metrics;if(activeDetailTab==='Overview')body+=`<div class="section-title">Overview</div>`+kvRows([['Status',statusAt(e)],['Work type',e.entity_type],['Voltage',e.voltage_kv?e.voltage_kv+' kV':'—'],['Workfront',e.workfront],['Package',e.package_id],['Contractor',e.contractor],['Primary blocker',e.blocker],['Priority',priorityClass(e)]]);if(activeDetailTab==='Progress')body+=`<div class="section-title">Stage progress</div>${stageRows(e)}<div class="section-title">Readiness</div>${readinessHtml(e)}`;if(activeDetailTab==='Schedule')body+=`<div class="section-title">Schedule</div>`+kvRows([['Baseline start',e.baseline_start],['Baseline finish',e.baseline_finish],['Actual start',e.actual_start||'—'],['Actual finish',e.actual_finish||'—'],['Planned at snapshot',fmt(plannedAt(e),'%')],['Actual at snapshot',fmt(actualAt(e),'%')],['Variance',fmt(varianceAt(e),' pp')],['Physical progress index',fmt(physIndex(e))],['Next 30-day lookahead',isLookahead(e)?'Yes':'No']]);if(activeDetailTab==='QA / HSE')body+=`<div class="section-title">QA / HSE</div>`+kvRows([['QA status',e.qa_status],['HSE status',e.hse_status],['QA records',rel.qa.length],['Open NCR / reinspection',rel.qa.filter(x=>/NCR|Reinspection/.test(x.result)).length],['HSE observations',rel.hse.length],['Open HSE actions',rel.hse.filter(x=>x.status!=='Closed').length],['Issue records',rel.issues.length],['Open issues',rel.issues.filter(x=>x.status!=='Closed').length]]);if(activeDetailTab==='Materials')body+=`<div class="section-title">Material / quantity</div>${readinessHtml(e)}`+kvRows([['Concrete placed',e.foundation_concrete_placed_m3!==undefined?fmt(e.foundation_concrete_placed_m3,' m³'):'—'],['Tower steel erected',e.tower_steel_erected_t!==undefined?fmt(e.tower_steel_erected_t,' t'):'—'],['Conductor strung',e.conductor_strung_km!==undefined?fmt(e.conductor_strung_km,' km'):'—'],['OPGW strung',e.opgw_strung_km!==undefined?fmt(e.opgw_strung_km,' km'):'—'],['Completed access',e.completed_length_km!==undefined?fmt(e.completed_length_km,' km'):'—'],['Primary equipment installed',e.primary_equipment_installed_pct!==undefined?fmt(e.primary_equipment_installed_pct,'%'):'—']]);if(activeDetailTab==='Evidence')body+=`<div class="section-title">Field evidence</div>`+kvRows([['Evidence records',rel.evidence.length],['Latest capture',rel.evidence.length?rel.evidence.sort((a,b)=>b.capture_date.localeCompare(a.capture_date))[0].capture_date:'—'],['Location verified',rel.evidence.filter(x=>x.location_verified==='Yes').length],['Open constraints',rel.issues.filter(x=>x.status!=='Closed').length]])+`<div class="section-title">Recent evidence</div>`+rel.evidence.slice(0,6).map(x=>`<div class="analysis-card"><b>${esc(x.evidence_type)} · ${esc(x.capture_date)}</b><p>${x.photo_count} file(s) · ${esc(x.notes)} · location ${esc(x.location_verified)}</p></div>`).join('');$('detailBody').innerHTML=body}
function zoomEntity(e){let layer=null;if(e.entity_type==='Tower')layer=L.geoJSON(APP.geo.towers,{filter:f=>f.properties.entity_id===e.entity_id});else if(e.entity_type==='Stringing Section')layer=L.geoJSON(APP.geo.stringing,{filter:f=>f.properties.entity_id===e.entity_id});else if(e.entity_type==='Substation')layer=L.geoJSON(APP.geo.substations,{filter:f=>f.properties.substation_id===e.entity_id});else layer=L.geoJSON(APP.geo.access,{filter:f=>f.properties.entity_id===e.entity_id});try{map.fitBounds(layer.getBounds(),{padding:[70,70],maxZoom:e.entity_type==='Tower'?15:13})}catch{}}
function zoomSelected(){const ids=new Set(selected),fcs=[];for(const g of ['towers','stringing','substations','access'])APP.geo[g].features.forEach(f=>{const id=f.properties.entity_id||f.properties.substation_id;if(ids.has(id))fcs.push(f)});if(!fcs.length)return;try{map.fitBounds(L.geoJSON({type:'FeatureCollection',features:fcs}).getBounds(),{padding:[50,50]})}catch{}}
function compareSelected(){const a=[...selected].map(id=>byId[id]).filter(Boolean).slice(0,4);if(a.length<2)return;$('detailDrawer').classList.add('open');$('detailEyebrow').textContent='Comparison';$('detailTitle').textContent=`${a.length} selected construction items`;$('detailSubtitle').textContent='Progress · variance · readiness · constraints';$('detailTabs').innerHTML='';const rows=[['Item',label],['Type',e=>e.entity_type],['Actual',e=>fmt(actualAt(e),'%')],['Planned',e=>fmt(plannedAt(e),'%')],['Variance',e=>fmt(varianceAt(e),' pp')],['Status',statusAt],['Blocker',e=>e.blocker],['Lookahead readiness',e=>fmt(e.lookahead_readiness_pct,'%')],['Priority',e=>priorityClass(e)]];$('detailBody').innerHTML=`<div style="overflow:auto"><table class="data-table"><thead><tr><th>Metric</th>${a.map(e=>`<th>${esc(e.entity_id)}</th>`).join('')}</tr></thead><tbody>${rows.map(([l,fn])=>`<tr><td><b>${esc(l)}</b></td>${a.map(e=>`<td>${esc(fn(e))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;zoomSelected()}

const tableDefs={register:{label:'Construction Register',rows:dynamicRegister,cols:['entity_id','entity_type','name','package_id','contractor','planned_progress_pct','actual_progress_pct','variance_pp','status','blocker','lookahead_readiness_pct','qa_status','action_priority_score','priority_class']},towers:{label:'Towers',rows:()=>APP.entities.filter(e=>e.entity_type==='Tower'),cols:['entity_id','line_id','chainage_km','tower_type','package_id','contractor','current_actual_pct','current_planned_pct','schedule_variance_pp','status','blocker','foundation_concrete_placed_m3','tower_steel_erected_t']},stringing:{label:'Stringing',rows:()=>APP.entities.filter(e=>e.entity_type==='Stringing Section'),cols:['entity_id','line_id','from_tower','to_tower','length_km','conductor_strung_km','opgw_strung_km','tower_readiness_pct','current_actual_pct','schedule_variance_pp','status','blocker']},substations:{label:'Substations',rows:()=>APP.entities.filter(e=>e.entity_type==='Substation'),cols:['entity_id','name','voltage_kv','package_id','contractor','current_actual_pct','schedule_variance_pp','equipment_foundations_complete_pct','primary_equipment_installed_pct','cabling_protection_pct','testing_commissioning_pct']},packages:{label:'Work Packages',rows:()=>APP.workPackages,cols:['package_id','package_name','contractor','package_type','contract_value_m_bdt','planned_progress_pct','actual_progress_pct','variance_pp','forecast_slip_days','status','ipc_certified_m_bdt','paid_m_bdt']},materials:{label:'Materials',rows:()=>APP.materials,cols:['material_id','material','unit','ordered_qty','delivered_qty','issued_qty','installed_qty','delivery_readiness_pct','installation_pct','status','depot','package']},milestones:{label:'Milestones',rows:()=>APP.milestones,cols:['milestone_id','milestone','baseline_date','forecast_date','variance_days','status']},issues:{label:'Issues / RFIs',rows:()=>APP.issues,cols:['issue_id','entity_id','category','severity','status','opened_date','target_close', function renderDrawer(){const d=tableDefs[activeTableTab],rows=d.rows();$('drawerTabs').innerHTML=Object.entries(tableDefs).map(([id,x])=>`<button class="${id===activeTableTab?'active':''}" data-tab="${id}">${esc(x.label)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTableTab=b.dataset.tab;renderDrawer()});$('dataHead').innerHTML='<tr>'+d.cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';$('dataBody').innerHTML=rows.slice(0,700).map(r=>'<tr>'+d.cols.map(c=>`<td>${esc(fmt(r[c]))}</td>`).join('')+'</tr>').join('');$('drawerCount').textContent=`${rows.length} records`}
function toggleDrawer(force){drawerOpen=force===undefined?!drawerOpen:force;$('dataDrawer').classList.toggle('open',drawerOpen);renderDrawer()}
function selectionRows(){const es=selected.size?[...selected].map(id=>byId[id]).filter(Boolean):visibleEntities();return es.map(e=>dynamicRegister().find(r=>r.entity_id===e.entity_id)||e)}
function csvText(rows){if(!rows.length)return'';const keys=Object.keys(rows[0]);const q=v=>{const s=String(v??'');return/[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};return[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function downloadBlob(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
function exportRowsCsv(rows,name){downloadBlob(name,csvText(rows),'text/csv;charset=utf-8')}
function exportRegister(){exportRowsCsv(selectionRows(),'P08_construction_progress_register.csv')}
function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1700)}

function renderLegend(){const sets={status:[['#2e9d68','Complete'],['#3f7fba','On Track'],['#e1ad43','At Risk'],['#d9534f','Delayed'],['#8b5cf6','Hold'],['#a5adb7','Not Started']],progress:[['#2e9d68','≥90%'],['#5f92c8','70–89%'],['#e1ad43','45–69%'],['#e4773a','20–44%'],['#d9534f','<20%']],variance:[['#2e9d68','≥0 pp'],['#6bad7d','0 to −5'],['#e1ad43','−5 to −12'],['#e4773a','−12 to −20'],['#d9534f','<−20']],type:[['#147d64','Tower'],['#7a6ca8','Stringing Section'],['#315fd5','Substation'],['#9a6b32','Access Road']],priority:[['#7b2f4d','Critical'],['#d9534f','High'],['#e1ad43','Moderate'],['#6bad7d','Low']],qa:[['#d9534f','NCR / Hold / Reinspection'],['#e1ad43','Pending'],['#2e9d68','Accepted']],material:[['#2e9d68','≥90% ready'],['#6bad7d','75–89%'],['#e1ad43','60–74%'],['#e4773a','40–59%'],['#d9534f','<40%']],lookahead:[['#2e9d68','≥90% ready'],['#6bad7d','75–89%'],['#e1ad43','60–74%'],['#e4773a','40–59%'],['#d9534f','<40%']]};const labels={status:'Construction Status',progress:'Progress %',variance:'Schedule Variance',type:'Work Type',contractor:'Contractor',priority:'Action Priority',qa:'QA / QC',material:'Material Readiness',lookahead:'Lookahead Readiness'};let rows=sets[activeTheme]||[];if(activeTheme==='contractor'){const names=[...new Set(APP.entities.map(x=>x.contractor))],colors=['#147d64','#315fd5','#8b5cf6','#d28a32','#168c91','#d9534f'];rows=names.map((n,i)=>[colors[i%colors.length],n])}$('legend').innerHTML=`<b>${esc(labels[activeTheme])}</b>`+rows.map(x=>`<div class="legend-row"><span class="swatch" style="background:${x[0]}"></span>${esc(x[1])}</div>`).join('')+`<div class="legend-row"><span style="width:14px;height:8px;border:2px solid #0b5441"></span>Selected item</div>`;$('legend').classList.toggle('show',legendOpen)}
function resetAll(){selected.clear();activeEntity=null;Object.assign(filters,{entityType:'All',status:'All',package:'All',contractor:'All',voltage:'All',blocker:'All',minDelay:0,lookahead:false,openConstraints:false});Object.keys(layerState).forEach(k=>layerState[k]=true);layerState.boundary=false;layerState.roads=false;layerState.river=false;layerState.workfronts=false;layerState.towerFootprints=false;activeTheme='status';activeSnapshot=APP.dataDate;$('mapTheme').value=activeTheme;$('globalSearch').value='';$('detailDrawer').classList.remove('open');drawMap();fitMap();renderPanel();renderDrawer()}
function runSelfTest(){const old={...layerState},r={entities:APP.entities.length,towers:APP.summary.towers,stringing:APP.summary.stringing_sections,substations:APP.summary.substations,packages:APP.summary.work_packages};Object.keys(layerState).forEach(k=>layerState[k]=false);drawMap();r.all_off=Object.keys(mapLayers).length===0;Object.assign(layerState,old);drawMap();const e=APP.entities.find(x=>x.entity_type==='Tower');selectEntity(e,true);r.detail_open=$('detailDrawer').classList.contains('open');$('detailDrawer').classList.remove('open');selected.clear();drawMap();document.body.dataset.p08Selftest=JSON.stringify(r);return r}

function init(){$('appPid').textContent='P08';$('appTitle').textContent=APP.title;$('appSubtitle').textContent=APP.subtitle;$('globalSearch').placeholder='Search tower, section, package, contractor, issue…';$('mapTheme').innerHTML=[['status','Construction Status'],['progress','Progress %'],['variance','Schedule Variance'],['type','Work Type'],['contractor','Contractor'],['priority','Action Priority'],['qa','QA / QC'],['material','Material Readiness'],['lookahead','Lookahead Readiness']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('mapTheme').value=activeTheme;document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setNav(b.dataset.nav));$('mapTheme').onchange=e=>{activeTheme=e.target.value;drawMap();if(activeNav==='overview'||activeNav==='results')renderPanel()};$('basemap').onchange=e=>{if(activeBm)map.removeLayer(activeBm);activeBm=bm[e.target.value]||bm.local;activeBm.addTo(map);activeBm.bringToBack?.()};$('globalSearch').oninput=()=>{drawMap();renderDrawer();if(activeNav==='results'||activeNav==='analysis')renderPanel()};$('detailClose').onclick=()=>$('detailDrawer').classList.remove('open');$('drawerHandle').onclick=()=>toggleDrawer();$('expandData').onclick=e=>{e.stopPropagation();drawerFull=!drawerFull;$('dataDrawer').classList.toggle('full',drawerFull)};$('csvMini').onclick=e=>{e.stopPropagation();const d=tableDefs[activeTableTab];exportRowsCsv(d.rows(),`P08_${activeTableTab}.csv`)};$('legendBtn').onclick=()=>{legendOpen=!legendOpen;renderLegend()};$('fitBtn').onclick=fitMap;$('printBtn').onclick=()=>window.print();$('resetBtn').onclick=resetAll;initMap();renderPanel();renderDrawer();renderLegend();window.P08_APP={APP,filters,layerState,selected,visibleEntities,runSelfTest,drawMap,setNav};if(new URLSearchParams(location.search).get('selftest')==='1')setTimeout(runSelfTest,100)}
init();
