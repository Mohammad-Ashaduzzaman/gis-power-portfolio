tails":{"overview":{"purpose":"Create a repeatable ROW monitoring system that converts corridor geometry, imagery/change observations and field verification into transparent encroachment cases and patrol priorities.","question":"Where are new or expanding activities occurring within/near transmission ROW, and which corridor segments should be verified first?","study":"Synthetic ROW monitoring based on the P01 network. Candidate changes are not automatically treated as legal/electrical violations.","crs":"Use EPSG:9680 for metre-based ROW buffers, centerline distance and segment analysis; web display can remain WGS 84.","software":["ArcGIS Pro — preferred","ArcMap 10.x — Buffer/Near/Spatial Join equivalents","Imagery/change-detection workflow","Field Maps / Survey123 or QField — verification"],"assumptions":["Modeled total ROW widths: 132 kV=28 m, 230 kV=40 m, 400 kV=46 m for this demonstration.","Imagery detections begin as candidate changes, not violations.","Vegetation vertical-gap values are simulated screening proxies, not statutory clearances."]},"data":[{"name":"Transmission Lines","type":"Polyline","role":"ROW centerline and voltage source.","fields":"line_id, voltage_kv, network attributes"},{"name":"ROW Corridors","type":"Polygon","role":"Voltage-specific modeled ROW footprint.","fields":"line_id, row_width_m, half_row_m"},{"name":"Monitoring Segments","type":"Line/Polygon","role":"Approximately 2 km patrol/monitoring units.","fields":"segment_id, sensitivity, land-use context, patrol frequency, segment_risk_index"},{"name":"Encroachment / Change Candidates","type":"Point/Polygon","role":"Detected new/expanded/existing/removed activities.","fields":"encroachment_id, line_id, segment_id, change_status, inside_row, distance_to_centerline_m, distance_from_row_edge_m, risk_score, risk_class, case_status"},{"name":"Monitoring Observations","type":"Table","role":"Baseline/current/time-series observations.","fields":"monitoring_date, estimated_footprint_sqm, source/quality metadata"},{"name":"Cases / Actions / Notices","type":"Related Tables","role":"Case lifecycle, evidence and anonymous stakeholder/notice register.","fields":"case_id, status, target_resolution_date, action_id, evidence_ref, stakeholder_ref"},{"name":"Vegetation Screening","type":"Point","role":"Demonstration 3D/clearance screening.","fields":"estimated vegetation height, simulated_vertical_gap_m, clearance_risk_class"},{"name":"Baseline / Current Imagery","type":"Raster/Imagery","role":"Detect object/land-cover change inside and around ROW.","fields":"capture date, sensor/source, resolution, cloud/quality"}],"desktop":[{"step":1,"title":"Project line centerlines","tool":"Project","action":"Project transmission lines to EPSG:9680 before buffers or distances.","output":"Metric centerlines."},{"step":2,"title":"Calculate ROW width","tool":"Add Field + Calculate Field","action":"ROW_Width_m: 132=28; 230=40; 400=46. Half_ROW_m=ROW_Width_m/2.","output":"Voltage-specific buffer distance."},{"step":3,"title":"Create ROW polygons","tool":"Buffer","action":"Buffer projected lines by Half_ROW_m, full side, flat ends for the demo, planar method.","output":"ROW_Corridors."},{"step":4,"title":"Create monitoring segments","tool":"Generate Points Along Lines / Split Line At Point","action":"Split each line into approximately 2 km units and assign segment IDs.","output":"Patrol segments."},{"step":5,"title":"Prepare baseline/current imagery","tool":"Imagery layers / Mosaic Dataset","action":"Co-register dates, document resolution/cloud limits and clip to corridor analysis area.","output":"Comparable imagery."},{"step":6,"title":"Detect candidate change","tool":"Change detection / classification / interpretation","action":"Identify new/expanded structures, excavation, roads, crossings, vegetation and relevant activity; store as candidates first.","output":"Change-candidate layer."},{"step":7,"title":"Calculate centerline distance","tool":"Near / Generate Near Table","action function recomputeDerived(){
  if(APP.type==='route_optimization'){
    const total=Object.values(routeWeights).reduce((a,b)=>a+Math.max(0,Number(b)||0),0)||1;
    APP.data.routes.forEach(r=>{
      let score=0;
      for(const [metric,w0] of Object.entries(routeWeights)){
        const w=Math.max(0,Number(w0)||0)/total;
        const normField='norm_'+metric;
        let penalty=n(r[normField]);
        if(penalty===null){
          if(metric==='river_crossings')penalty=n(r.norm_river_crossings);
          else if(metric==='rail_crossings')penalty=n(r.norm_rail_crossings);
          else if(metric==='existing_power_crossings')penalty=n(r.norm_existing_power_crossings);
          else penalty=0;
        }
        score+=penalty*w;
      }
      r.__score=score;
    });
    [...APP.data.routes].sort((a,b)=>a.__score-b.__score).forEach((r,i)=>r.__rank=i+1);
  }
  if(APP.type==='site_selection'){
    const totalSuit=Object.values(siteSuitWeights).reduce((a,b)=>a+Math.max(0,Number(b)||0),0)||1;
    APP.data.sites.forEach(s=>{
      let suit=0;
      for(const [criterion,w0] of Object.entries(siteSuitWeights)){
        const field=siteCriterionField[criterion];if(!field)continue;
        suit+=(n(s[field])||0)*(Math.max(0,Number(w0)||0)/totalSuit);
      }
      s.__suit=suit;
    });
    const suits=APP.data.sites.map(s=>s.__suit),minS=Math.min(...suits),maxS=Math.max(...suits);
    const totalRank=Object.values(siteRankWeights).reduce((a,b)=>a+Math.max(0,Number(b)||0),0)||1;
    APP.data.sites.forEach(s=>{
      let score=0;
      for(const [metric,w0] of Object.entries(siteRankWeights)){
        const w=Math.max(0,Number(w0)||0)/totalRank;
        let penalty;
        if(metric==='mean_suitability')penalty=maxS===minS?0:(maxS-s.__suit)/(maxS-minS)*100;
        else penalty=n(s['norm_'+metric])||0;
        score+=penalty*w;
      }
      s.__score=score;
    });
    [...APP.data.sites].sort((a,b)=>a.__score-b.__score).forEach((s,i)=>s.__rank=i+1);
  }
}

function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}function downloadBlob(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
function renderLegend(){const box=$('legend');let rows='';if(APP.type==='site_selection'&&activeTheme!=='candidates'&&activeTheme!=='hard')rows=[['#2f855a','Very good'],['#76a96b','Good'],['#d4b857','Moderate'],['#d98a48','Low'],['#c65a56','Very low']].map(x=>`<div class="legend-row"><span class="swatch" style="background:${x[0]}"></span>${x[1]}</div>`).join('');else rows=`<div class="legend-row"><span class="swatch" style="background:#147d64"></span>Primary / selected</div><div class="legend-row"><span class="swatch" style="background:#e6a23c"></span>Moderate / warning</div><div class="legend-row"><span class="swatch" style="background:#d9534f"></span>High / critical</div>`;box.innerHTML=`<b>${esc(APP.themes.find(x=>x.id===activeTheme)?.label||'Legend')}</b>${rows}`;box.classList.toggle('show',legendOpen)}
function init(){
  recomputeDerived();$('mapTheme').innerHTML=APP.themes.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('');$('mapTheme').value=activeTheme;$('appPid').textContent=APP.id;$('appTitle').textContent=APP.title;$('appSubtitle').textContent=APP.subtitle;
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setNav(b.dataset.nav)));$('mapTheme').addEventListener('change',e=>{activeTheme=e.target.value;drawMap();renderPanel()});$('basemap').addEventListener('change',e=>{map.removeLayer(activeBm);activeBm=bm[e.target.value]||bm.local;activeBm.addTo(map);drawMap()});$('globalSearch').addEventListener('input',()=>{drawMap();renderDrawer();if(activeNav==='results')renderPanel()});
  $('detailClose').addEventListener('click',()=>$('detailDrawer').classList.remove('open'));$('drawerHandle').addEventListener('click',()=>toggleDrawer());$('legendBtn').addEventListener('click',()=>{legendOpen=!legendOpen;renderLegend()});$('fitBtn').addEventListener('click',fitAll);$('printBtn').addEventListener('click',()=>window.print());$('csvMini').addEventListener('click',exportCsv);$('expandData').addEventListener('click',()=>$('dataDrawer').classList.toggle('full'));
  $('resetBtn').addEventListener('click',()=>{selected.clear();activeEntity=null;filterState.condition=filterState.risk=filterState.priority=filterState.change='All';filterState.healthMax=100;$('detailDrawer').classList.remove('open');activeTheme=APP.themes[0]?.id||'';$('mapTheme').value=activeTheme;drawMap();renderPanel();renderDrawer();fitAll()});
  drawMap();renderPanel();renderDrawer();setTimeout(fitAll,250);
}
init();
