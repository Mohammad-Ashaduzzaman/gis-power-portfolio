o — preferred desktop implementation","ArcGIS Pro Parcel Fabric — when maintaining authoritative cadastral lineage","ArcMap 10.x — legacy feature-class/topology workflow","QGIS / GeoPackage — open-source desktop alternative","Single embedded HTML — portable portfolio Web GIS"],"assumptions":["The approved P05 master shell is retained; only P06 project content and GIS logic are changed.","40 m 230 kV ROW context and a separate 9.2 m direct construction/stringing corridor are kept as demonstration/project-example inputs, not universal rules.","230 kV tower reference footprints in this sample use 17×17 m suspension and 19×19 m angle footprints; approved engineering geometry must replace these in real work.","Public/portfolio views expose anonymous owner-group references only; names, IDs, contacts and bank details belong in restricted systems.","Planning monetary exposure is a portfolio budgeting field, not a statutory compensation award."]},"data":[{"name":"Ownership Parcels","type":"Polygon","role":"Cadastral-style working parcels used for project impact accounting.","fields":"parcel_id, mouza_name, jl_no, dag_no, khatian_ref, land_use, tenure_type, recorded_area_sqm"},{"name":"Mouza / J.L. Boundaries","type":"Polygon","role":"Administrative/cadastral map context.","fields":"mouza_code, mouza_name, jl_no"},{"name":"Transmission Line","type":"Polyline","role":"230 kV project centerline.","fields":"line_id, voltage_kv"},{"name":"40 m ROW Context","type":"Polygon","role":"ROW/corridor context kept distinct from direct construction impact.","fields":"project-example corridor geometry"},{"name":"9.2 m Direct Impact Corridor","type":"Polygon","role":"Direct temporary stringing/construction parcel-impact screening.","fields":"project-example direct-impact geometry"},{"name":"Tower Locations","type":"Point","role":"Tower schedule, type and parcel lookup.","fields":"tower_id, tower_type, base_width_m"},{"name":"Tower Footprints","type":"Polygon","role":"Tower-footing parcel in egister","action":"Register Mouza maps, Dag/Khatian records, LA plans, survey control and project design data with date, source, version and legal status.","output":"Source register."},{"step":4,"title":"Georeference scanned Mouza sheets where required","tool":"ArcGIS Pro Georeference","action":"Use well-distributed controls; document residual/error and retain the source image.","output":"Georeferenced cadastral sheet."},{"step":5,"title":"Load or digitize parcel geometry","tool":"Parcel Fabric load / Create Features","action":"Create controlled ownership parcels and retain Dag/source-record references. Do not infer legal ownership from imagery.","output":"Ownership parcel polygons."},{"step":6,"title":"Validate parcel geometry","tool":"Parcel Fabric topology / Geodatabase Topology","action":"Check overlaps, gaps, slivers, invalid geometry and shared boundaries according to source/cadastral rules.","output":"Topology-clean parcel layer."},{"step":7,"title":"Link land records / interests","tool":"Relationship Classes / Joins","action":"Link parcel IDs to Khatian/source records and restricted owner/interest information; expose only anonymous references in the portfolio Web GIS.","output":"Parcel-record relationship model."},{"step":8,"title":"Project analysis layers","tool":"Project","action":"Project parcels and project components to EPSG:9680 before buffering, area calculation and intersection.","output":"Metric working layers."},{"step":9,"title":"Create project component layers","tool":"Feature editing / CAD-to-GIS / Buffer","action":"Maintain line, ROW, direct-impact corridor, tower footprints, substation acquisition and temporary access as separate layers.","output":"Project-impact feature classes."},{"step":10,"title":"Create ROW context","tool":"Buffer","action":"For this synthetic example, create a 40 m total 230 kV ROW context (20 m each side). Replace with approved project inputs in real work.","output":"ROW context polygon."},{"step":11,"title":"Create direct construction/stringing corridor","tool":"Buffer / approved impact geometry","action":"Use the separate direct-impact/clearance width for temporary transmission construction impact; do not treat the full ROW as identical impact.","output":"Direct-impact polygon."},{"step":12,"title":"Create tower-footing polygons","tool":"Engineering footprint / feature construction","action":"Use approved tower/foundation land geometry. Synthetic sample uses 17×17 m suspension and 19×19 m angle reference footprints.","output":"Tower-footing polygons."},{"step":13,"title":"Load substation acquisition boundary","tool":"Feature Class / CAD import","action":"Maintain the permanent acquisition polygon separately from line ROW and tower-footing impacts.","output":"Substation acquisition polygon."},{"step":14,"title":"Create temporary access zones","tool":"Buffer / digitize","action":"Create temporary access/occupation polygons from construction logistics; keep temporary treatment separate.","output":"Temporary access polygons."},{"step":15,"title":"Intersect each impact layer with parcels","tool":"Pairwise Intersect / Intersect","action":"Intersect parcels separately with ROW context, direct corridor, tower footings, substation acquisition and temporary access.","output":"Component-specific parcel-impact fragments."},{"step":16,"title":"Summarize affected area by parcel","tool":"Summary Statistics / Spatial Join","action":"Calculate each component area and a non-double-counted total direct impact area.","output":"Parcel impact summary."},{"step":17,"title":"Calculate impact percentage","tool":"Calculate Field","action":"Impact % = total direct affected area ÷ recorded parcel area × 100.","output":"Parcel impact percentage."},{"step":18,"title":"Classify land-management treatment","tool":"Rule-based Calculate Field","action":"Classify permanent acquisition, tower-footing compensation workflow, temporary impact/crop-asset workflow, mixed impact or no direct action.","output":"Treatment const layerState={basemap:true,mouza:true,roads:true,canal:true,settlements:true,parcels:true,row:true,direct:true,towers:true,foot:true,substation:true,access:true,line:true};
const layerLabels={basemap:'Basemap',mouza:'Mouza / J.L. boundaries',roads:'Road context',canal:'Canal / drainage context',settlements:'Settlement context',parcels:'Ownership parcels',row:'40 m ROW context',direct:'9.2 m direct impact corridor',towers:'Tower locations',foot:'Tower-footing footprints',substation:'Substation acquisition area',access:'Temporary access zone',line:'230 kV transmission line'};
const layerCounts={basemap:1,mouza:APP.geo.mouza.features.length,roads:APP.geo.roads.features.length,canal:APP.geo.canal.features.length,settlements:APP.geo.settlements.features.length,parcels:APP.geo.parcels.features.length,row:APP.geo.row.features.length,direct:APP.geo.direct.features.length,towers:APP.geo.towers.features.length,foot:APP.geo.foot.features.length,substation:APP.geo.substation.features.length,access:APP.geo.access.features.length,line:APP.geo.line.features.length};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const x=Number(v);return Number.isFinite(x)?x:0}
function fmt(v,s=''){if(v===null||v===undefined||v==='')return '—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2})+s:String(v)}
function money(v){const n=num(v);return n>=1000000?(n/1000000).toFixed(1)+'M BDT':n.toLocaleString()+' BDT'}
function humanTitle(p){return `${p.mouza_name||p.mouza_code||'Mouza'} · Dag ${p.dag_no||'—'}`}
function entityById(id){return byId[String(id)]}
function unique(field){return [...new Set(APP.parcels.map(p=>String(p[field]??'')).filter(Boolean))].sort()}
function visibleEntities(){
  const q=($('globalSearch')?.value||'').trim().toLowerCase();
  return APP.parcels.filter(p=>{
    if(filters.affected==='Affected only'&&p.directly_affected!=='Yes')return false;
    if(filters.impact!=='All'&&p.impact_category!==filters.impact)return false;
    if(filters.priority!=='All'&&p.priority_class!==filters.priority)return false;
    if(filters.title!=='All'&&p.title_verification_status!==filters.title)return false;
    if(filters.workflow!=='All'&&p.lifecycle_status!==filters.workflow)return false;
    if(filters.compensation!=='All'&&p.compensation_status!==filters.compensation)return false;
    if(num(p.impact_percent)<filters.minImpact)return false;
    if(q&&!Object.values(p).join(' ').toLowerCase().includes(q))return false;
    return true;
  });
}
function filteredSet(){return new Set(visibleEntities().map(p=>String(p.parcel_id)))}
function themeColor(p){
  if(activeTheme==='impact'){
    const s=String(p.impact_category||'');
    if(s.includes('Substation'))return'#315fd5';
    if(s.includes('Tower'))return'#8151b6';
    if(s.includes('ROW'))return'#d28a32';
    if(s.includes('Access'))return'#168c91';
    return'#c8d0cc';
  }
  if(activeTheme==='priority')return ({Critical:'#c8454b',High:'#e4773a',Moderate:'#e1ad43',Low:'#6bad7d'})[p.priority_class]||'#c8d0cc';
  if(activeTheme==='workflow'){
    const s=p.lifecycle_status;
    if(['Paid','Closed'].includes(s))return'#2e9d68';
    if(['Approved','Valuation Complete'].includes(s))return'#3566cb';
    if(['Notice Prepared','Notice Served','Impact Confirmed'].includes(s))return'#8b5cf6';
    if(['Surveyed','Record Verification'].includes(s))return'#e6a23c';
    return s==='No Action'?'#c8d0cc':'#7b8790';
  }
  if(activeTheme==='title')return ({Verified:'#50a278',Pending:'#e1a13b',Discrepancy:'#ca494f'})[p.title_verification_status]||'#c8d0cc';
  if(activeTheme==='compensation')return ({Paid:'#2e9d68',Approved:'#3566cb','Valuation Complete':'#8b5cf6',Pending:'#e6a23c','Not Required':'#c8d0cc'})[p.compensation_status]||'#c8d0cc';
  if(activeTheme==='landuse')return ({Agriculture:'#a5bb69',Homestead:'#d79b75',Orchard:'#639c6e',Fallow:'#c3ba91',Pond:'#6aaac5',Commercial:'#8c78a7'})[p.land_use]||'#c8d0cc';
  if(activeTheme==='tenure')return ({Private:'#4f83c2','Government/Khas':'#808b92',Institutional:'#8d61a9'})[p.tenure_type]||'#c8d0cc';
  if(activeTheme==='outstanding'){const n=num(p.outstanding_bdt);return n>=5000000?'#a83e44':n>=1000000?'#d45d4a':n>=200000?'#e49a45':n>0?'#e5c65c':'#7eb58a'}
  return'#147d64';
}

const map=L.map('map',{zoomControl:true,preferCanvas:true,minZoom:3,maxZoom:20});
const bm=PortfolioMaps.create();
activeBm=bm.local;activeBm.addTo(map);
const mapLayers={};

function clearProjectLayers(){Object.values(mapLayers).forEach(l=>{try{map.removeLayer(l)}catch(e){}});for(const k of Object.keys(mapLayers))delete mapLayers[k]}
function parcelStyle(f){
  const p=entityById(f.properties.parcel_id),sel=selected.has(String(p.parcel_id));
  return {color:sel?'#0b5441':p.directly_affected==='Yes'?'#596860':'#99a59f',weight:sel?3.4:.8,fillColor:themeColor(p),fillOpacity:sel?.72:p.directly_affected==='Yes'?.46:.18};
}
function bindParcelFeature(f,l){
  const p=entityById(f.properties.parcel_id);if(!p)return;
  l.bindTooltip(`<b>${esc(humanTitle(p))}</b><br>${esc(p.impact_category)}<br>Impact ${fmt(p.impact_percent,'%')} · ${esc(p.priority_class)} priority<br>Title: ${esc(p.title_verification_status)} · Case: ${esc(p.lifecycle_status)}`,{sticky:true,direction:'top'});
  l.on('mouseover',()=>l.setStyle({weight:selected.has(p.parcel_id)?3.4:2,color:'#147d64'}));
  l.on('mouseout',()=>l.setStyle(parcelStyle(f)));
  l.on('click',()=>selectEntity(p,true));
}
function addGeo(name,fc,opts){if(!layerState[name])return;mapLayers[name]=L.geoJSON(fc,opts).addTo(map)}
function drawMap(){
  clearProjectLayers();
  const visible=filteredSet();
  if(layerState.mouza)addGeo('mouza',APP.geo.mouza,{style:{color:'#7b8790',weight:1.5,fillOpacity:0,dashArray:'7 5'},onEachFeature:(f,l)=>l.bindTooltip(`<b>${esc(f.properties.mouza_name||f.properties.mouza_code||'Mouza')}</b><br>${esc(f.properties.jl_no||'')}`)});
  if(layerState.settlements)addGeo('settlements',APP.geo.settlements,{style:{color:'#b87961',weight:1,fillColor:'#c88f75',fillOpacity:.14}});
  if(layerState.canal)addGeo('canal',APP.geo.canal,{style:{color:'#679db6',weight:1,fillColor:'#78b2cc',fillOpacity:.3}});
  if(layerState.roads)addGeo('roads',APP.geo.roads,{style:{color:'#c6b79d',weight:5,opacity:.8}});
  if(layerState.parcels){
    mapLayers.parcels=L.geoJSON(APP.geo.parcels,{filter:f=>visible.has(String(f.properties.parcel_id)),style:parcelStyle,onEachFeature:bindParcelFeature}).addTo(map);
  }
  if(layerState.row)addGeo('row',APP.geo.row,{style:{color:'#cb8d28',weight:1.2,fillColor:'#e2ad51',fillOpacity:.10,dashArray:'5 4'}});
  if(layerState.direct)addGeo('direct',APP.geo.direct,{style:{color:'#c75d30',weight:1.2,fillColor:'#ed7541',fillOpacity:.32}});
  if(layerState.access)addGeo('access',APP.geo.access,{style:{color:'#11777b',weight:1.1,fillColor:'#169197',fillOpacity:.24,dashArray:'4 3'}});
  if(layerState.substation)addGeo('substation',APP.geo.substation,{style:{color:'#244bad',weight:2.2,fillColor:'#315fd5',fillOpacity:.24},onEachFeature:(f,l)=>l.bindTooltip(`<b>${esc(f.properties.site_name||'Substation acquisition')}</b>`) });
  if(layerState.foot)addGeo('foot',APP.geo.foot,{style:{color:'#633b91',weight:1.2,fillColor:'#8151b6',fillOpacity:.42},onEachFeature:(f,l)=>l.bindTooltip(`<b>${esc(f.properties.tower_id||'Tower footprint')}</b><br>${esc(f.properties.tower_type||'')}`)});
  if(layerState.line)addGeo('line',APP.geo.line,{style:{color:'#244fbd',weight:3.5,opacity:.9},onEachFeature:(f,l)=>l.bindTooltip(`<b>${esc(f.properties.line_id||'230 kV line')}</b>`) });
  if(layerState.towers)addGeo('towers',APP.geo.towers,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4.5,color:'#fff',weight:1.4,fillColor:'#364152',fillOpacity:1}),onEachFeature:(f,l)=>l.bindTooltip(`<b>${esc(f.properties.tower_id||'Tower')}</b><br>${esc(f.properties.tower_type||'')}`)});
  syncBasemap();
  renderLegend();
}
function syncBasemap(){
  const wants=layerState.basemap;
  if(wants&&!map.hasLayer(activeBm))activeBm.addTo(map);
  if(!wants&&map.hasLayer(activeBm))map.removeLayer(activeBm);
  map.getContainer().style.background=wants?'#e9eef2':'#fff';
}
function fitAll(){
  const groups=[];for(const [k,l] of Object.entries(mapLayers)){if(k!=='parcels'||visibleEntities().length)groups.push(l)}
  if(groups.length){const fg=L.featureGroup(groups),b=fg.getBounds();if(b.isValid())map.fitBounds(b.pad(.06))}
  else map.setView([24.30,89.10],12);
}
function focusEntity(p){const f=geoById[p.parcel_id];if(f){const b=L.geoJSON(f).getBounds();if(b.isValid())map.fitBounds(b.pad(.35),{maxZoom:16})}}
function zoomSelected(){const fs=[...selected].map(id=>geoById[id]).filter(Boolean);if(!fs.length)return;const b=L.geoJSON({type:'FeatureCollection',features:fs}).getBounds();if(b.isValid())map.fitBounds(b.pad(.25),{maxZoom:16})}

function kpis(){const a=visibleEntities();return[a.length,a.filter(p=>p.directly_affected==='Yes').length,a.filter(p=>['High','Critical'].includes(p.priority_class)).length,a.filter(p=>['Open','Under Review'].includes(p.grievance_status)).length]}
function recommendation(){const p=[...APP.parcels].filter(x=>x.directly_affected==='Yes').sort((a,b)=>num(b.priority_score)-num(a.priority_score))[0];return `<div class="reco"><div class="eyebrow">Highest current land-management priority</div><h3>${esc(humanTitle(p))}</h3><p>${esc(p.impact_category)} · ${fmt(p.impact_percent,'%')} direct impact · ${esc(p.priority_class)} priority. Next action: ${esc(p.next_action)}.</p><div style="margin-top:9px"><button class="secondary-btn" data-open-id="${esc(p.parcel_id)}">Open parcel</button></div></div>`}
function bars(field){const counts={};visibleEntities().forEach(p=>{const k=String(p[field]||'—');counts[k]=(counts[k]||0)+1});const e=Object.entries(counts).sort((a,b)=>b[1]-a[1]),m=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="bar-row"><header><span>${esc(k)}</span><b>${v}</b></header><div class="track"><div class="fill" style="width:${v/m*100}%"></div></div></div>`).join('')}
function analysisHtml(){const a=visibleEntities(),out=a.reduce((s,p)=>s+num(p.outstanding_bdt),0);return `<div class="control-row"><label>Parcel visibility</label><select id="fAffected"><option>All</option><option>Affected only</option></select></div><div class="control-row"><label>Impact category</label><select id="fImpact"><option>All</option>${unique('impact_category').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="control-row"><label>Action priority</label><select id="fPriority"><option>All</option><option>Critical</option><option>High</option><option>Moderate</option><option>Low</option></select></div><div class="control-row"><label>Title verification</label><select id="fTitle"><option>All</option><option>Verified</option><option>Pending</option><option>Discrepancy</option></select></div><div class="control-row"><label>Case workflow</label><select id="fWorkflow"><option>All</option>${unique('lifecycle_status').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="control-row"><label>Compensation status</label><select id="fComp"><option>All</option>${unique('compensation_status').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="control-row"><label>Minimum direct impact <span id="minImpactVal">${filters.minImpact.toFixed(1)}%</span></label><input id="fMinImpact" type="range" min="0" max="50" step=".5" value="${filters.minImpact}"></div><div class="reco"><div class="eyebrow">Live GIS analysis</div><h3>${a.length} parcels visible</h3><p>${money(out)} synthetic outstanding planning exposure in the current working set. Filters synchronize the map, Results and Parcel Register.</p></div><div class="section-title">Impact distribution</div>${bars('impact_category')}<div class="section-title">Action priority</div>${bars('priority_class')}<div class="section-title">Case workflow</div>${bars('lifecycle_status')}`}
function resultsHtml(){const a=visibleEntities().filter(p=>p.directly_affected==='Yes').sort((x,y)=>num(y.priority_score)-num(x.priority_score));const sel=`<div class="selection-bar ${selected.size?'show':''}"><b>${selected.size} selected</b>${selected.size>=2&&selected.size<=4?'<button class="text-btn" id="compareSelected">Compare</button>':''}<button class="text-btn" id="zoomSelected">Zoom</button><button class="text-btn" id="clearSelected">Clear</button></div>`;return sel+`<div class="entity-list">${a.map((p,i)=>`<div class="entity-row ${selected.has(p.parcel_id)?'selected':''}" data-row-id="${esc(p.parcel_id)}"><input class="row-check" data-check-id="${esc(p.parcel_id)}" type="checkbox" ${selected.has(p.parcel_id)?'checked':''}><span class="rank ${i<3?'top':''}">${i+1}</span><span><b>${esc(humanTitle(p))}</b><small>${esc(p.impact_category)} · ${fmt(p.impact_percent,'%')} · ${esc(p.priority_class)} · ${esc(p.lifecycle_status)}</small></span><button class="info-btn" data-info-id="${esc(p.parcel_id)}">${INFO_ICON}</button></div>`).join('')}</div>`}
function processHtml(){return APP.process.map((x,i)=>`<div class="process-step ${i===0?'active':''}"><button type="button"><span class="step-num">${esc(x.step_no??i+1)}</span><span><b>${esc(x.stage||'Step')}</b><small>${esc(x.gis_method||'GIS workflow')}</small></span></button><div class="process-detail">${esc(x.why||x.output||'')}</div></div>`).join('')}
function projectDetailsHtml(){const d=APP.projectDetails,tabs=[['overview','Overview'],['data','Data'],['desktop','Desktop Build'],['analysis','Analysis / Model'],['outputs','Outputs'],['qa','QA / Limits']];let h=`<div class="project-tabs">${tabs.map(([id,label])=>`<button class="${activeProjectDetailTab===id?'active':''}" data-project-tab="${id}">${label}</button>`).join('')}</div>`;if(activeProjectDetailTab==='overview')h+=`<div class="project-meta"><div class="meta-row"><b>Purpose</b><span>${esc(d.overview.purpose)}</span></div><div class="meta-row"><b>Core GIS question</b><span>${esc(d.overview.question)}</span></div><div class="meta-row"><b>Study / data status</b><span>${esc(d.overview.study)}</span></div><div class="meta-row"><b>Coordinate system</b><span>${esc(d.overview.crs)}</span></div></div><div class="section-title">Desktop / platform path</div><div class="platform-chips">${d.overview.software.map(x=>`<span class="platform-chip">${esc(x)}</span>`).join('')}</div><div class="section-title">Important assumptions</div><ul class="check-list">${d.overview.assumptions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if(activeProjectDetailTab==='data')h+=`<div class="project-note">Each real input should also carry source authority, date, scale/resolution, CRS, confidentiality class, version and update frequency.</div>`+d.data.map(x=>`<div class="data-card"><header><b>${esc(x.name)}</b><span class="data-type">${esc(x.type)}</span></header><p>${esc(x.role)}</p><div class="field-line"><b>Key fields:</b> ${esc(x.fields)}</div></div>`).join('');if(activeProjectDetailTab==='desktop')h+=`<div class="project-note"><b>ArcGIS Pro is the preferred path.</b> ArcMap/QGIS equivalents can reproduce the core overlay, topology, related-table and field-calculation workflow.</div>`+d.desktop.map(x=>`<div class="desktop-step"><span class="no">${x.step}</span><div><h4>${esc(x.title)}</h4><div class="tool">${esc(x.tool)}</div><p>${esc(x.action)}</p><div class="output"><b>Output:</b> ${esc(x.output)}</div></div></div>`).join('');if(activeProjectDetailTab==='analysis')h+=d.analysis.map(x=>`<div class="analysis-card"><b>${esc(x.title)}</b><p>${esc(x.detail)}</p></div>`).join('');if(activeProjectDetailTab==='outputs')h+=`<div class="section-title">Expected deliverables</div><div class="output-list">${d.outputs.map(x=>`<span class="output-pill">${esc(x)}</span>`).join('')}</div>`;if(activeProjectDetailTab==='qa')h+=`<div class="section-title">Quality assurance and limitations</div><ul class="check-list">${d.qa.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="project-note">GIS supports project land management; engineering, cadastral, title, statutory valuation/award and competent-authority decisions remain outside this portfolio demonstration.</div>`;return h}
function fieldHtml(){const p=selected.size===1?entityById([...selected][0]):activeEntity;return `<div class="project-note">This form is a browser draft. A production implementation would save through Field Maps, Survey123, QField or an access-controlled enterprise workflow.</div>${p?`<div class="analysis-card"><b>Selected parcel</b><p>${esc(humanTitle(p))} · ${esc(p.parcel_id)}</p></div>`:''}<form id="fieldForm">${[['Parcel ID',p?.parcel_id||''],['Verification date','2026-08-24'],['Mouza / Dag check',p?`${p.mouza_name} / ${p.dag_no}`:''],['Boundary marker status',''],['Current land use',p?.land_use||''],['Occupancy / interest observation',''],['Structures / crops / trees',''],['GPS accuracy / evidence',''],['Recommended land action',p?.next_action||'']].map(([l,v],i)=>`<div class="control-row"><label>${esc(l)}</label><input type="text" name="f${i}" value="${esc(v)}" placeholder="${esc(l)}"></div>`).join('')}<div class="control-row"><label>Notes</label><textarea style="width:100%;min-height:86px;border:1px solid var(--border);border-radius:8px;padding:8px" name="notes"></textarea></div><div style="display:flex;gap:7px"><button class="primary-btn" type="submit">Save draft</button><button class="secondary-btn" type="button" id="fieldExport">Export JSON</button></div></form>`}
function exportHtml(){return `<div class="reco"><div class="eyebrow">Current working set</div><h3>${selected.size?selected.size+' selected parcels':visibleEntities().length+' filtered parcels'}</h3><p>Export the same records currently selected or filtered in the P06 Web GIS.</p></div><div style="display:grid;gap:8px;margin-top:10px"><button class="secondary-btn" id="exportCsv">Export Parcel CSV</button><button class="secondary-btn" id="exportJson">Export Parcel JSON</button><button class="secondary-btn" id="exportCases">Export Land Cases CSV</button><button class="secondary-btn" id="printMap2">Print / Save PDF</button></div>`}

function renderPanel(){const head=$('panelHead'),body=$('panelBody'),kv=kpis();const title=activeNav==='projectDetails'?'Project Details':activeNav[0].toUpperCase()+activeNav.slice(1);const desc={overview:'Project summary and current land-management priority.',layers:'Control map visibility and analytical context.',analysis:'Live parcel-impact filters, summaries and workflow indicators.',results:'Browse, select and compare affected parcels.',process:'Audit the GIS workflow step by step.',data:'Open the synchronized parcel and case data drawer.',field:'Field verification and validation workflow.',export:'Export current selections and print the map.',projectDetails:'Desktop GIS build details: inputs, workflow, model, outputs and QA.'}[activeNav]||'';head.innerHTML=`<h2>${title}</h2><p>${desc}</p>`;if(activeNav==='overview')body.innerHTML=`<div class="metric-grid"><div class="metric-card"><b>${kv[0]}</b><span>Parcels visible</span></div><div class="metric-card"><b>${kv[1]}</b><span>Directly affected</span></div><div class="metric-card"><b>${kv[2]}</b><span>High / Critical</span></div><div class="metric-card"><b>${kv[3]}</b><span>Open / review grievances</span></div></div>${recommendation()}<div class="section-title">Quick actions</div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="primary-btn" id="openResults">Browse affected parcels</button><button class="secondary-btn" id="openData">Open data</button></div><div class="section-title">Operational sample</div><div class="analysis-card"><b>${APP.summary.row_context} parcels intersect the 40 m ROW context</b><p>${APP.summary.direct_row} parcels intersect the separate 9.2 m direct construction/stringing corridor; ${APP.summary.tower_footing} tower-footing impacts; ${APP.summary.substation} substation acquisition impacts.</p></div>`;if(activeNav==='layers')body.innerHTML=`<div style="display:flex;gap:7px;margin-bottom:9px"><button class="secondary-btn" id="layersAllOn" style="flex:1">All On</button><button class="secondary-btn" id="layersAllOff" style="flex:1">All Off</button></div>`+Object.keys(layerState).map(k=>`<div class="layer-group"><div class="layer-row"><input id="layer_${k}" type="checkbox" ${layerState[k]?'checked':''}><label for="layer_${k}">${esc(layerLabels[k])}</label><span class="pill">${layerCounts[k]} ${k==='basemap'?'source':'features'}</span></div></div>`).join('');if(activeNav==='analysis')body.innerHTML=analysisHtml();if(activeNav==='results')body.innerHTML=resultsHtml();if(activeNav==='process')body.innerHTML=processHtml();if(activeNav==='data')body.innerHTML=`<div class="reco"><div class="eyebrow">Synchronized data</div><h3>${APP.parcels.length} parcel records</h3><p>Use the bottom drawer for Parcels, Land Cases, Documents, Payments, Grievances, Field Verification and Process records.</p></div><div style="margin-top:10px"><button class="primary-btn" id="drawerOpenBtn">Open data drawer</button></div>`;if(activeNav==='field')body.innerHTML=fieldHtml();if(activeNav==='export')body.innerHTML=exportHtml();if(activeNav==='projectDetails')body.innerHTML=projectDetailsHtml();bindPanel()}
function bindPanel(){document.querySelectorAll('[data-project-tab]').forEach(b=>b.onclick=()=>{activeProjectDetailTab=b.dataset.projectTab;renderPanel()});$('openResults')?.addEventListener('click',()=>setNav('results'));$('openData')?.addEventListener('click',()=>toggleDrawer(true));$('drawerOpenBtn')?.addEventListener('click',()=>toggleDrawer(true));Object.keys(layerState).forEach(k=>$(`layer_${k}`)?.addEventListener('change',e=>{layerState[k]=e.target.checked;drawMap();renderPanel()}));$('layersAllOn')?.addEventListener('click',()=>{Object.keys(layerState).forEach(k=>layerState[k]=true);drawMap();renderPanel()});$('layersAllOff')?.addEventListener('click',()=>{Object.keys(layerState).forEach(k=>layerState[k]=false);drawMap();renderPanel()});document.querySelectorAll('[data-open-id]').forEach(b=>b.onclick=()=>{const p=entityById(b.dataset.openId);if(p)selectEntity(p,true)});document.querySelectorAll('.entity-row').forEach(r=>r.onclick=e=>{if(e.target.closest('input')||e.target.closest('button'))return;const p=entityById(r.dataset.rowId);if(p)selectEntity(p,true)});document.querySelectorAll('.row-check').forEach(c=>c.onchange=e=>{e.stopPropagation();c.checked?selected.add(c.dataset.checkId):selected.delete(c.dataset.checkId);drawMap();renderPanel()});document.querySelectorAll('[data-info-id]').forEach(b=>b.onclick=e=>{e.stopPropagation();const p=entityById(b.dataset.infoId);if(p)selectEntity(p,true)});$('zoomSelected')?.addEventListener('click',zoomSelected);$('clearSelected')?.addEventListener('click',()=>{selected.clear();drawMap();renderPanel()});$('compareSelected')?.addEventListener('click',compareSelected);document.querySelectorAll('.process-step button').forEach(b=>b.onclick=()=>{const p=b.closest('.process-step'),was=p.classList.contains('active');document.querySelectorAll('.process-step').forEach(x=>x.classList.remove('active'));if(!was)p.classList.add('active')});[['fAffected','affected'],['fImpact','impact'],['fPriority','priority'],['fTitle','title'],['fWorkflow','workflow'],['fComp','compensation']].forEach(([id,key])=>{const e=$(id);if(e){e.value=filters[key];e.onchange=()=>{filters[key]=e.value;syncAnalysis()}}});$('fMinImpact')?.addEventListener('input',e=>{filters.minImpact=Number(e.target.value);$('minImpactVal').textContent=filters.minImpact.toFixed(1)+'%';drawMap();renderDrawer()});$('fMinImpact')?.addEventListener('change',renderPanel);$('fieldForm')?.addEventListener('submit',e=>{e.preventDefault();toast('Field draft captured in this session')});$('fieldExport')?.addEventListener('click',()=>downloadJson('P06_field_verification_draft.json',Object.fromEntries(new FormData($('fieldForm')).entries())));$('exportCsv')?.addEventListener('click',exportCsv);$('exportJson')?.addEventListener('click',()=>downloadJson('P06_selection.json',selectionRecords()));$('exportCases')?.addEventListener('click',()=>exportRowsCsv(APP.cases,'P06_land_cases.csv'));$('printMap2')?.addEventListener('click',()=>window.print())}
function syncAnalysis(){drawMap();renderDrawer();renderPanel()}
function setNav(nav){activeNav=nav;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav));renderPanel();if(innerWidth<=820)$('contextPanel').classList.add('mobile-open')}
function selectEntity(p,open){activeEntity=p;selected.add(p.parcel_id);drawMap();if(activeNav==='results')renderPanel();if(open)openDetails(p);focusEntity(p)}
function openDetails(p){activeEntity=p;activeDetailTab='Overview';$('detailDrawer').classList.add('open');renderDetails()}
function relatedForParcel(p){return{cases:APP.cases.filter(x=>String(x.parcel_id)===p.parcel_id),documents:APP.documents.filter(x=>String(x.parcel_id)===p.parcel_id),payments:APP.payments.filter(x=>String(x.parcel_id)===p.parcel_id),grievances:APP.grievances.filter(x=>String(x.parcel_id)===p.parcel_id),field:APP.field.filter(x=>String(x.parcel_id)===p.parcel_id)}}
function kvRows(arr){return arr.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
function renderDetails(){const p=activeEntity;if(!p)return;$('detailEyebrow').textContent='Parcel / Dag';$('detailTitle').textContent=humanTitle(p);$('detailSubtitle').textContent=`${p.jl_no} · ${p.khatian_ref} · ${p.parcel_id}`;const tabs=['Overview','Impact','Land Record','Compensation','Case / Evidence'];$('detailTabs').innerHTML=tabs.map(t=>`<button class="${t===activeDetailTab?'active':''}" data-detail-tab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{activeDetailTab=b.dataset.detailTab;renderDetails()});const metrics=`<div class="detail-metrics"><div class="detail-metric"><b>${fmt(num(p.recorded_area_sqm)/10000,' ha')}</b><span>Parcel area</span></div><div class="detail-metric"><b>${fmt(p.impact_percent,'%')}</b><span>Direct impact</span></div><div class="detail-metric"><b>${fmt(p.priority_score)}</b><span>Priority score</span></div><div class="detail-metric"><b>${money(p.outstanding_bdt)}</b><span>Outstanding</span></div></div>`;const rel=relatedForParcel(p);let rows=[];if(activeDetailTab==='Overview')rows=[['Impact category',p.impact_category],['Priority',p.priority_class],['Land use',p.land_use],['Tenure',p.tenure_type],['Treatment',p.legal_treatment_category],['Next action',p.next_action]];if(activeDetailTab==='Impact')rows=[['40 m ROW context',fmt(p.row_context_40m_sqm,' m²')],['9.2 m direct impact',fmt(p.row_temporary_impact_sqm,' m²')],['Tower footing',fmt(p.tower_footing_sqm,' m²')],['Substation acquisition',fmt(p.substation_acquisition_sqm,' m²')],['Temporary access',fmt(p.temporary_access_sqm,' m²')],['Total direct impact',fmt(p.total_direct_impact_sqm,' m²')],['Impact percent',fmt(p.impact_percent,'%')]];if(activeDetailTab==='Land Record')rows=[['Mouza',p.mouza_name],['J.L.',p.jl_no],['Dag',p.dag_no],['Khatian reference',p.khatian_ref],['Record basis',p.parcel_record_basis],['Owner group reference',p.owner_group_ref],['Interest category',p.affected_interest_category],['Title verification',p.title_verification_status]];if(activeDetailTab==='Compensation')rows=[['Planning acquisition exposure',money(p.planning_acquisition_exposure_bdt)],['Tower-footing exposure',money(p.planning_tower_footing_exposure_bdt)],['Temporary/crop exposure',money(p.planning_temp_crop_access_exposure_bdt)],['Asset allowance',money(p.planning_asset_allowance_bdt)],['Total planning exposure',money(p.planning_compensation_exposure_bdt)],['Paid',money(p.paid_bdt)],['Outstanding',money(p.outstanding_bdt)],['Compensation status',p.compensation_status]];if(activeDetailTab==='Case / Evidence')rows=[['Workflow',p.lifecycle_status],['Notice',p.notice_status],['Grievance',p.grievance_status||'None'],['Cases',rel.cases.length],['Documents',rel.documents.length],['Payments',rel.payments.length],['Grievances',rel.grievances.length],['Field records',rel.field.length],['Last action',p.last_action_date||'—'],['Next action',p.next_action]];$('detailBody').innerHTML=metrics+`<div class="section-title">${esc(activeDetailTab)}</div>`+kvRows(rows)}
function compareSelected(){const rows=[...selected].map(entityById).filter(Boolean).slice(0,4);if(rows.length<2)return;$('detailDrawer').classList.add('open');$('detailEyebrow').textContent='Comparison';$('detailTitle').textContent=`${rows.length} selected parcels`;$('detailSubtitle').textContent='Side-by-side land-management comparison';$('detailTabs').innerHTML='';const metrics=[['Mouza / Dag',p=>humanTitle(p)],['Impact',p=>p.impact_category],['Impact %',p=>fmt(p.impact_percent,'%')],['Priority',p=>p.priority_class],['Title',p=>p.title_verification_status],['Workflow',p=>p.lifecycle_status],['Outstanding',p=>money(p.outstanding_bdt)]];$('detailBody').innerHTML=`<div style="overflow:auto"><table class="data-table"><thead><tr><th>Metric</th>${rows.map(p=>`<th>${esc('Dag '+p.dag_no)}</th>`).join('')}</tr></thead><tbody>${metrics.map(([label,fn])=>`<tr><td><b>${esc(label)}</b></td>${rows.map(p=>`<td>${esc(fn(p))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;zoomSelected()}

const tableDefs={parcels:{label:'Parcels',rows:()=>visibleEntities(),cols:['parcel_id','mouza_name','jl_no','dag_no','khatian_ref','land_use','impact_category','impact_percent','priority_class','title_verification_status','lifecycle_status','outstanding_bdt']},cases:{label:'Land Cases',rows:()=>APP.cases,cols:['case_id','parcel_id','mouza_name','dag_no','project_impact','case_status','title_status','notice_status','compensation_status','priority_class','next_action']},documents:{label:'Documents',rows:()=>APP.documents,cols:['document_id','case_id','parcel_id','document_type','document_ref','status','document_date']},payments:{label:'Payments',rows:()=>APP.payments,cols:['payment_id','case_id','parcel_id','amount_bdt','payment_date','status']},grievances:{label:'Grievances',rows:()=>APP.grievances,cols:['grievance_id','case_id','parcel_id','category','status','opened_date']},field:{label:'Field Verification',rows:()=>APP.field,cols:['verification_id','case_id','parcel_id','visit_status','boundary_marker_status','current_land_use','occupancy_observation','gps_accuracy_m','photo_count']},process:{label:'Process',rows:()=>APP.process,cols:['step_no','stage','input','gis_method','output','why']}};
function renderDrawer(){$('drawerTabs').innerHTML=Object.entries(tableDefs).map(([id,d])=>`<button class="${id===activeTableTab?'active':''}" data-table-tab="${id}">${esc(d.label)}</button>`).join('');document.querySelectorAll('[data-table-tab]').forEach(b=>b.onclick=()=>{activeTableTab=b.dataset.tableTab;renderDrawer()});const d=tableDefs[activeTableTab],rows=d.rows(),keys=d.cols;$('dataHead').innerHTML='<tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr>';$('dataBody').innerHTML=rows.slice(0,500).map(r=>'<tr>'+keys.map(k=>`<td>${esc(fmt(r[k]))}</td>`).join('')+'</tr>').join('');$('drawerCount').textContent=`${rows.length} records`}
function toggleDrawer(force){drawerOpen=force===undefined?!drawerOpen:force;$('dataDrawer').classList.toggle('open',drawerOpen);renderDrawer()}
function selectionRecords(){return selected.size?[...selected].map(entityById).filter(Boolean):visibleEntities()}
function csvText(rows){if(!rows.length)return'';const keys=Object.keys(rows[0]);const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};return[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function exportRowsCsv(rows,name){downloadBlob(name,csvText(rows),'text/csv;charset=utf-8')}
function exportCsv(){exportRowsCsv(selectionRecords(),'P06_selection.csv')}
function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}
function downloadBlob(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
function renderLegend(){const sets={impact:[['#315fd5','Substation acquisition'],['#8151b6','Tower footing'],['#d28a32','ROW / stringing'],['#168c91','Temporary access'],['#c8d0cc','No direct impact']],priority:[['#c8454b','Critical'],['#e4773a','High'],['#e1ad43','Moderate'],['#6bad7d','Low']],title:[['#50a278','Verified'],['#e1a13b','Pending'],['#ca494f','Discrepancy']],compensation:[['#2e9d68','Paid'],['#3566cb','Approved'],['#8b5cf6','Valuation complete'],['#e6a23c','Pending'],['#c8d0cc','Not required']],outstanding:[['#a83e44','≥5M BDT'],['#d45d4a','1–5M'],['#e49a45','0.2–1M'],['#e5c65c','<0.2M'],['#7eb58a','None']],landuse:[['#a5bb69','Agriculture'],['#d79b75','Homestead'],['#639c6e','Orchard'],['#6aaac5','Pond'],['#8c78a7','Commercial']],tenure:[['#4f83c2','Private'],['#808b92','Government/Khas'],['#8d61a9','Institutional']],workflow:[['#2e9d68','Paid / Closed'],['#3566cb','Approved / Valuation'],['#8b5cf6','Notice / Confirmed'],['#e6a23c','Survey / Record check'],['#c8d0cc','No action']]};const labels={impact:'Impact Category',priority:'Action Priority',workflow:'Case Workflow',title:'Title Verification',compensation:'Compensation Status',outstanding:'Outstanding Exposure',landuse:'Land Use',tenure:'Tenure / Interest'};const rows=(sets[activeTheme]||sets.impact).map(x=>`<div class="legend-row"><span class="swatch" style="background:${x[0]}"></span>${x[1]}</div>`).join('');$('legend').innerHTML=`<b>${esc(labels[activeTheme]||'Legend')}</b>${rows}<div class="legend-row"><span style="width:14px;height:8px;border:2px solid #0b5441"></span>Selected parcel</div>`;$('legend').classList.toggle('show',legendOpen)}
function resetAll(){selected.clear();activeEntity=null;Object.assign(filters,{affected:'All',impact:'All',priority:'All',title:'All',workflow:'All',compensation:'All',minImpact:0});Object.keys(layerState).forEach(k=>layerState[k]=true);activeTheme='impact';$('mapTheme').value=activeTheme;$('globalSearch').value='';$('detailDrawer').classList.remove('open');if(activeBm&&map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm.local;$('basemap').value='local';activeBm.addTo(map);drawMap();renderPanel();renderDrawer();setTimeout(fitAll,50)}

function init(){
  $('appPid').textContent='P06';$('appTitle').textContent=APP.title;$('appSubtitle').textContent=APP.subtitle;
  $('globalSearch').placeholder='Search Dag, Mouza, Khatian, parcel, case…';
  $('mapTheme').innerHTML=[['impact','Impact Category'],['priority','Action Priority'],['workflow','Case Workflow'],['title','Title Verification'],['compensation','Compensation Status'],['outstanding','Outstanding Exposure'],['landuse','Land Use'],['tenure','Tenure / Interest']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
  $('mapTheme').value=activeTheme;
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setNav(b.dataset.nav)));
  $('mapTheme').addEventListener('change',e=>{activeTheme=e.target.value;drawMap();if(activeNav==='analysis'||activeNav==='results')renderPanel()});
  $('basemap').addEventListener('change',e=>{if(activeBm&&map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm[e.target.value]||bm.local;if(layerState.basemap)activeBm.addTo(map)});
  $('globalSearch').addEventListener('input',()=>{drawMap();renderDrawer();if(activeNav==='results'||activeNav==='analysis')renderPanel()});
  $('detailClose').addEventListener('click',()=>$('detailDrawer').classList.remove('open'));
  $('drawerHandle').addEventListener('click',()=>toggleDrawer());$('legendBtn').addEventListener('click',()=>{legendOpen=!legendOpen;renderLegend()});$('fitBtn').addEventListener('click',fitAll);$('printBtn').addEventListener('click',()=>window.print());$('csvMini').addEventListener('click',()=>exportRowsCsv(tableDefs[activeTableTab].rows(),`P06_${activeTableTab}.csv`));$('expandData').addEventListener('click',()=>{drawerFull=!drawerFull;$('dataDrawer').classList.toggle('full',drawerFull)});$('resetBtn').addEventListener('click',resetAll);
  drawMap();renderPanel();renderDrawer();renderLegend();setTimeout(fitAll,300);
  window.P06_APP={APP,layerState,filters,selected,drawMap,visibleEntities,setNav,selectEntity,openDetails};
}
init();
