function buildGraph(opts={}){const failed=opts.failedEdge||'',barrier=opts.barrierDevice||'',phase=opts.phase||'All',states=opts.states||deviceStates,g={};APP.nodes.forEach(n=>g[n.node_id]=[]);APP.edges.forEach(e=>{if(e.edge_id===failed)return;if(e.control_device&&(states[e.control_device]||'Closed')!=='Closed')return;if(barrier&&e.control_device===barrier)return;if(!phaseCompatible(e.phases,phase))return;g[e.from_node].push({to:e.to_node,edge:e});g[e.to_node].push({to:e.from_node,edge:e})});return g}
function bfsPath(start,targets,opts={}){const g=buildGraph(opts),q=[[start,[],[start]]],seen=new Set([start]);while(q.length){const [u,es,ns]=q.shift();if(targets.has(u))return{source:u,edges:es,nodes:ns};for(const x of g[u]||[]){if(!seen.has(x.to)){seen.add(x.to);q.push([x.to,es.concat(x.edge.edge_id),ns.concat(x.to)])}}}return null}
