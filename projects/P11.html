_method":"Feature load / condition domains","output":"Municipal resilience/safety layers","why":"Completes the cross-sector infrastructure picture."},{"step_no":11,"stage":"Standardize CRS and geometry","input":"Multi-source spatial data","gis_method":"Project / Repair Geometry / Check Geometry","output":"Common analysis geodatabase","why":"Distance, area and proximity analysis require consistent geometry and coordinate systems."},{"step_no":12,"stage":"Normalize asset condition","input":"Sector-specific inspection ratings","gis_method":"Crosswalk table / Calculate Field","output":"Excellent/Good/Fair/Poor/Critical + health score","why":"Enables portfolio comparison without erasing sector-specific source ratings."},{"step_no":13,"stage":"Normalize criticality / service importance","input":"Users served, redundancy, strategic role","gis_method":"Scoring / domain-specific crosswalk","output":"Comparable criticality and service scores","why":"Condition alone is not enough for investment prioritization."},{"step_no":14,"stage":"Build maintenance backlog register","input":"Open work orders / defects / deferred maintenance","gis_method":"Related tables / summary statistics","output":"Backlog score and monetary estimate","why":"Links asset condition with actual outstanding work."},{"step_no":15,"stage":"Build capital-project register","input":"Programs, budgets, schedules, progress","gis_method":"Project-to-asset relationship class","output":"Spatial capital program","why":"Users can see where rehabilitation, replacement and expansion are planned."},{"step_no":16,"stage":"Create inspection / evidence relationships","input":"Field inspections, photos, reports","gis_method":"Related tables / attachments","output":"Auditable condition evidence","why":"Every condition statement should be traceable to an inspection/evidence record."},{"step_no":17,"stage":"Calculate age / remaining life","input":"Commissioning date, design life","gis_method":"Calculate Field","output":"Age and function renderDetails(){const a=activeEntity;if(!a)return;$('detailEyebrow').textContent=a.sector;$('detailTitle').textContent=a.name;$('detailSubtitle').textContent=`${a.asset_id} · ${a.asset_type}`;const tabs=['Overview','Condition','Service / Nearby','Projects','Maintenance / Incidents','Evidence'];$('detailTabs').innerHTML=tabs.map(t=>`<button class="${t===activeDetailTab?'active':''}" data-dtab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-dtab]').forEach(b=>b.onclick=()=>{activeDetailTab=b.dataset.dtab;renderDetails()});const r=related(a),near=nearby(a);const metrics=`<div class="detail-metrics"><div class="detail-metric"><b>${a.asset_health_score}</b><span>Health score</span></div><div class="detail-metric"><b>${a.criticality_score}</b><span>Criticality</span></div><div class="detail-metric"><b>${fmt(a.utilization_pct,'%')}</b><span>Utilization</span></div><div class="detail-metric"><b>${fmt(a.investment_priority_score)}</b><span>Priority score</span></div></div>`;let rows=[];if(activeDetailTab==='Overview')rows=[['Sector',a.sector],['Asset type',a.asset_type],['Owner',a.owner],['Lifecycle',a.lifecycle_status],['Operational status',a.operational_status],['Neighborhood',a.neighborhood_name],['Capacity',`${a.capacity_value} ${a.capacity_unit}`],['Next action',a.next_action]];if(activeDetailTab==='Condition')rows=[['Condition class',a.condition_class],['Health score',a.asset_health_score],['Age',a.age_years+' years'],['Design life',a.design_life_years+' years'],['Remaining life',a.remaining_life_years+' years'],['Last inspection',a.last_inspection],['Next inspection',a.next_inspection],['Maintenance backlog',moneyM(a.maintenance_backlog_bdt_m)],['Data confidence',a.data_confidence]];if(activeDetailTab==='Service / Nearby')rows=[['Service importance',a.service_importance_score],['Utilization',a.utilization_pct+'%'],['Nearby assets',near.length],['Radius',nearRadiusKm+' km'],...near.slice(0,8).map(x=>[x.asset_id,`${x.sector} · ${x.name} · ${fmt(distanceKm(a,x),' km')}`])];if(activeDetailTab==='Projects')rows=[['Projects linked',r.projects.length],['Capital budget',moneyM(r.projects.reduce((s,p)=>s+num(p.budget_bdt_m),0))],...r.projects.slice(0,6).map(p=>[p.project_id,`${p.project_type} · ${p.status} · ${p.progress_pct}%`])];if(activeDetailTab==='Maintenance / Incidents')rows=[['Maintenance work orders',r.maintenance.length],['Open maintenance',r.maintenance.filter(x=>x.status!=='Closed').length],['Incidents',r.incidents.length],['Open / review incidents',r.incidents.filter(x=>x.status!=='Closed').length],...r.maintenance.slice(0,4).map(x=>[x.work_order_id,`${x.work_type} · ${x.status}`]),...r.incidents.slice(0,4).map(x=>[x.incident_id,`${x.incident_type} · ${x.severity} · ${x.status}`])];if(activeDetailTab==='Evidence')rows=[['Inspection records',r.inspections.length],['Documents',r.documents.length],['Latest inspection',r.inspections[0]?.inspection_date||'—'],...r.documents.slice(0,6).map(x=>[x.document_id,`${x.document_type} · rev ${x.revision}`])];$('detailBody').innerHTML=metrics+`<div class="section-title">${esc(activeDetailTab)}</div>`+kvRows(rows)}
function compareSelected(){const rows=[...selected].map(id=>assetById[id]).filter(Boolean).slice(0,4);if(rows.length<2)return;$('detailDrawer').classList.add('open');$('detailEyebrow').textContent='Infrastructure comparison';$('detailTitle').textContent=`${rows.length} selected assets`;$('detailSubtitle').textContent='Condition, capacity, criticality and investment';$('detailTabs').innerHTML='';const metrics=[['Sector',x=>x.sector],['Type',x=>x.asset_type],['Condition',x=>x.condition_class],['Health',x=>x.asset_health_score],['Criticality',x=>x.criticality_score],['Utilization',x=>fmt(x.utilization_pct,'%')],['Backlog',x=>moneyM(x.maintenance_backlog_bdt_m)],['Priority',x=>`${x.priority_class} (${x.investment_priority_score})`]];$('detailBody').innerHTML=`<div style="overflow:auto"><table class="data-table"><thead><tr><th>Metric</th>${rows.map(x=>`<th>${esc(x.asset_id)}</th>`).join('')}</tr></thead><tbody>${metrics.map(([k,fn])=>`<tr><td><b>${k}</b></td>${rows.map(x=>`<td>${esc(fn(x))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;zoomSelected()}
const tableDefs={assets:{label:'Asset Register',rows:()=>visibleAssets(),cols:['asset_id','name','sector','asset_type','owner','neighborhood_name','condition_class','asset_health_score','criticality_score','capacity_value','capacity_unit','utilization_pct','lifecycle_status','priority_class','investment_priority_score','maintenance_backlog_bdt_m']},linear:{label:'Linear Infrastructure',rows:()=>APP.linear,cols:['linear_id','name','sector','asset_type','owner','status','length_km','condition_class','criticality_score','utilization_pct']},projects:{label:'Capital Projects',rows:()=>APP.projects,cols:['project_id','project_name','asset_id','sector','project_type','status','start_date','end_date','budget_bdt_m','progress_pct','delivery_risk','next_milestone']},inspections:{label:'Inspections',rows:()=>APP.inspections,cols:['inspection_id','asset_id','inspection_date','inspection_type','condition_class','finding','photo_count','follow_up']},maintenance:{label:'Maintenance',rows:()=>APP.maintenance,cols:['work_order_id','asset_id','work_type','priority','status','planned_cost_bdt_m','target_date','owner_team']},incidents:{label:'Incidents',rows:()=>APP.incidents,cols:['incident_id','asset_id','incident_date','incident_type','severity','status','downtime_hr','people_or_users_affected']},documents:{label:'Documents',rows:()=>APP.documents,cols:['document_id','asset_id','document_type','document_ref','revision','status','document_date']},dependencies:{label:'Dependencies',rows:()=>APP.dependencies,cols:['dependency_id','from_asset_id','to_asset_id','dependency_type','distance_km','criticality','description']},neighborhoods:{label:'Neighborhoods',rows:()=>APP.neighborhoods,cols:['neighborhood_id','name','population','density_per_sqkm','vulnerability_index']},process:{label:'Process',rows:()=>APP.process,cols:['step_no','stage','input','gis_method','output','why']}};
function renderDrawer(){$('drawerTabs').innerHTML=Object.entries(tableDefs).map(([id,d])=>`<button class="${id===activeTableTab?'active':''}" data-ttab="${id}">${esc(d.label)}</button>`).join('');document.querySelectorAll('[data-ttab]').forEach(b=>b.onclick=()=>{activeTableTab=b.dataset.ttab;renderDrawer()});const d=tableDefs[activeTableTab],rows=d.rows();$('dataHead').innerHTML='<tr>'+d.cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';$('dataBody').innerHTML=rows.slice(0,600).map(r=>'<tr>'+d.cols.map(c=>`<td>${esc(fmt(r[c]))}</td>`).join('')+'</tr>').join('');$('drawerCount').textContent=`${rows.length} records`}
function toggleDrawer(force){drawerOpen=force===undefined?!drawerOpen:force;$('dataDrawer').classList.toggle('open',drawerOpen);renderDrawer()}
function csvText(rows){if(!rows.length)return'';const keys=Object.keys(rows[0]),q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};return[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function exportRowsCsv(rows,name){downloadBlob(name,csvText(rows),'text/csv;charset=utf-8')}function downloadJson(name,obj){downloadBlob(name,JSON.stringify(obj,null,2),'application/json')}function downloadBlob(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),600)}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__p11);window.__p11=setTimeout(()=>t.classList.remove('show'),1800)}
function renderLegend(){const sets={sector:Object.entries(SECTOR_COLORS).map(([s,c])=>[c,s]),condition:[['#2e9d68','Excellent'],['#6bad7d','Good'],['#e1ad43','Fair'],['#e4773a','Poor'],['#c8454b','Critical']],criticality:[['#7b2f4d','≥85'],['#c65349','70–84'],['#d99b43','50–69'],['#6f9c77','<50']],priority:[['#a83e44','Critical'],['#e4773a','High'],['#e1ad43','Moderate'],['#6bad7d','Low']],lifecycle:[['#2e9d68','Operational'],['#e4773a','Rehabilitation'],['#e6a23c','Maintenance'],['#315fd5','Expansion / Upgrade']],age:[['#a83e44','≥30 years'],['#e4773a','20–29'],['#e1ad43','10–19'],['#6bad7d','<10']],utilization:[['#a83e44','≥85%'],['#e4773a','70–84%'],['#e1ad43','50–69%'],['#6bad7d','<50%']]};const labels={sector:'Sector',condition:'Condition',criticality:'Criticality',priority:'Investment Priority',lifecycle:'Lifecycle',age:'Asset Age',ownership:'Ownership',utilization:'Utilization'};$('legend').innerHTML=`<b>${labels[activeTheme]}</b>`+(sets[activeTheme]||sets.sector).map(x=>`<div class="legend-row"><span class="swatch" style="background:${x[0]}"></span>${esc(x[1])}</div>`).join('');$('legend').classList.toggle('show',legendOpen)}
function resetAll(){selected.clear();activeEntity=null;Object.assign(filters,{sector:'All',assetType:'All',condition:'All',priority:'All',lifecycle:'All',owner:'All',projectStatus:'All',minCriticality:0});Object.keys(layerState).forEach(k=>layerState[k]=true);activeTheme='sector';projectYear=2026;nearRadiusKm=2.5;$('mapTheme').value=activeTheme;$('globalSearch').value='';$('detailDrawer').classList.remove('open');if(map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm.local;$('basemap').value='local';activeBm.addTo(map);drawMap();renderPanel();renderDrawer();fitMap()}
function coordinateQA(){const bad=[];function walk(c,label){if(Array.isArray(c)&&typeof c[0]==='number'){if(c[0]<-180||c[0]>180||c[1]<-90||c[1]>90)bad.push({label,c})}else if(Array.isArray(c))c.forEach(x=>walk(x,label))}Object.entries(APP.geo).forEach(([k,fc])=>fc.features?.forEach(f=>walk(f.geometry.coordinates,k)));return bad}
function runSelfTest(){const r={assets:APP.assets.length,sectors:new Set(APP.assets.map(a=>a.sector)).size,bad_coordinates:coordinateQA().length};const first=APP.assets[0];selectAsset(first,true);r.detail_open=$('detailDrawer').classList.contains('open');r.nearby=nearby(first).length;const old={...layerState};Object.keys(layerState).forEach(k=>layerState[k]=false);drawMap();r.all_off=!map.hasLayer(activeBm)&&Object.keys(mapLayers).length===0;Object.assign(layerState,old);resetAll();document.body.dataset.p11Selftest=JSON.stringify(r);return r}
function init(){$('appPid').textContent='P11';$('appTitle').textContent=APP.title;$('appSubtitle').textContent=APP.subtitle;$('globalSearch').placeholder='Search asset, sector, owner, neighborhood, project…';$('mapTheme').innerHTML=[['sector','Sector'],['condition','Condition'],['criticality','Criticality'],['priority','Investment Priority'],['lifecycle','Lifecycle'],['age','Asset Age'],['ownership','Ownership'],['utilization','Utilization']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('mapTheme').value=activeTheme;document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setNav(b.dataset.nav));$('mapTheme').onchange=e=>{activeTheme=e.target.value;drawMap()};$('basemap').onchange=e=>{if(activeBm&&map.hasLayer(activeBm))map.removeLayer(activeBm);activeBm=bm[e.target.value]||bm.local;if(layerState.basemap)activeBm.addTo(map)};$('globalSearch').oninput=()=>{drawMap();renderDrawer();if(activeNav==='results'||activeNav==='analysis')renderPanel()};$('detailClose').onclick=()=>$('detailDrawer').classList.remove('open');$('drawerHandle').onclick=()=>toggleDrawer();$('expandData').onclick=e=>{e.stopPropagation();drawerFull=!drawerFull;$('dataDrawer').classList.toggle('full',drawerFull)};$('csvMini').onclick=e=>{e.stopPropagation();const d=tableDefs[activeTableTab];exportRowsCsv(d.rows(),`P11_${activeTableTab}.csv`)};$('legendBtn').onclick=()=>{legendOpen=!legendOpen;renderLegend()};$('fitBtn').onclick=fitMap;$('printBtn').onclick=()=>window.print();$('resetBtn').onclick=resetAll;drawMap();renderPanel();renderDrawer();renderLegend();setTimeout(fitMap,250);window.P11_APP={APP,filters,layerState,selected,runSelfTest,coordinateQA,drawMap,setNav,nearby};if(new URLSearchParams(location.search).get('selftest')==='1')setTimeout(runSelfTest,100)}
init();
