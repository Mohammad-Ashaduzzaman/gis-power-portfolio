Capacity and optical loss depend on actual cable characteristics."},{"step_no":7,"stage":"Map splice closures / joint boxes","input":"Tower schedule, joint plans, field GPS","gis_method":"Linear referencing / locate along route","output":"Splice-closure point layer","why":"Splices are key optical-loss and maintenance locations."},{"step_no":8,"stage":"Create ODF / patch-panel inventory","input":"Telecom room records","gis_method":"Related table / relationship class","output":"ODF panel and port-capacity register","why":"Physical patching must be traceable at every node."},{"step_no":9,"stage":"Register telecom equipment","input":"OTN/SDH/MPLS-TP/protection/NMS inventory","gis_method":"Related equipment table","output":"Node equipment register","why":"Fiber connectivity is only useful when tied to actual transport/protection equipment."},{"step_no":10,"stage":"Create fiber-core allocation model","input":"Core schedules / patch sheets / service records","gis_method":"Link-service allocation table","output":"Core-pair allocations by link and service","why":"Shows used, reserved, leased and spare fibers."},{"step_no":11,"stage":"Map operational services","input":"SCADA, teleprotection, PMU, metering, voice, IP, CCTV","gis_method":"Service endpoint table","output":"Service circuit register","why":"Outage impact depends on services carried, not only cable geometry."},{"step_no":12,"stage":"Create network graph","input":"Nodes + OPGW links","gis_method":"Network topology / graph adjacency","output":"Traceable fiber network","why":"Enables primary/alternate path tracing and connectivity validation."},{"step_no":13,"stage":"Validate topology","input":"Link endpoints and node locations","gis_method":"Snap / endpoint QA / disconnected-node checks","output":"Connected topology","why":"A tiny endpoint mismatch can invalidate trace results."},{"step_no":14,"stage":"Calculate route length","input":"OPGW line geometry","gis_method":"Calculate Geometry in projected CRS","output":"Route length per link","why":"Length drives loss budget, maintenance and exposure."},{"step_no":15,"stage":"Build optical loss budget","input":"Length, attenuation, splice/connector losses, equipment budget","gis_method":"Calculate Field / engineering table","output":"Calculated loss and design margin","why":"Links need adequate optical power margin."},{"step_no":16,"stage":"Integrate OTDR / optical test results","input":"OTDR traces, power-meter tests","gis_method":"Related test table + event referencing","output":"Measured end-to-end loss and event history","why":"Measured condition must be compared with design expectations."},{"step_no":17,"stage":"Locate OTDR events","input":"Distance-to-event from endpoint","gis_method":"Linear referencing / route measure","output":"Approximate fault/event locations","why":"Reduces field search time during restoration."},{"step_no":18,"stage":"Model fiber utilization","input":"Core allocations, reservations, leases","gis_method":"Summary statistics / joins","output":"Used, reserved, leased, spare cores + utilization %","why":"Supports capacity planning and future service allocation."},{"step_no":19,"stage":"Model redundancy / ring protection","input":"Topology and protected-service requirements","gis_method":"Alternate-path trace","output":"Primary + diverse backup path","why":"Critical grid telecom should not rely on one physical path when diversity is required."},{"step_no":20,"stage":"Run single-link failure simulation","input":"Selected OPGW link","gis_method":"Remove edge + rerun traces","output":"Affected and reroutable services","why":"Exposes single points of failure before an outage occurs."},{"step_no":21,"stage":"Calculate service criticality","input":"Protection, SCADA, PMU, metering, corporate services","gis_method":"Business/operations weighting","output":"Criticality score by service and carried link","why":"Teleprotection/SCADA impact is not equivalent to non-critical traffic."},{"step_no":22,"stage":"Calculate li ,"fields":"equipment_id, node_id, type, rack, power, NMS status"},{"name":"Fiber/Core Allocations","type":"Related Table","role":"Maps service circuits to fiber pairs on primary/backup paths.","fields":"allocation_id, link_id, service_id, path_role, fiber_pair, status"},{"name":"Service Circuits","type":"Related Table","role":"SCADA, teleprotection, PMU, metering, voice/IP/security services.","fields":"service_id, class, endpoints, criticality, bandwidth, protection, primary/backup path"},{"name":"Optical Tests","type":"Related Table","role":"OTDR/power-test measurements and event quality.","fields":"test_id, link_id, direction, wavelength, loss, worst event, length, result"},{"name":"Fault Register","type":"Point + Table","role":"Active/historic fiber incidents with OTDR-based route location.","fields":"fault_id, link_id, severity, event distance, status, service impact"},{"name":"Route-Risk Segments","type":"Polyline","role":"River crossing, aging, splice-density and work-interface watch areas.","fields":"risk_id, link_id, risk_type, score, mitigation"},{"name":"Maintenance Work Orders","type":"Related Table","role":"Inspection/restoration/OTDR/ODF tasks.","fields":"work_order_id, link_id, work_type, priority, status, owner"}],"desktop":[{"step_no":1,"stage":"Define telecom GIS scope","input":"Transmission network, telecom architecture, operations requirements","gis_method":"Requirements matrix / asset model","output":"P09 scope, asset classes and trace questions","why":"Separate physical OPGW, fiber-core inventory, services, equipment, tests and maintenance."},{"step_no":2,"stage":"Collect transmission corridor geometry","input":"Approved line/tower/substation GIS or as-builts","gis_method":"Load / Project / topology QA","output":"Controlled transmission corridors and substations","why":"OPGW route geometry follows the transmission asset and must be spatially controlled."},{"step_no":3,"stage":"Create telecom node register","input":"Substations, NOC, POPs, telecom rooms","gis_method":"Feature class + domains","output":"Telecom nodes","why":"Nodes anchor OPGW links, ODFs, equipment and service endpoints."},{"step_no":4,"stage":"Create OPGW link segmentation","input":"Transmission spans, OPGW installation/as-built records","gis_method":"Split line at telecom nodes / joints","output":"OPGW link feature class","why":"Optical calculations and outages are managed link-by-link."},{"step_no":5,"stage":"Build stable link/node IDs","input":"Asset registers","gis_method":"ID rules / attribute rules","output":"Unique node, link and closure keys","why":"Related tables depend on stable foreign keys."},{"step_no":6,"stage":"Load OPGW cable specifications","input":"Manufacturer/as-built cable schedule","gis_method":"Join / related table","output":"Fiber count, fiber type, attenuation and installation metadata","why":"Capacity and optical loss depend on actual cable characteristics."},{"step_no":7,"stage":"Map splice closures / joint boxes","input":"Tower schedule, joint plans, field GPS","gis_method":"Linear referencing / locate along route","output":"Splice-closure point layer","why":"Splices are key optical-loss and maintenance locations."},{"step_no":8,"stage":"Create ODF / patch-panel inventory","input":"Telecom room records","gis_method":"Related table / relationship class","output":"ODF panel and port-capacity register","why":"Physical patching must be traceable at every node."},{"step_no":9,"stage":"Register telecom equipment","input":"OTN/SDH/MPLS-TP/protection/NMS inventory","gis_method":"Related equipment table","output":"Node equipment register","why":"Fiber connectivity is only useful when tied to actual transport/protection equipment."},{"step_no":10,"stage":"Create fiber-core allocation model","input":"Core schedules / patch sheets / service records","gis_method":"Link-service allocation table","output":"Core-pair allocations by link and service","why":"Shows used, reserved, leased and spare fibers."},{"step_no":11,"stage":"Map operational services","input":"SCADA, teleprotection, PMU, metering, voice, IP, CCTV","gis_method":"Service endpoint table","output":"Service circuit register","why":"Outage impact depends on services carried, not only cable geometry."},{"step_no":12,"stage":"Create network graph","input":"Nodes + OPGW links","gis_method":"Network topology / graph adjacency","output":"Traceable fiber network","why":"Enables primary/alternate path tracing and connectivity validation."},{"step_no":13,"stage":"Validate topology","input":"Link endpoints and node locations","gis_method":"Snap / endpoint QA / disconnected-node checks","output":"Connected topology","why":"A tiny endpoint mismatch can invalidate trace results."},{"step_no":14,"stage":"Calculate route length","input":"OPGW line geometry","gis_method":"Calculate Geometry in projected CRS","output":"Route length per link","why":"Length drives loss budget, maintenance and exposure."},{"step_no":15,"stage":"Build optical loss budget","input":"Length, attenuation, splice/connector losses, equipment budget","gis_method":"Calculate Field / engineering table","output":"Calculated loss and design margin","why":"Links need adequate optical power margin."},{"step_no":16,"stage":"Integrate OTDR / optical test results","input":"OTDR traces, power-meter tests","gis_method":"Related test table + event referencing","output":"Measured end-to-end loss and event history","why":"Measured condition must be compared with design expectations."},{"step_no":17,"stage":"Locate OTDR events","input":"Distance-to-event from endpoint","gis_method":"Linear referencing / route measure","output":"Approximate fault/event locations","why":"Reduces field search time during restoration."},{"step_no":18,"stage":"Model fiber utilization","input":"Core allocations, reservations, leases","gis_method":"Summary statistics / joins","output":"Used, reserved, leased, spare cores + utilization %","why":"Supports capacity planning and future service allocation."},{"step_no":19,"stage":"Model redundancy / ring protection","input":"Topology and protected-service requirements","gis_method":"Alternate-path trace","output":"Primary + diverse backup path","why":"Critical grid telecom should not rely on one physical path when diversity is required."},{"step_no":20,"stage":"Run single-link failure simulation","input":"Selected OPGW link","gis_method":"Remove edge + rerun traces","output":"Affected and reroutable services","why":"Exposes single points of failure before an outage occurs."},{"step_no":21,"stage":"Calculate service criticality","input":"Protection, SCADA, PMU, metering, corporate services","gis_method":"Business/operations weighting","output":"Criticality score by service and carried link","why":"Teleprotection/SCADA impact is not equivalent to non-critical traffic."},{"step_no":22,"stage":"Calculate link action priority","input":"Optical margin, service criticality, redundancy, fault history, age/utilization","gis_method":"Weighted operational score","output":"Link action-priority score/class","why":"Creates a maintenance/watchlist separate from simple utilization."},{"step_no":23,"stage":"Map route-risk segments","input":"River crossings, aging sections, high splice density, work interfaces","gis_method":"Segment / overlay / field review","output":"Route-risk segments","why":"Supports targeted patrol and resilience planning."},{"step_no":24,"stage":"Create fault register","input":"NMS alarms, OTDR, outage tickets","gis_method":"Fault table + spatial event","output":"Open/closed fault map and history","why":"Connects telecom alarms to physical route locations."},{"step_no":25,"stage":"Create maintenance work orders","input":"Faults, inspections, risk watchlist","gis_method":"Related work-order table","output":"Telecom O&M work queue","why":"Makes GIS actionable for maintenance teams."},{"step_no":26,"stage":"Field verify closures and route","input":"GPS, photos, closure labels, tower refs","gis_method":"Field Maps / Survey123 / QField","output":"Verified joint-box and OPGW condition records","why":"As-built drawings and field conditions can diverge."},{"step_no":27,"stage":"Audit ODF / patching","input":"Telecom room inspection","gis_method":"ODF/port reconciliation","output":"Verified patching/labeling state","why":"Connectivity failures are often inside the station, not on the OPGW route."},{"step_no":28,"stage":"Publish operational Web GIS","input":"Controlled network + related tables","gis_method":"Web map / app / permissions","output":"OPGW connectivity Web GIS","why":"Provides common situational awareness for telecom, protection and O&M teams."},{"step_no":29,"stage":"Scenario / change management","input":"New links, core reallocations, equipment changes","gis_method":"Version/date control","output":"Reproducible network snapshots","why":"Fiber topology and service routing change over time."},{"step_no":30,"stage":"Final QA and handover","input":"Topology, allocations, test records, service paths","gis_method":"Automated QA + engineering review","output":"Validated P09 portfolio package","why":"Trace results must be auditable and tied to controlled source records."}],"analysis":[{"title":"Fiber utilization","detail":"Utilization % = (allocated + reserved + leased cores) ÷ total fibers × 100. Spare fibers remain explicitly visible for resilience/capacity planning."},{"title":"Optical loss margin","detail":"Calculated loss = route length × attenuation + splice losses + connector losses. Optical margin = equipment/design budget − measured end-to-end loss. Real project thresholds must use approved equipment specifications."},{"title":"Primary / alternate trace","detail":"The network is modeled as node-link topology. A shortest operational path is traced between two nodes; an alternate path is tested by excluding primary links and finding the best remaining route."},{"title":"Failure simulation","detail":"A selected OPGW link is removed from the graph. Services whose primary path use function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function fmt(v,s=''){if(v===null||v===undefined||v==='')return'—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2})+s:String(v)}
function pct(v){return fmt(v,'%')}
function entityById(id){return byId[String(id)]}
function unique(arr,field){return [...new Set(arr.map(x=>String(x[field]??'')).filter(Boolean))].sort()}
function statusColor(v){const s=String(v||'').toLowerCase();if(/critical|fault|outage|poor|open/.test(s))return'#d9534f';if(/watch|degraded|monitor|high/.test(s))return'#e6a23c';if(/good|protected|service|closed|pass/.test(s))return'#2e9d68';return'#4b73c5'}

function entityTitle(e){
  if(e.entity_type==='OPGW Link')return e.link_name;
  if(e.entity_type==='Telecom Node')return e.node_name;
  if(e.entity_type==='Splice Closure')return `${e.closure_id} · ${e.tower_ref}`;
  return e.name||e.entity_id;
}
function passes(e){
  const q=($('globalSearch')?.value||'').trim().toLowerCase();
  if(q&&!Object.values(e).join(' ').toLowerCase().includes(q))return false;
  if(filters.entityType!=='All'&&e.entity_type!==filters.entityType)return false;
  if(e.entity_type==='OPGW Link'){
    if(filters.health!=='All'&&e.link_health!==filters.health)return false;
    if(filters.ring!=='All'&&e.ring!==filters.ring)return false;
    if(filters.voltage!=='All'&&String(e.voltage_kv)!==filters.voltage)return false;
    if(filters.priority!=='All'&&e.priority_class!==filters.priority)return false;
    if(filters.redundancy!=='All'&&e.ring_protection!==filters.redundancy)return false;
    if(num(e.utilization_pct)<filters.minUtilization)return false;
    if(num(e.optical_margin_db)>filters.maxMargin)return false;
    if(filters.openFaultOnly&&!APP.faults.some(f=>f.link_id===e.link_id&&f.status==='Open'))return false;
  }
  return true;
}
function visibleEntities(){return APP.entities.filter(passes)}
function visibleLinkSet(){return new Set(visibleEntities().filter(e=>e.entity_type==='OPGW Link').map(e=>e.link_id))}

function linkColor(l){
  if(activeTheme==='health')return ({Good:'#2e9d68',Watch:'#e6a23c',Critical:'#d9534f'})[l.link_health]||'#7b8790';
  if(activeTheme==='utilization'){const v=num(l.utilization_pct);return v>=80?'#a83e44':v>=65?'#e4773a':v>=45?'#e1ad43':'#4f9d75'}
  if(activeTheme==='margin'){const v=num(l.optical_margin_db);return v<2?'#b52d35':v<4?'#e4773a':v<6?'#e1ad43':'#2e9d68'}
  if(activeTheme==='redundancy')return l.ring_protection==='Mesh / Diverse'?'#315fd5':l.ring_protection==='Ring Protected'?'#147d64':'#d9534f';
  if(activeTheme==='criticality'){const v=num(l.service_criticality_score);return v>=95?'#7b2f4d':v>=85?'#b24a50':v>=70?'#d28a32':'#6f9c77'}
  if(activeTheme==='priority')return ({Critical:'#c8454b',High:'#e4773a',Moderate:'#e1ad43',Low:'#6bad7d'})[l.priority_class]||'#7b8790';
  if(activeTheme==='fibers')return l.fiber_count>=96?'#315fd5':l.fiber_count>=72?'#8151b6':'#147d64';
  if(activeTheme==='status')return l.operational_status==='In Service'?'#2e9d68':l.operational_status==='Degraded'?'#e6a23c':'#d9534f';
  return'#147d64';
}

function graph(excluded=[]){
 const ex=new Set(excluded),g={};APP.nodes.forEach(n=>g[n.node_id]=[]);
 APP.links.forEach(l=>{if(ex.has(l.link_id)||l.operational_status==='Fault / Outage')return;g[l.from_node].push({to:l.to_node,link:l.link_id,km:l.route_km,loss:l.measured_loss_db});g[l.to_node].push({to:l.from_node,link:l.link_id,km:l.route_km,loss:l.measured_loss_db})});
 return g
}
function shortest(src,dst,excluded=[],metric='distance'){
 const g=graph(excluded),dist={[src]:0},prev={},queue=[[0,src]];
 while(queue.length){queue.sort((a,b)=>a[0]-b[0]);const [d,u]=queue.shift();if(d!==dist[u])continue;if(u===dst)break;for(const e of g[u]||[]){const w=metric==='loss'?e.loss:e.km,nd=d+w;if(nd<(dist[e.to]??Infinity)){dist[e.to]=nd;prev[e.to]={node:u,link:e.link};queue.push([nd,e.to])}}}
 if(dist[dst]===undefined)return null;const ls=[],ns=[dst];let cur=dst;while(cur!==src){const p=prev[cur];if(!p)return null;ls.unshift(p.link);cur=p.node;ns.unshift(cur)}return{cost:dist[dst],links:ls,nodes:ns}
}
function alternate(src,dst,primary,metric='distance',forcedFail=''){
 const candidates=[];for(const lid of primary){const ex=new Set([lid]);if(forcedFail)ex.add(forcedFail);const p=shortest(src,dst,[...ex],metric);if(p)candidates.push(p)}
 candidates.sort((a,b)=>a.cost-b.cost);return candidates[0]||null
}

 const p=shortest(src,dst,failed?[failed]:[],metric);traceState.primary=p?.links||[];traceState.primaryCost=p?.cost||0;
 const b=p?alternate(src,dst,p.links,metric,failed):null;traceState.backup=b?.links||[];traceState.backupCost=b?.cost||0;
 const impacted=[],reroutable=[];

 traceState.impacted=impacted;traceState.reroutable=reroutable;drawMap();renderPanel();if(p)zoomTrace();
}

function related(e){

   tests:APP.opticalTests.filter(x=>x.link_id===e.link_id),faults:APP.faults.filter(x=>x.link_id===e.link_id),

function toggleDrawer(force){drawerOpen=force===undefined?!drawerOpen:force;$('dataDrawer').classList.toggle('open',drawerOpen);renderDrawer()}
function csvText(rows){if(!rows.length)return'';const keys=Object.keys(rows[0]),q=v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s};return[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n')}
function exportRowsCsv(rows,name){downloadBlob(name,csvText(rows),'text/csv;charset=utf-8')}
function selectionRows(){return selected.size?[...selected].map(entityById).filter(Boolean):visibleEntities()}

function downloadBlob(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),600)}

function resetAll(){

function coordinateQA(){
 const bad=[];function walk(c,label){if(Array.isArray(c)&&typeof c[0]==='number'){if(c[0]<-180||c[0]>180||c[1]<-90||c[1]>90)bad.push({label,c})}else if(Array.isArray(c))c.forEach(x=>walk(x,label))}
 Object.entries(APP.geo).forEach(([k,fc])=>fc.features?.forEach(f=>walk(f.geometry.coordinates,k)));return bad
}
function runSelfTest(){
 const r={links:APP.links.length,nodes:APP.nodes.length,splices:APP.splices.length,services:APP.services.length,bad_coordinates:coordinateQA().length};
 const old={...layerState};Object.keys(layerState).forEach(k=>layerState[k]=false);drawMap();r.all_off=Object.keys(mapLayers).filter(k=>k!=='failed').length===0&&!map.hasLayer(activeBm);Object.assign(layerState,old);initialTrace();drawMap();r.primary_trace=traceState.primary.length>0;r.backup_trace=traceState.backup.length>0;const e=APP.links[0];selectEntity(e,true);r.detail_open=$('detailDrawer').classList.contains('open');$('detailDrawer').classList.remove('open');selected.clear();drawMap();document.body.dataset.p09Selftest=JSON.stringify(r);return r
}
