ting zones output","why":"Create stable administrative/planning reporting units."},{"step_no":3,"stage":"Compile authoritative facility inventory","input":"Controlled source data / previous-stage outputs","gis_method":"Geocoding / asset register","output":"Compile authoritative facility inventory output","why":"Create validated facility locations, type, status and service metadata."},{"step_no":4,"stage":"Standardize facility taxonomy","input":"Controlled source data / previous-stage outputs","gis_method":"Domains / subtypes","output":"Standardize facility taxonomy output","why":"Ensure consistent public-service categories."},{"step_no":5,"stage":"Prepare road / pedestrian network","input":"Controlled source data / previous-stage outputs","gis_method":"Network Dataset / topology","output":"road / pedestrian network output","why":"Create connected streets, walk links, bridges and restrictions."},{"step_no":6,"stage":"Model physical barriers","input":"Controlled source data / previous-stage outputs","gis_method":"Barriers / restricted edges","output":"Model physical barriers output","why":"Represent canals, rivers, railways and inaccessible crossings."},{"step_no":7,"stage":"Define travel modes","input":"Controlled source data / previous-stage outputs","gis_method":"Network Analyst travel modes","output":"travel modes output","why":"Set walking/driving speeds, restrictions and impedance."},{"step_no":8,"stage":"Prepare public transport inputs where available","input":"Controlled source data / previous-stage outputs","gis_method":"GTFS / multimodal network","output":"public transport inputs where available output","why":"Add transit accessibility for production scenarios."},{"step_no":9,"stage":"Prepare population / demand grid","input":"Controlled source data / previous-stage outputs","gis_method":"Dasymetric allocation / census-to-grid","output":"population / demand grid output","why":"Create fine-grained demand origins."},{"step_no":10,"stage":"Segment demand by service need","input":"Controlled source data / previous-stage outputs","gis_method":"Field calculations","output":"Segment demand by service need output","why":"Estimate school-age, elderly, mobility-limited and other relevant groups."},{"step_no":11,"stage":"Build social-vulnerability indicators","input":"Controlled source data / previous-stage outputs","gis_method":"Normalize / weighted index","output":"Build social-vulnerability indicators output","why":"Create equity attributes for underserved-population analysis."},{"step_no":12,"stage":"Snap demand and facilities to network","input":"Controlled source data / previous-stage outputs","gis_method":"Near / Locate Features Along Routes","output":"Snap demand and facilities to network output","why":"Associate origins/facilities with routable network nodes."},{"step_no":13,"stage":"Define service standards","input":"Controlled source data / previous-stage outputs","gis_method":"Standards table","output":"service standards output","why":"Set travel-time thresholds by service and mode."},{"step_no":14,"stage":"Create origin-destination cost matrix","input":"Controlled source data / previous-stage outputs","gis_method":"OD Cost Matrix","output":"Create origin-destination cost matrix output","why":"Calculate network travel time from demand cells to facilities."},{"step_no":15,"stage":"Calculate nearest facility","input":"Controlled source data / previous-stage outputs","gis_method":"Closest Facility","output":"Calculate nearest facility output","why":"Identify nearest reachable public service for each demand cell."},{"step_no":16,"stage":"Generate time-based service areas","input":"Controlled source data / previous-stage outputs","gis_method":"Service Area","output":"Generate time-based service areas output","why":"Create 5/10/15/20/30-minute catchments."},{"step_no":17,"stage":"Calculate simple population coverage","input":"Controlled source data / previous-stage outputs","gis_method":"Spatial Join / Summarize Within","ou puts","gis_method":"Spatial Join / Tabulate Area","output":"Summarize gaps by zone output","why":"Report uncovered people, vulnerable groups and gap area."},{"step_no":26,"stage":"Identify isolated / barrier-driven gaps","input":"Controlled source data / previous-stage outputs","gis_method":"Network comparison","output":"Identify isolated / barrier-driven gaps output","why":"Distinguish straight-line proximity from network inaccessibility."},{"step_no":27,"stage":"Run facility disruption scenario","input":"Controlled source data / previous-stage outputs","gis_method":"Network barrier / facility closure","output":"Run facility disruption scenario output","why":"Measure resilience when a key facility becomes unavailable."},{"step_no":28,"stage":"Run capacity-expansion scenario","input":"Controlled source data / previous-stage outputs","gis_method":"Scenario parameter","output":"Run capacity-expansion scenario output","why":"Test staffing/hours/capacity uplift without new construction."},{"step_no":29,"stage":"Generate candidate facility sites","input":"Controlled source data / previous-stage outputs","gis_method":"Suitability / planning parcels / network nodes","output":"Generate candidate facility sites output","why":"Create plausible new-service candidate locations."},{"step_no":30,"stage":"Run location-allocation screening","input":"Controlled source data / previous-stage outputs","gis_method":"Location-Allocation Maximize Coverage","output":"Run location-allocation screening output","why":"Rank candidate sites by additional demand/equity coverage."},{"step_no":31,"stage":"Calculate marginal coverage gain","input":"Controlled source data / previous-stage outputs","gis_method":"Scenario comparison","output":"Calculate marginal coverage gain output","why":"Measure people and priority groups newly covered by candidate sites."},{"step_no":32,"stage":"Compare scenarios","input":"Controlled source data / previous-stage outputs","gis_method":"Dashboard delta metrics","out ArcGIS Enterprise / Online Web GIS","QGIS + QNEAT3 / ORS Tools alternatives","PostGIS + pgRouting alternative","Single-file Leaflet Web GIS"],"assumptions":["Travel speeds, service standards, capacities, opening hours, populations and vulnerability values are synthetic demonstration assumptions.","Capacity-aware allocation uses simplified service-demand units and does not model queues, appointment systems or detailed staffing rosters.","Accessibility is network-based; straight-line distance is not treated as equivalent to real access.","Equity priority is a planning-screening score, not a legal entitlement or funding formula.","Real projects require authoritative facility, road, population, disability, operating-hours and service-standard data."]},"data":[{"name":"Demand Grid","type":"Polygon / Origin points","role":"Fine-grained population and service-demand origins.","fields":"cell_id, population, age groups, low-income proxy, mobility-limited proxy, SVI, road_node"},{"name":"Public Service Facilities","type":"Point","role":"Existing facilities with type, status, capacity, quality and service hours.","fields":"facility_id, service_id, status, capacity_units, quality, staffing, opening_hours, road_node"},{"name":"Road / Pedestrian Network","type":"Polyline + Graph","role":"Network travel impedance and barrier-aware routing.","fields":"road_id, endpoints, class, walk_speed, drive_speed, bridge, length"},{"name":"Mobility Barrier","type":"Polygon","role":"Canal/barrier that can only be crossed using mapped bridge segments.","fields":"barrier_id, name, crossing_policy"},{"name":"Planning Zones","type":"Polygon","role":"Equity and coverage reporting areas.","fields":"zone_id, population, SVI, income/age/mobility proxies"},{"name":"Service Standards","type":"Table","role":"Travel-time thresholds and demand factors by service.","fields":"service_id, preferred_mode, walk_threshold, drive_threshold, demand_factor"},{"name":"Candidate Sites","type":"Point","role":"Potential function allocateWithFacilities(facs,capAware=capacityAware){
 const loads={};facs.forEach(f=>loads[f.facility_id]={facility_id:f.facility_id,allocated_units:0,effective_capacity:num(f.effective_capacity||f.capacity_units),allocated_population:0,cell_count:0});
 const maxPop=Math.max(...APP.demand.map(d=>num(d.population)),1),rows=[];
 const ordered=[...APP.demand].sort((a,b)=>num(b.social_vulnerability_index)-num(a.social_vulnerability_index)||num(b.population)-num(a.population));
 for(const d of ordered){
   const du=demandUnits(d),times=facs.map(f=>({f,time:nodeTime(d.road_node,f.road_node)})).filter(x=>Number.isFinite(x.time)).sort((a,b)=>a.time-b.time);
   const nearest=times[0]||null,nearestTime=nearest?nearest.time:Infinity;
   const within=times.filter(x=>x.time<=thresholdMin);
   let served=0,primary=null;
   if(capAware){
     for(const x of within){
       const L=loads[x.f.facility_id],remaining=Math.max(0,L.effective_capacity-L.allocated_units);
       if(remaining<=0)continue;
       const take=Math.min(du-served,remaining);

       if(served>=du-.0001)break
     }
   }else if(within.length){
     primary=within[0].f;served=du;const L=loads[primary.facility_id];L.allocated_units+=du;L.allocated_population+=num(d.population);L.cell_count+=1
   }
   const fraction=Math.max(0,Math.min(1,served/Math.max(.0001,du)));
   let status='Gap',reason='Travel-time gap';

   else if(!nearest){reason='No reachable facility'}
   const redundancy=times.filter(x=>x.time<=thresholdMin).length;
   const accessScore=Number.isFinite(nearestTime)?Math.max(0,100*(1-nearestTime/(2*Math.max(1,thresholdMin)))):0;
   const redDef=redundancy===0?100:redundancy===1?70:redundancy===2?35:0;
   const equity=.40*(100-accessScore)+.30*num(d.social_vulnerability_index)+.20*(num(d.population)/maxPop*100)+.10*redDef;
   rows.push({...d,demand_units:Math.round(du*10)/10,served_units:Math.round(served*10)/10,coverage_fraction:Math.round(fraction*1000)/1000,
              nearest_facility_id:primary?.facility_id||nearest?.f.facility_id||'',nearest_facility_name:primary?.facility_name||nearest?.f.facility_name||'',

 }

function candidateRanking(baseRows){

   let rem=num(c.proposed_capacity_units),weighted=0,popGain=0,unitsGain=0,coveredCells=0;
   const choices=gaps.map(r=>({r,time:nodeTime(r.road_node,c.road_node)})).filter(x=>x.time<=thresholdMin).sort((a,b)=>b.r.equity_priority-a.r.equity_priority||a.time-b.time);
   for(const x of choices){if(rem<=0)break;const need=Math.max(0,num(x.r.demand_units)-num(x.r.served_units)),take=Math.min(rem,need);if(take<=0)continue;const frac=take/Math.max(.001,num(x.r.demand_units));rem-=take;unitsGain+=take;popGain+=num(x.r.population)*frac;weighted+=take*(1+num(x.r.social_vulnerability_index)/100*.65);coveredCells++}

function shortestPath(start,end,mode=travelMode){
 const g={};APP.roadNodes.forEach(n=>g[n.node_id]=[]);
 APP.roads.forEach(r=>{const w=edgeMinutes(r,mode);g[r.from_node].push({to:r.to_node,id:r.road_id,w});g[r.to_node].push({to:r.from_node,id:r.road_id,w})});
 const dist={[start]:0},prev={},q=[[0,start]];
 while(q.length){q.sort((a,b)=>a[0]-b[0]);const [d,u]=q.shift();if(d!==dist[u])continue;if(u===end)break;for(const e of g[u]||[]){const nd=d+e.w;if(nd<(dist[e.to]??Infinity)){dist[e.to]=nd;prev[e.to]={node:u,road:e.id};q.push([nd,e.to])}}}
 if(dist[end]===undefined)return null;const roads=[],nodes=[end];let cur=end;while(cur!==start){const p=prev[cur];if(!p)return null;roads.unshift(p.road);cur=p.node;nodes.unshift(cur)}return{minutes:dist[end],roads,nodes}
}

 const p=shortestPath(r.road_node,f.road_node);if(!p){toast('No network route available');return}
 routeRoadIds=p.roads;routeLabel=`${r.cell_id} → ${f.facility_name}`;drawMap();const fs=APP.geo.roads.features.filter(x=>p.roads.includes(x.properties.road_id));if(fs.length){const b=L.geoJSON({type:'FeatureCollection',features:fs}).getBounds();if(b.isValid())map.fitBounds(b.pad(.18),{maxZoom:14})};toast(`Route shown · ${fmt(p.minutes,' min')}`)
}
